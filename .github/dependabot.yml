version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    # Pydantic pins pydantic-core to an exact version: update them together.
    groups:
      pydantic-family:
        applies-to: version-updates
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      pydantic-family-security:
        applies-to: security-updates
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/cloudflare"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Oslo"
    # Stay within frontend/package.json engines: >=22.12 <23.
    # Dependabot can still propose Node 22 patch/tag or digest updates.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3
