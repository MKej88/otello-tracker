name: Apply overview events performance patch

on:
  push:
    branches:
      - perf/overview-events-bootstrap
    paths:
      - .github/workflows/tmp-overview-events-performance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/overview-events-bootstrap
          persist-credentials: true

      - name: Patch overview event fast path
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path_str: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: expected one match, got {count}: {old[:120]!r}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          patch(
              "cloudflare/src/app.py",
              [
                  (
                      '    "/api/brazil/dashboard": ("public, max-age=300", "public, max-age=1800, stale-while-revalidate=3600"),\n',
                      '    "/api/overview/events": ("public, max-age=60", "public, max-age=300, stale-while-revalidate=1800"),\n'
                      '    "/api/brazil/dashboard": ("public, max-age=300", "public, max-age=1800, stale-while-revalidate=3600"),\n',
                  ),
                  (
                      '@app.get("/api/brazil/dashboard")\nasync def get_brazil_dashboard(',
                      '@app.get("/api/overview/events")\n'
                      'async def get_overview_events(\n'
                      '    request: Request,\n'
                      '    as_of_date: str | None = Query(default=None, pattern=r"^\\d{4}-\\d{2}-\\d{2}$"),\n'
                      ') -> dict:\n'
                      '    from overview_events import overview_events\n\n'
                      '    repository = _repository(request)\n'
                      '    try:\n'
                      '        if as_of_date is None:\n'
                      '            cached = await dashboard_hot_component(repository, "events")\n'
                      '            if cached is not None:\n'
                      '                return cached\n'
                      '        return await overview_events(repository, as_of_date=as_of_date)\n'
                      '    except ValueError as exc:\n'
                      '        raise HTTPException(status_code=422, detail="Invalid as_of_date") from exc\n\n\n'
                      '@app.get("/api/brazil/dashboard")\nasync def get_brazil_dashboard(',
                  ),
              ],
          )

          patch(
              "cloudflare/src/dashboard_hot_snapshot.py",
              [
                  (
                      'async def buyback_forecast(\n    repository: Any, *args: Any, **kwargs: Any\n) -> dict[str, Any]:\n    try:\n        from .buyback_service import buyback_forecast as implementation\n    except ImportError:\n        from buyback_service import buyback_forecast as implementation\n    return await implementation(repository, *args, **kwargs)\n\n\n',
                      'async def buyback_forecast(\n    repository: Any, *args: Any, **kwargs: Any\n) -> dict[str, Any]:\n    try:\n        from .buyback_service import buyback_forecast as implementation\n    except ImportError:\n        from buyback_service import buyback_forecast as implementation\n    return await implementation(repository, *args, **kwargs)\n\n\n'
                      'async def overview_events(repository: Any) -> dict[str, Any]:\n'
                      '    try:\n'
                      '        from .overview_events import overview_events as implementation\n'
                      '    except ImportError:\n'
                      '        from overview_events import overview_events as implementation\n'
                      '    return await implementation(repository)\n\n\n',
                  ),
                  ('STATE_KEY = "dashboard_hot_snapshot_v6"', 'STATE_KEY = "dashboard_hot_snapshot_v7"'),
                  ('SNAPSHOT_VERSION = 6', 'SNAPSHOT_VERSION = 7'),
                  (
                      '_COMPONENTS = {"summary", "economic", "quotes", "forecast"}',
                      '_COMPONENTS = {"summary", "economic", "quotes", "forecast", "events"}',
                  ),
                  (
                      '    # These four sections do not depend on each other. Starting them together keeps a\n'
                      '    # missing-snapshot fallback from making a first-time visitor wait for four separate\n'
                      '    # calculation chains one after another.\n'
                      '    summary, economic, quotes, forecast = await asyncio.gather(\n'
                      '        build_summary(),\n'
                      '        economic_nav_summary(repository),\n'
                      '        market_quote_details(repository),\n'
                      '        buyback_forecast(repository),\n'
                      '    )\n',
                      '    # First-screen sections do not depend on each other. Build them concurrently so\n'
                      '    # a missing snapshot never serializes independent calculation/read chains.\n'
                      '    summary, economic, quotes, forecast, events = await asyncio.gather(\n'
                      '        build_summary(),\n'
                      '        economic_nav_summary(repository),\n'
                      '        market_quote_details(repository),\n'
                      '        buyback_forecast(repository),\n'
                      '        overview_events(repository),\n'
                      '    )\n',
                  ),
                  (
                      '            "forecast": forecast,\n',
                      '            "forecast": forecast,\n            "events": events,\n',
                  ),
                  (
                      '        "forecast": snapshot["forecast"],\n        "meta": {',
                      '        "forecast": snapshot["forecast"],\n        "events": snapshot["events"],\n        "meta": {',
                  ),
              ],
          )

          patch(
              "frontend/src/dashboardBootstrapFetch.ts",
              [
                  (
                      'export type BootstrapComponent = "summary" | "economic" | "quotes" | "forecast";',
                      'export type BootstrapComponent = "summary" | "economic" | "quotes" | "forecast" | "events";',
                  ),
                  (
                      '  forecast?: unknown;\n  meta?: {',
                      '  forecast?: unknown;\n  events?: unknown;\n  meta?: {',
                  ),
                  (
                      '  "/api/market/quotes": "quotes",\n  "/api/buybacks/forecast": "forecast"\n};',
                      '  "/api/market/quotes": "quotes",\n  "/api/buybacks/forecast": "forecast",\n  "/api/overview/events": "events"\n};',
                  ),
                  ('const CLIENT_CACHE_KEY = "otello.dashboard.bootstrap.v1";', 'const CLIENT_CACHE_KEY = "otello.dashboard.bootstrap.v2";'),
                  ('const CLIENT_CACHE_VERSION = 1;', 'const CLIENT_CACHE_VERSION = 2;'),
                  (
                      '    && isObject(payload.quotes)\n    && isObject(payload.forecast);',
                      '    && isObject(payload.quotes)\n    && isObject(payload.forecast)\n    && isObject(payload.events);',
                  ),
              ],
          )

          patch(
              "frontend/src/OverviewPage.tsx",
              [
                  (
                      'type NewsEventsPayload = {\n  ready: boolean;\n  events?: NewsEvent[];\n};',
                      'type OverviewEventsPayload = {\n  ready: boolean;\n  events?: NewsEvent[];\n  calendar?: BrazilCalendarEvent[];\n};',
                  ),
                  (
                      'type BrazilCalendarPayload = {\n  calendar?: BrazilCalendarEvent[];\n};\n\n',
                      '',
                  ),
                  (
                      'function upcomingEvents(\n  companyPayload?: NewsEventsPayload | null,\n  brazilPayload?: BrazilCalendarPayload | null,\n): OverviewEvent[] {',
                      'function upcomingEvents(payload?: OverviewEventsPayload | null): OverviewEvent[] {',
                  ),
                  (
                      '  for (const event of companyPayload?.events ?? []) {',
                      '  for (const event of payload?.events ?? []) {',
                  ),
                  (
                      '  for (const event of brazilPayload?.calendar ?? []) {',
                      '  for (const event of payload?.calendar ?? []) {',
                  ),
                  (
                      '  const { data: newsEvents } = usePollingResource<NewsEventsPayload>(\n'
                      '    "/api/news-events",\n'
                      '    EVENT_REFRESH_MS,\n'
                      '    true,\n'
                      '  );\n'
                      '  const { data: brazilCalendar } = usePollingResource<BrazilCalendarPayload>(\n'
                      '    "/api/brazil/dashboard",\n'
                      '    EVENT_REFRESH_MS,\n'
                      '    true,\n'
                      '  );',
                      '  const { data: overviewEvents } = usePollingResource<OverviewEventsPayload>(\n'
                      '    "/api/overview/events",\n'
                      '    EVENT_REFRESH_MS,\n'
                      '    true,\n'
                      '  );',
                  ),
                  (
                      '  const events = upcomingEvents(newsEvents, brazilCalendar);',
                      '  const events = upcomingEvents(overviewEvents);',
                  ),
              ],
          )

          patch(
              "cloudflare/tests/test_dashboard_hot_snapshot_freshness.py",
              [
                  (
                      '        patch(\n            "src.dashboard_hot_snapshot.buyback_forecast",\n            new=AsyncMock(return_value={"ready": True}),\n        ),\n',
                      '        patch(\n            "src.dashboard_hot_snapshot.buyback_forecast",\n            new=AsyncMock(return_value={"ready": True}),\n        ),\n'
                      '        patch(\n            "src.dashboard_hot_snapshot.overview_events",\n            new=AsyncMock(return_value={"ready": True, "events": [], "calendar": []}),\n        ),\n',
                  ),
              ],
          )
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-overview-events-performance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/app.py cloudflare/src/dashboard_hot_snapshot.py \
            frontend/src/dashboardBootstrapFetch.ts frontend/src/OverviewPage.tsx \
            cloudflare/tests/test_dashboard_hot_snapshot_freshness.py \
            .github/workflows/tmp-overview-events-performance.yml
          git commit -m "Last viktige datoer fra hurtigbuffer"
          git push origin HEAD:perf/overview-events-bootstrap
