name: CVM IPE diagnostic

on:
  push:
    branches: [phase-10-bemobi-news-ingest]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect official CVM 2026 IPE archive
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          import zipfile

          url = 'https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/IPE/DADOS/ipe_cia_aberta_2026.zip'
          req = urllib.request.Request(url, headers={'User-Agent': 'otello-tracker/1.0 private research'})
          with urllib.request.urlopen(req, timeout=60) as response:
              payload = response.read()
          print('BYTES', len(payload))
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              print('MEMBERS', archive.namelist())
              member = next(name for name in archive.namelist() if not name.endswith('/'))
              raw = archive.read(member)
          for encoding in ('utf-8-sig', 'cp1252', 'latin-1'):
              try:
                  text = raw.decode(encoding)
                  print('ENCODING', encoding)
                  break
              except UnicodeDecodeError:
                  pass
          first = text.splitlines()[0]
          delimiter = ';' if first.count(';') >= first.count(',') else ','
          reader = csv.DictReader(io.StringIO(text), delimiter=delimiter)
          print('HEADER', reader.fieldnames)
          count = 0
          for row in reader:
              joined = ' | '.join(str(v) for v in row.values()).upper()
              if 'BEMOBI' in joined:
                  count += 1
                  print('BEMOBI_ROW', {k: v for k, v in row.items()})
          print('BEMOBI_COUNT', count)
          PY
