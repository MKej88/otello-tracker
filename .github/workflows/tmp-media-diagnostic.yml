name: Apply media feed fix

on:
  push:
    branches:
      - fix/media-feed-failures
    paths:
      - .github/workflows/tmp-media-diagnostic.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/media-feed-failures
          persist-credentials: true

      - name: Apply targeted media-source fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, got {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          media_path = "cloudflare/src/bemobi_media_news.py"
          replace_once(
              media_path,
              "SEARCH_FEED_SOURCES = frozenset({GOOGLE_NEWS_SOURCE, BING_NEWS_SOURCE})",
              "SEARCH_FEED_SOURCES = frozenset({BING_NEWS_SOURCE})",
          )
          replace_once(
              media_path,
              '''# Direct publisher feeds give richer snippets when available. Search feeds are
          # deliberately duplicated across Google/Bing for coverage, but query membership
          # alone is never treated as proof that an item is relevant.
          FEEDS = (
              ("InfoMoney", "https://www.infomoney.com.br/feed/"),
              ("NeoFeed", "https://neofeed.com.br/feed/"),
              ("Brazil Journal", "https://braziljournal.com/feed/"),
              ("CNN Brasil", "https://www.cnnbrasil.com.br/tudo-sobre/economia/feed/"),
              *((GOOGLE_NEWS_SOURCE, url) for url in GOOGLE_NEWS_RSS_URLS),
              *((BING_NEWS_SOURCE, url) for url in BING_NEWS_RSS_URLS),
          )''',
              '''# Direct publisher feeds give richer snippets when available. Bing News provides
          # discovery coverage across publishers; every item must still prove explicit Bemobi
          # relevance in its own RSS metadata. Google News helpers are kept for compatibility,
          # but production does not query them because the RSS endpoint returns HTTP 503 from
          # Cloudflare egress. CNN Brasil's former /feed/ URL now serves HTML instead of RSS.
          FEEDS = (
              ("InfoMoney", "https://www.infomoney.com.br/feed/"),
              ("NeoFeed", "https://neofeed.com.br/feed/"),
              ("Brazil Journal", "https://braziljournal.com/feed/"),
              *((BING_NEWS_SOURCE, url) for url in BING_NEWS_RSS_URLS),
          )''',
          )
          replace_once(
              media_path,
              "    Google News and Bing are discovery sources only: every result must independently mention\n",
              "    Bing News is the production discovery source: every result must independently mention\n",
          )
          replace_once(
              media_path,
              "VALUES (?, ?, 'OTHER', 'https://news.google.com/', 0, 1)",
              "VALUES (?, ?, 'OTHER', 'https://www.bing.com/news/', 0, 1)",
          )

          contract_path = "backend/tests/test_bemobi_media_news_contract.py"
          replace_once(
              contract_path,
              "def test_search_queries_are_split_and_redundant_across_google_and_bing() -> None:",
              "def test_bing_is_the_production_search_feed_and_google_is_only_compatibility() -> None:",
          )
          replace_once(
              contract_path,
              '''    assert media.GOOGLE_NEWS_SOURCE in media.SEARCH_FEED_SOURCES
              assert media.BING_NEWS_SOURCE in media.SEARCH_FEED_SOURCES
              assert len(media.FEEDS) == 10''',
              '''    assert media.GOOGLE_NEWS_SOURCE not in media.SEARCH_FEED_SOURCES
              assert media.BING_NEWS_SOURCE in media.SEARCH_FEED_SOURCES
              assert len(media.FEEDS) == 6
              assert all(source != "CNN Brasil" for source, _ in media.FEEDS)
              assert all(source != media.GOOGLE_NEWS_SOURCE for source, _ in media.FEEDS)''',
          )

          news_path = "cloudflare/src/news_events.py"
          replace_once(
              news_path,
              '''def _error_count(metadata: dict[str, Any], error_message: Any) -> int:
              feed_errors = metadata.get("feed_errors")
              translation_errors = metadata.get("translation_errors")
              count = len(feed_errors) if isinstance(feed_errors, list) else 0
              count += len(translation_errors) if isinstance(translation_errors, list) else 0
              if count == 0 and str(error_message or "").strip():
                  count = 1
              return count
          ''',
              '''def _error_count(metadata: dict[str, Any], error_message: Any) -> int:
              feed_errors = metadata.get("feed_errors")
              translation_errors = metadata.get("translation_errors")
              count = len(feed_errors) if isinstance(feed_errors, list) else 0
              count += len(translation_errors) if isinstance(translation_errors, list) else 0
              if count == 0 and str(error_message or "").strip():
                  count = 1
              return count


          def _media_error_breakdown(metadata: dict[str, Any]) -> dict[str, Any]:
              feed_errors = metadata.get("feed_errors")
              translation_errors = metadata.get("translation_errors")
              feed_items = feed_errors if isinstance(feed_errors, list) else []
              translation_items = (
                  translation_errors if isinstance(translation_errors, list) else []
              )
              failed_sources: list[str] = []
              for item in feed_items:
                  if not isinstance(item, dict):
                      continue
                  source = str(item.get("source") or "").strip()
                  if source and source not in failed_sources:
                      failed_sources.append(source)
              return {
                  "feed_error_count": len(feed_items),
                  "translation_error_count": len(translation_items),
                  "failed_sources": failed_sources,
              }
          ''',
          )
          replace_once(
              news_path,
              '''        "error_count": _error_count(metadata, row.get("error_message")),
                  "initial_backfill": bool(metadata.get("initial_backfill")),''',
              '''        "error_count": _error_count(metadata, row.get("error_message")),
                  **_media_error_breakdown(metadata),
                  "initial_backfill": bool(metadata.get("initial_backfill")),''',
          )

          frontend_path = "frontend/src/NewsEventsPage.tsx"
          replace_once(
              frontend_path,
              '''  error_count?: number;
          };''',
              '''  error_count?: number;
            feed_error_count?: number;
            translation_error_count?: number;
            failed_sources?: string[];
          };''',
          )
          replace_once(
              frontend_path,
              '''  const mediaDegraded = mediaStatus?.status === "PARTIAL" || mediaStatus?.status === "FAILED";
          ''',
              '''  const mediaDegraded = mediaStatus?.status === "PARTIAL" || mediaStatus?.status === "FAILED";
            const failedMediaSources = mediaStatus?.failed_sources ?? [];
          ''',
          )
          replace_once(
              frontend_path,
              '''            <strong>{mediaStatus?.status === "FAILED" ? "Medieinnhentingen feilet" : "Noen mediekilder feilet"}</strong>
                      <span>
                        {mediaCheckedAt ? `Siste sjekk ${dateLabel(mediaCheckedAt, true)}. ` : ""}
                        {mediaStatus?.error_count ? `${mediaStatus.error_count} feil registrert. ` : ""}
                        Dette gjelder mediefeedene; offisielle selskapsmeldinger vises separat.
                      </span>''',
              '''            <strong>{mediaStatus?.status === "FAILED" ? "Medieinnhentingen feilet" : "Noen mediekilder kunne ikke oppdateres"}</strong>
                      <span>
                        {mediaCheckedAt ? `Siste sjekk ${dateLabel(mediaCheckedAt, true)}. ` : ""}
                        {failedMediaSources.length > 0 ? `Berørte kilder: ${failedMediaSources.join(", ")}. ` : ""}
                        {mediaStatus?.translation_error_count ? `${mediaStatus.translation_error_count} treff kunne ikke oversettes. ` : ""}
                        {failedMediaSources.length === 0 && !mediaStatus?.translation_error_count && mediaStatus?.error_count ? `${mediaStatus.error_count} feil registrert. ` : ""}
                        Offisielle selskapsmeldinger påvirkes ikke.
                      </span>''',
          )

          test_path = "cloudflare/tests/test_news_events.py"
          replace_once(
              test_path,
              "from news_events import _company_name, _news_item, news_and_events  # noqa: E402",
              "from news_events import _company_name, _media_refresh_status, _news_item, news_and_events  # noqa: E402",
          )
          marker = "\n\nclass FakeNewsRepository:\n"
          target = Path(test_path)
          text = target.read_text(encoding="utf-8")
          if text.count(marker) != 1:
              raise SystemExit("Could not find FakeNewsRepository insertion point")
          addition = '''

          class MediaStatusRepository:
              async def first(
                  self, query: str, parameters: tuple[object, ...] = ()
              ) -> dict[str, object] | None:
                  assert "FROM job_runs" in query
                  assert parameters == ("bemobi_media_refresh",)
                  return {
                      "started_at": "2026-09-06T12:31:31Z",
                      "finished_at": "2026-09-06T12:32:01Z",
                      "status": "PARTIAL",
                      "records_written": 0,
                      "error_message": None,
                      "metadata_json": (
                          '{"feeds_checked":10,"feed_errors":['
                          '{"source":"Google News Brasil","error":"HTTP 503"},'
                          '{"source":"Google News Brasil","error":"HTTP 503"},'
                          '{"source":"CNN Brasil","error":"ParseError"}],'
                          '"translation_errors":[{"title":"Bemobi","error":"AI"}]}'
                      ),
                  }


          class MediaRefreshStatusTest(unittest.IsolatedAsyncioTestCase):
              async def test_exposes_failed_sources_without_repeating_provider_names(self) -> None:
                  result = await _media_refresh_status(MediaStatusRepository())

                  self.assertEqual(result["error_count"], 4)
                  self.assertEqual(result["feed_error_count"], 3)
                  self.assertEqual(result["translation_error_count"], 1)
                  self.assertEqual(
                      result["failed_sources"], ["Google News Brasil", "CNN Brasil"]
                  )
          '''
          addition = "\n".join(line[10:] if line.startswith("          ") else line for line in addition.splitlines())
          target.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")

          replace_once(
              contract_path,
              '''    assert '"media_status": media_status' in news_source
              assert '"nav_impact": nav_impact' in news_source''',
              '''    assert '"media_status": media_status' in news_source
              assert '"failed_sources": failed_sources' in news_source
              assert '"nav_impact": nav_impact' in news_source''',
          )
          replace_once(
              contract_path,
              '''    assert 'media_status?: MediaStatus' in frontend_source
              assert 'paywall_likely?: boolean' in frontend_source''',
              '''    assert 'media_status?: MediaStatus' in frontend_source
              assert 'failed_sources?: string[]' in frontend_source
              assert 'paywall_likely?: boolean' in frontend_source''',
          )
          PY

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-media-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/bemobi_media_news.py cloudflare/src/news_events.py \
            cloudflare/tests/test_news_events.py backend/tests/test_bemobi_media_news_contract.py \
            frontend/src/NewsEventsPage.tsx .github/workflows/tmp-media-diagnostic.yml
          git commit -m "Rett feilende mediekilder og vis presis kildehealth"
          git push origin HEAD:fix/media-feed-failures
