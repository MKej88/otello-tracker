name: Temporary PR191 CI fixes

on:
  push:
    branches:
      - fix/otec-market-activity-backfill

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.event.head_commit.message == 'Kjør CI-rettelser PR191'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-market-activity-backfill
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: python tools/tmp_fix_pr191_ci.py
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r backend/requirements-dev.txt
      - name: Run full backend tests
        working-directory: backend
        run: PYTHONPATH=. python -m pytest -q
      - name: Verify D1 schema and bootstrap
        run: |
          python cloudflare/tools/generate_d1_schema.py --check
          python cloudflare/tools/build_d1_bootstrap_fixture.py --database /tmp/otello-d1-reference.db
          python cloudflare/tools/d1_bootstrap.py export --database /tmp/otello-d1-reference.db --sql /tmp/otello-d1-bootstrap.sql --manifest /tmp/otello-d1-bootstrap.json
          python -m py_compile cloudflare/src/otec_activity.py cloudflare/src/scheduled.py
      - name: Commit clean fixes
        run: |
          rm -f tools/tmp_fix_pr191_ci.py .github/workflows/tmp-fix-pr191-ci.yml
          git config user.name 'MKej88'
          git config user.email 'mads.kristensen2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Rett CI-kontrakter og hold FT-backfill volum-only'
          git push origin HEAD:fix/otec-market-activity-backfill
