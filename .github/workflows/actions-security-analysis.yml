name: GitHub Actions security analysis

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - ".github/**"
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

jobs:
  zizmor:
    name: zizmor GitHub Actions audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: ./.github/
          version: "1.29.0"
          min-severity: medium

  python-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    name: pip-audit known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned pip-audit
        run: python -m pip install --require-hashes -r tools/pip-audit.lock.txt
      - name: Audit backend dependencies
        run: python -m pip_audit -r backend/requirements.lock.txt --progress-spinner off
      - name: Audit Cloudflare runtime dependencies
        run: python -m pip_audit cloudflare --progress-spinner off
