name: Temporary Life360 historical patch v2

on:
  push:
    branches:
      - fix/life360-historical-mark-to-market
    paths:
      - .github/workflows/tmp-life360-historical-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life360-historical-mark-to-market
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          # Yahoo is a repair source, not the NAV freshness rule. Fetch enough history
          # to self-heal a missing one-month start point when Yahoo becomes available.
          p = Path('cloudflare/src/life360_market_data.py')
          t = p.read_text()
          assert t.count('RECENT_LOOKBACK_DAYS = 21') == 1
          p.write_text(t.replace('RECENT_LOOKBACK_DAYS = 21', 'RECENT_LOOKBACK_DAYS = 45'))

          # Persist all valid rows returned by the Life360 IR/LSEG table. Keep the existing
          # 7-day select_fresh_close guard unchanged for current-quote eligibility.
          p = Path('cloudflare/src/life360_ir_lseg.py')
          t = p.read_text()
          constants = 'MAX_RESPONSE_BYTES = 2 * 1024 * 1024\nMAX_FALLBACK_AGE_DAYS = 7\n'
          assert t.count(constants) == 1
          t = t.replace(
              constants,
              constants
              + 'D1_MAX_BOUND_PARAMETERS = 100\n'
              + 'BOUND_PARAMETERS_PER_ROW = 7\n'
              + 'WRITE_BATCH_ROWS = D1_MAX_BOUND_PARAMETERS // BOUND_PARAMETERS_PER_ROW\n',
          )
          start_marker = '    await repository.run(\n        """\n        INSERT INTO market_prices('
          end_marker = '    age_days = (\n'
          start = t.index(start_marker)
          end = t.index(end_marker, start)
          replacement = '''    eligible_rows = [row for row in rows if row["trading_date"] <= target_date]
              written = 0
              for offset in range(0, len(eligible_rows), WRITE_BATCH_ROWS):
                  chunk = eligible_rows[offset : offset + WRITE_BATCH_ROWS]
                  values_sql = ",".join(
                      "(?, ?, ?, 'CLOSE', ?, 'USD', ?, ?, 'DIRECT', ?)" for _ in chunk
                  )
                  parameters: list[Any] = []
                  for row in chunk:
                      parameters.extend(
                          (
                              instrument_id,
                              row["observed_at"],
                              row["trading_date"],
                              row["price"],
                              source_id,
                              document_id,
                              metadata_json,
                          )
                      )
                  await repository.run(
                      f"""
                      INSERT INTO market_prices(
                          instrument_id, observed_at, trading_date, price_type, price, currency,
                          source_id, source_document_id, quality, metadata_json
                      ) VALUES {values_sql}
                      ON CONFLICT(instrument_id, observed_at, price_type, source_id)
                      DO UPDATE SET
                          trading_date=excluded.trading_date,
                          price=excluded.price,
                          currency=excluded.currency,
                          source_document_id=excluded.source_document_id,
                          quality=excluded.quality,
                          metadata_json=excluded.metadata_json
                      """,
                      tuple(parameters),
                  )
                  written += len(chunk)
          '''
          t = t[:start] + replacement + t[end:]
          assert t.count('"rows_written": 1,') == 1
          t = t.replace('"rows_written": 1,', '"rows_written": written,')
          p.write_text(t)

          # Keep backend/D1 data migrations byte-identical for this source-backed backfill.
          backend_migration = Path('backend/app/db/migrations/0028_life360_price_backfill.sql')
          d1_migration = Path('cloudflare/migrations/0020_life360_price_backfill.sql')
          assert backend_migration.exists()
          shutil.copyfile(backend_migration, d1_migration)

          # Focused regression tests without touching existing test expectations.
          p = Path('backend/tests/test_life360_market_data.py')
          t = p.read_text()
          marker = 'def test_yahoo_repair_window_covers_one_month_history() -> None:'
          if marker not in t:
              t += '''

          def test_yahoo_repair_window_covers_one_month_history() -> None:
              assert life360_market_data.RECENT_LOOKBACK_DAYS == 45
          '''
          p.write_text(t)

          p = Path('backend/tests/test_life360_ir_lseg.py')
          t = p.read_text()
          marker = 'def test_ir_history_persists_all_rows_in_d1_safe_batches() -> None:'
          if marker not in t:
              t += '''

          def test_ir_history_persists_all_rows_in_d1_safe_batches() -> None:
              import life360_ir_lseg as ir
              from datetime import date, timedelta

              start = date(2026, 8, 1)
              body = [
                  "<html><body><table>",
                  "<tr><th>Date Requested</th><th>Closing Price</th></tr>",
              ]
              for offset in range(30):
                  day = start + timedelta(days=offset)
                  body.append(
                      f"<tr><td>{day.strftime('%B %d, %Y')}</td>"
                      f"<td>${50 + offset / 100:.2f}</td></tr>"
                  )
              body.extend(["</table>", "<p>Data provided by LSEG.</p>", "</body></html>"])
              payload = "".join(body).encode()
              repository = FakeRepository()

              async def fake_fetch(url: str, **kwargs):
                  assert url == LIFE360_IR_HISTORY_URL
                  return FakeResponse(payload)

              result = asyncio.run(
                  refresh_life360_ir_lif(
                      repository,
                      target_date="2026-08-30",
                      fetcher=fake_fetch,
                  )
              )

              assert ir.MAX_FALLBACK_AGE_DAYS == 7
              assert ir.BOUND_PARAMETERS_PER_ROW == 7
              assert ir.WRITE_BATCH_ROWS == 14
              assert ir.WRITE_BATCH_ROWS * ir.BOUND_PARAMETERS_PER_ROW <= ir.D1_MAX_BOUND_PARAMETERS
              assert result["rows_written"] == 30
              assert [len(parameters) for _, parameters in repository.runs] == [98, 98, 14]
              assert max(len(parameters) for _, parameters in repository.runs) <= ir.D1_MAX_BOUND_PARAMETERS
          '''
          p.write_text(t)

          p = Path('backend/tests/test_life360_price_backfill_migration.py')
          p.write_text('''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[2]\nBACKEND = ROOT / "backend/app/db/migrations/0028_life360_price_backfill.sql"\nD1 = ROOT / "cloudflare/migrations/0020_life360_price_backfill.sql"\nEXPECTED = {\n    "2026-07-27": "53.83",\n    "2026-07-28": "56.68",\n    "2026-07-29": "55.29",\n    "2026-07-30": "55.68",\n    "2026-07-31": "54.05",\n}\n\n\ndef test_life360_price_backfill_is_source_backed_and_parity_matched() -> None:\n    backend = BACKEND.read_text()\n    d1 = D1.read_text()\n    assert backend == d1\n    assert "FINANCECHARTS" in d1\n    assert "financecharts.com/stocks/LIF/summary/price" in d1\n    assert "stockanalysis.com/stocks/lif/history/" in d1\n    assert "RECONSTRUCTED" in d1\n    assert "mp.trading_date < '2026-07-27'" in d1\n    for trading_date, close in EXPECTED.items():\n        assert trading_date in d1\n        assert f"'{close}'" in d1\n\n\ndef test_life360_price_backfill_is_idempotent_by_source_and_day() -> None:\n    sql = D1.read_text()\n    assert sql.count("SELECT 1 FROM market_prices existing") == len(EXPECTED)\n    assert "existing.source_id=s.id" in sql\n    assert "existing.price_type='CLOSE'" in sql\n''')
          PY

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r backend/requirements.txt pytest

      - name: Run focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=backend python -m pytest -q \
            backend/tests/test_life360_market_data.py \
            backend/tests/test_life360_ir_lseg.py \
            backend/tests/test_life360_nav.py \
            backend/tests/test_estimated_nav_life360_composition.py \
            backend/tests/test_life360_price_backfill_migration.py

      - name: Commit final patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-lif-form-diagnostic.yml
          rm -f .github/workflows/tmp-life360-historical-patch.yml
          rm -f .github/workflows/tmp-life360-historical-patch-v2.yml
          git add -A
          git diff --cached --check
          git commit -m 'Reparer historisk Life360 mark-to-market'
          git push origin HEAD:fix/life360-historical-mark-to-market
