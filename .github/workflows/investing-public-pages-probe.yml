name: Investing public Brazil event pages probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/investing-public-pages-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe Investing Brazil event pages from Cloudflare remote Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build isolated Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/investing-pages-probe
          cd /tmp/investing-pages-probe
          cat > worker.mjs <<'EOF'
          const UA = "Mozilla/5.0 (compatible; OtelloTrackerProbe/1.0; +https://otellotracker.com)";
          const targets = [
            ["gdp_qoq", "https://www.investing.com/economic-calendar/brazil-gdp-858"],
            ["gdp_yoy", "https://www.investing.com/economic-calendar/brazilian-gdp-413"],
            ["manufacturing_pmi", "https://www.investing.com/economic-calendar/brazilian-s-p-global-manufacturing-pmi-1476"],
            ["industrial_production_mom", "https://www.investing.com/economic-calendar/industrial-production-1146"],
            ["industrial_production_yoy", "https://www.investing.com/economic-calendar/brazilian-industrial-production-414"],
            ["services_pmi", "https://www.investing.com/economic-calendar/brazilian-s-p-global-services-pmi-1477"],
            ["composite_pmi", "https://www.investing.com/economic-calendar/brazil-markit-composite-purchasing-managers-index-%28pmi%29-1475"],
            ["trade_balance", "https://www.investing.com/economic-calendar/brazilian-trade-balance-412"],
            ["cpi_yoy", "https://www.investing.com/economic-calendar/cpi-410"],
            ["cpi_mom", "https://www.investing.com/economic-calendar/brazil-consumer-price-index-%28cpi%29-mom-1165"],
            ["retail_sales_mom", "https://www.investing.com/economic-calendar/brazilian-retail-sales-861"],
            ["retail_sales_yoy", "https://www.investing.com/economic-calendar/brazilian-retail-sales-416"],
            ["ibc_br", "https://www.investing.com/economic-calendar/brazil---aktiviti-ekonomi-ibc-br-765"],
            ["interest_rate", "https://www.investing.com/economic-calendar/interest-rate-decision-415"],
          ];

          function compact(v) { return String(v ?? "").replace(/\s+/g, " ").trim(); }
          function decode(v) {
            return String(v ?? "").replace(/&nbsp;/gi, " ").replace(/&amp;/gi, "&").replace(/&quot;/gi, '"').replace(/&#x27;|&#39;/gi, "'").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">");
          }
          function strip(v) { return compact(decode(String(v ?? "").replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " "))); }

          function tableRows(html) {
            const rows = [];
            for (const m of String(html || "").matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)) {
              const cells = [...m[1].matchAll(/<td\b[^>]*>([\s\S]*?)<\/td>/gi)].map((c) => strip(c[1]));
              if (cells.length >= 4 && /2026|Sep|Aug|Jul/i.test(cells.join(" "))) rows.push(cells);
              if (rows.length >= 5) break;
            }
            return rows;
          }

          function structuredObjects(html) {
            const normalized = String(html || "").replace(/\\u0026/g, "&").replace(/\\u003c/g, "<").replace(/\\u003e/g, ">").replace(/\\"/g, '"');
            const out = [];
            let pos = 0;
            while (out.length < 8) {
              const idx = normalized.indexOf('"currency":"BRL"', pos);
              if (idx < 0) break;
              const start = Math.max(normalized.lastIndexOf("{", idx), idx - 2500);
              const endBrace = normalized.indexOf("}", idx);
              const end = endBrace >= 0 ? Math.min(endBrace + 1, idx + 5000) : Math.min(normalized.length, idx + 5000);
              const chunk = normalized.slice(start, end);
              const pick = (key) => {
                const m = chunk.match(new RegExp(`"${key}"\\s*:\\s*(?:"([^"]*)"|([^,}]+))`, "i"));
                return m ? compact(m[1] ?? m[2]) : null;
              };
              out.push({event: pick("eventLong") || pick("event"), date: pick("date"), period: pick("period"), forecast: pick("forecast") || pick("consensus"), previous: pick("previous"), actual: pick("actual"), path: pick("path")});
              pos = idx + 15;
            }
            return out;
          }

          async function inspect(id, url) {
            const response = await fetch(url, {redirect: "follow", headers: {"Accept":"text/html,application/xhtml+xml,*/*;q=0.8", "Accept-Language":"en-US,en;q=0.8", "User-Agent":UA}});
            const body = await response.text();
            const title = (body.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [null,null])[1];
            return {id, status: response.status, final_url: response.url, bytes: new TextEncoder().encode(body).length, title: title ? strip(title) : null, structured: structuredObjects(body), rows: tableRows(body)};
          }

          export default {
            async fetch(request) {
              const results = [];
              for (const [id, url] of targets) results.push(await inspect(id, url));
              return Response.json({runtime:"cloudflare-worker-remote-preview", colo:request.cf?.colo || null, fetched_at:new Date().toISOString(), results}, {headers:{"Cache-Control":"no-store"}});
            }
          };
          EOF

          cat > wrangler.jsonc <<'EOF'
          {"$schema":"https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json","name":"otello-investing-public-pages-probe","main":"worker.mjs","compatibility_date":"2026-08-01","workers_dev":true}
          EOF
          npm init -y >/dev/null 2>&1
          npm install --no-save wrangler@4.123.0

      - name: Run public pages probe
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/investing-pages-probe
          ./node_modules/.bin/wrangler dev --remote --ip 127.0.0.1 --port 8787 --config wrangler.jsonc >wrangler.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 60 http://127.0.0.1:8787/ -o result.json; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat wrangler.log || true; exit 1; fi
            sleep 2
          done
          test "$ready" -eq 1
          python -m json.tool result.json
          cat result.json >> "$GITHUB_STEP_SUMMARY"
