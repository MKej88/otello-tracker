name: Production performance (synthetic)

on:
  workflow_dispatch:
  schedule:
    # Sample both a European morning and a market-active evening (UTC).
    - cron: "15 7,19 * * *"
  pull_request:
    paths:
      - .github/workflows/production-performance.yml
      - frontend/tools/production-performance.mjs
      - frontend/tools/performance-trend-core.mjs
      - frontend/tools/performance-trends.mjs
      - frontend/tools/performance-trends.test.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: otello-production-performance
  cancel-in-progress: false

jobs:
  synthetic:
    name: Production API + headless Chrome timings
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      OTELLO_SITE_URL: https://otellotracker.com
      PERF_REPORT_PATH: performance-report.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check Chrome availability
        shell: bash
        run: |
          set -Eeuo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome_bin" ]; then
            echo "::error::Chrome/Chromium unavailable on GitHub runner"
            exit 1
          fi
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"

      - name: Validate trend detection and script syntax
        run: |
          node --check frontend/tools/production-performance.mjs
          node --check frontend/tools/performance-trends.mjs
          node --test frontend/tools/performance-trends.test.mjs

      # PRs only test the scripts locally; rapid pushes otherwise hit
      # Cloudflare rate limits and generate false production alerts.
      - name: Measure live frontend and API response times
        if: github.event_name != 'pull_request'
        run: node frontend/tools/production-performance.mjs

      - name: Compare with last 14 days and report trend
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f "${PERF_REPORT_PATH}" ]; then
            node frontend/tools/performance-trends.mjs
          else
            echo "::warning::Ingen JSON-rapport å sammenligne etter den syntetiske kjøringen."
          fi

      - name: Archive measurement report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: otello-production-performance
          path: performance-report.json
          if-no-files-found: warn
          retention-days: 30
