name: OpenSSF Scorecard

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 6 * * 2"

# Read-only by default. SARIF upload is granted only to the analysis job.
permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze supply-chain security
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Results remain in this repository's Code Scanning; no external publication.
          publish_results: false

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
