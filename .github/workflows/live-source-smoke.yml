name: Live market-source smoke

on:
  push:
    branches: ["phase-4-2-live-source-smoke"]
    paths:
      - ".github/workflows/live-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b3-download:
    name: B3 COTAHIST ${{ matrix.year }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Download and validate BMOB3 year
        env:
          PYTHONPATH: .
          B3_YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.marketdata.b3_cotahist import download_cotahist_year, parse_cotahist_zip_bytes

          year = int(os.environ['B3_YEAR'])
          payload = download_cotahist_year(year)
          prices = parse_cotahist_zip_bytes(payload, 'BMOB3')
          if not prices:
              raise SystemExit(f'Ingen BMOB3-rader funnet for {year}')

          path = Path(f'/tmp/COTAHIST_A{year}.ZIP')
          path.write_bytes(payload)
          print({
              'year': year,
              'rows': len(prices),
              'from': prices[0].trading_date,
              'to': prices[-1].trading_date,
              'first_close': str(prices[0].close),
              'last_close': str(prices[-1].close),
          })
          PY

      - name: Upload B3 source file
        uses: actions/upload-artifact@v4
        with:
          name: b3-${{ matrix.year }}
          path: /tmp/COTAHIST_A${{ matrix.year }}.ZIP
          retention-days: 1

  aggregate:
    name: Aggregate ECB + B3 + CORE NAV
    needs: b3-download
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Download B3 artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: b3-*
          path: /tmp/b3
          merge-multiple: true

      - name: Import ECB and all B3 years
        env:
          PYTHONPATH: .
        run: |
          python -m app.jobs.backfill_market_data \
            --database /tmp/otello-full-market.db \
            --ecb \
            --start 2021-02-10 \
            --end 2026-08-14 \
            --b3-file 2021:/tmp/b3/COTAHIST_A2021.ZIP \
            --b3-file 2022:/tmp/b3/COTAHIST_A2022.ZIP \
            --b3-file 2023:/tmp/b3/COTAHIST_A2023.ZIP \
            --b3-file 2024:/tmp/b3/COTAHIST_A2024.ZIP \
            --b3-file 2025:/tmp/b3/COTAHIST_A2025.ZIP \
            --b3-file 2026:/tmp/b3/COTAHIST_A2026.ZIP \
            --rebuild-nav \
            > /tmp/full-result.json
          cat /tmp/full-result.json

      - name: Verify full official coverage
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY' | tee /tmp/live-source-summary.txt
          import json
          from app.marketdata.backfill import market_data_status
          from app.nav.core_nav import core_nav_status

          db = '/tmp/otello-full-market.db'
          market = market_data_status(db)
          nav = core_nav_status(db)
          print(json.dumps({'market_data': market, 'core_nav': nav}, indent=2))

          assert market['BMOB3']['count'] > 1300, market
          assert market['BMOB3']['from'] <= '2021-02-10', market
          assert market['BMOB3']['to'] >= '2026-08-13', market
          assert market['BRL_NOK']['count'] > 1400, market
          assert market['USD_NOK']['count'] > 1400, market
          assert nav['count'] >= 9, nav
          PY

      - name: Export report-date CORE NAV table
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import csv
          from app.db.connection import get_connection

          db = '/tmp/otello-full-market.db'
          with get_connection(db) as con, open('/tmp/core-nav-anchors.csv', 'w', newline='', encoding='utf-8') as fh:
              writer = csv.writer(fh)
              writer.writerow([
                  'date', 'nav_total_nok', 'nav_per_share_nok', 'otec_price_nok',
                  'discount_pct', 'bemobi_value_nok', 'cash_nok', 'shares_outstanding',
                  'scope', 'status'
              ])
              for row in con.execute('''
                  SELECT substr(as_of_at,1,10), nav_total_nok, nav_per_share_nok,
                         otec_price_nok, discount_pct, bemobi_value_nok,
                         cash_estimate_nok, shares_outstanding, nav_scope, status
                  FROM nav_snapshots
                  WHERE calculation_version = 'core-market-nav-v1'
                  ORDER BY as_of_at
              '''):
                  writer.writerow(row)
          PY

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: full-market-backfill
          path: |
            /tmp/full-result.json
            /tmp/live-source-summary.txt
            /tmp/core-nav-anchors.csv
            /tmp/otello-full-market.db
          retention-days: 1
