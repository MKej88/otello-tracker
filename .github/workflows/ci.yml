name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend reference tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Run reference backend tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  d1-parity:
    name: Cloudflare D1 schema + historical data parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Verify generated D1 schema has no drift
        run: python cloudflare/tools/generate_d1_schema.py --check
      - name: Build deterministic historical reference fixture
        run: >-
          python cloudflare/tools/build_d1_bootstrap_fixture.py
          --database /tmp/otello-d1-reference.db
      - name: Export portable D1 bootstrap package
        run: >-
          python cloudflare/tools/d1_bootstrap.py export
          --database /tmp/otello-d1-reference.db
          --sql /tmp/otello-d1-bootstrap.sql
          --manifest /tmp/otello-d1-bootstrap.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply D1 migrations in local Wrangler runtime
        run: >-
          npx --yes wrangler@4 d1 migrations apply DB
          --local
          --config cloudflare/wrangler.schema-test.jsonc
      - name: Import historical bootstrap into local Wrangler D1
        run: >-
          npx --yes wrangler@4 d1 execute DB
          --local
          --config cloudflare/wrangler.schema-test.jsonc
          --file /tmp/otello-d1-bootstrap.sql
      - name: Verify exact logical D1 parity
        run: >-
          python cloudflare/tools/d1_bootstrap.py verify
          --database cloudflare/.wrangler/state/v3/d1
          --manifest /tmp/otello-d1-bootstrap.json
      - name: Verify D1 foreign keys and reference seed
        run: |
          npx --yes wrangler@4 d1 execute DB --local --config cloudflare/wrangler.schema-test.jsonc --command "PRAGMA foreign_key_check;"
          npx --yes wrangler@4 d1 execute DB --local --config cloudflare/wrangler.schema-test.jsonc --command "SELECT COUNT(*) AS source_count FROM sources; SELECT COUNT(*) AS instrument_count FROM instruments; SELECT COUNT(*) AS nav_count FROM nav_snapshots;"

  worker:
    name: Cloudflare Python Worker API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned Python Worker toolchain
        run: python -m pip install "workers-py[build]==1.16.4"
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.123.0
      - name: Apply schema to Worker local D1
        run: npx wrangler d1 migrations apply DB --local --config wrangler.worker-test.jsonc
      - name: Build Python Worker without deploying
        run: pywrangler deploy --dry-run --config wrangler.worker-test.jsonc --outdir /tmp/otello-worker-dist
      - name: Smoke-test Worker HTTP API against local D1
        run: |
          pywrangler dev --config wrangler.worker-test.jsonc --port 8787 > /tmp/otello-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/worker-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/otello-worker.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:8787/api/dashboard/summary > /tmp/worker-summary.json
          curl -fsS 'http://127.0.0.1:8787/api/dashboard/history?days=365&max_points=300' > /tmp/worker-history.json
          curl -fsS 'http://127.0.0.1:8787/api/buybacks/forecast?as_of_date=2026-08-17' > /tmp/worker-forecast.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/worker-health.json').read_text())
          summary = json.loads(Path('/tmp/worker-summary.json').read_text())
          history = json.loads(Path('/tmp/worker-history.json').read_text())
          forecast = json.loads(Path('/tmp/worker-forecast.json').read_text())
          assert health['status'] == 'ok'
          assert health['environment'] == 'cloudflare'
          assert summary['ready'] is False and summary['data_status'] == 'not_ready'
          assert summary['market_timestamps']['status'] == 'UNKNOWN'
          assert history['ready'] is False and history['points'] == []
          assert forecast['ready'] is False and forecast['status'] == 'NO_ACTIVE_PROGRAM'
          print('Worker HTTP smoke test passed')
          PY

  docker-reference:
    name: Docker regression reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build reference backend/frontend images
        run: docker compose build api web
      - name: Verify nginx reference configuration
        run: docker run --rm --add-host api:127.0.0.1 otello-web:local nginx -t
      - name: Verify backend reference timezone
        run: docker run --rm otello-backend:local python -c "import os, time; assert os.environ.get('TZ') == 'Europe/Oslo'; assert time.tzname[0] in {'CET','CEST'}; print(os.environ['TZ'], time.tzname)"

# Docker remains only a regression/reference implementation and is not the production target.
