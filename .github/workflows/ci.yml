name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend reference tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Run reference backend tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  docker-reference:
    name: Docker regression reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build reference backend/frontend images
        run: docker compose build api web
      - name: Verify nginx reference configuration
        run: docker run --rm --add-host api:127.0.0.1 otello-web:local nginx -t
      - name: Verify backend reference timezone
        run: docker run --rm otello-backend:local python -c "import os, time; assert os.environ.get('TZ') == 'Europe/Oslo'; assert time.tzname[0] in {'CET','CEST'}; print(os.environ['TZ'], time.tzname)"

  phase14-cloudflare-report:
    name: Temporary Phase 14.5 result report
    if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'phase-14-5-cloudflare-native' }}
    needs: [backend, frontend, docker-reference]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Persist compact CI result
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker-reference.result }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          REPORT="backend=${BACKEND_RESULT} frontend=${FRONTEND_RESULT} docker_reference=${DOCKER_RESULT} tested_merge_sha=${GITHUB_SHA}"
          CONTENT="$(printf '%s\n' "$REPORT" | base64 -w0)"
          FILE_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/.phase14-cloudflare-ci-result"
          EXISTING_SHA="$(curl --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${FILE_URL}?ref=${HEAD_BRANCH}" | jq -r '.sha // empty')"
          if [ -n "$EXISTING_SHA" ]; then
            PAYLOAD="$(jq -nc --arg message 'Phase 14.5 CI result [skip ci]' --arg content "$CONTENT" --arg branch "$HEAD_BRANCH" --arg sha "$EXISTING_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}')"
          else
            PAYLOAD="$(jq -nc --arg message 'Phase 14.5 CI result [skip ci]' --arg content "$CONTENT" --arg branch "$HEAD_BRANCH" '{message:$message,content:$content,branch:$branch}')"
          fi
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$FILE_URL" -d "$PAYLOAD" >/dev/null

# Cloudflare Worker/D1 build and deploy jobs are added during Phase 15 once the
# Wrangler project and D1 bindings exist. Docker is retained only as a parity/reference
# implementation during that migration and is not the production target.
