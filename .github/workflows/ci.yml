name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend reference tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Run static Python checks
        run: ruff check --select E9,F63,F7,F82 app ../cloudflare/src
      - name: Run reference backend tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Verify Cloudflare static headers are emitted into dist
        run: |
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "max-age=31536000, immutable" dist/_headers

  d1-parity:
    name: Cloudflare D1 schema + historical data parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Verify generated D1 schema has no drift
        run: python cloudflare/tools/generate_d1_schema.py --check
      - name: Build deterministic historical reference fixture
        run: >-
          python cloudflare/tools/build_d1_bootstrap_fixture.py
          --database /tmp/otello-d1-reference.db
      - name: Export portable D1 bootstrap package
        run: >-
          python cloudflare/tools/d1_bootstrap.py export
          --database /tmp/otello-d1-reference.db
          --sql /tmp/otello-d1-bootstrap.sql
          --manifest /tmp/otello-d1-bootstrap.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply D1 migrations in local Wrangler runtime
        run: >-
          npx --yes wrangler@4.123.0 d1 migrations apply DB
          --local
          --config cloudflare/wrangler.schema-test.jsonc
      - name: Import historical bootstrap into local Wrangler D1
        run: >-
          npx --yes wrangler@4.123.0 d1 execute DB
          --local
          --config cloudflare/wrangler.schema-test.jsonc
          --file /tmp/otello-d1-bootstrap.sql
      - name: Verify exact logical D1 parity
        run: >-
          python cloudflare/tools/d1_bootstrap.py verify
          --database cloudflare/.wrangler/state/v3/d1
          --manifest /tmp/otello-d1-bootstrap.json
      - name: Verify D1 foreign keys, reference seed and performance indexes
        run: |
          npx --yes wrangler@4.123.0 d1 execute DB --local --config cloudflare/wrangler.schema-test.jsonc --command "PRAGMA foreign_key_check;"
          npx --yes wrangler@4.123.0 d1 execute DB --local --config cloudflare/wrangler.schema-test.jsonc --command "SELECT COUNT(*) AS source_count FROM sources; SELECT COUNT(*) AS instrument_count FROM instruments; SELECT COUNT(*) AS nav_count FROM nav_snapshots;"
          npx --yes wrangler@4.123.0 d1 execute DB --local --config cloudflare/wrangler.schema-test.jsonc --command "SELECT name FROM sqlite_master WHERE type='index' AND name IN ('idx_buybacks_program_trade','idx_nav_snapshots_calc_scope_time') ORDER BY name;"

  worker:
    name: Cloudflare Python Worker API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build dashboard static assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install backend and pinned Python Worker tooling
        run: |
          python -m pip install -r ../backend/requirements-dev.txt
          python -m pip install workers-py==1.16.2 uv==0.12.3
          python -m pip check
      - name: Install pinned Wrangler
        run: npm install --no-save wrangler@4.123.0
      - name: Apply schema to Worker local D1
        run: npx wrangler d1 migrations apply DB --local --config wrangler.worker-test.jsonc
      - name: Build populated reference fixture and expected API payloads
        run: >-
          python tools/build_worker_runtime_fixture.py
          --database /tmp/otello-worker-reference.db
          --expected-dir /tmp/otello-worker-expected
      - name: Export populated fixture for D1
        run: >-
          python tools/d1_bootstrap.py export
          --database /tmp/otello-worker-reference.db
          --sql /tmp/otello-worker-bootstrap.sql
          --manifest /tmp/otello-worker-bootstrap.json
      - name: Import populated fixture into actual local Wrangler D1
        run: >-
          npx wrangler d1 execute DB
          --local
          --config wrangler.worker-test.jsonc
          --file /tmp/otello-worker-bootstrap.sql
      - name: Verify populated D1 parity before Worker runtime
        run: >-
          python tools/d1_bootstrap.py verify
          --database .wrangler/state/v3/d1
          --manifest /tmp/otello-worker-bootstrap.json
      - name: Build Python Worker without deploying
        run: pywrangler deploy --dry-run --config wrangler.worker-test.jsonc --outdir /tmp/otello-worker-dist
      - name: Validate scheduled Workflow production config
        run: pywrangler deploy --dry-run --config wrangler.jsonc --outdir /tmp/otello-workflow-dist
      - name: End-to-end Worker HTTP parity, active-view smoke tests, static assets and headers
        run: |
          pywrangler dev --config wrangler.worker-test.jsonc --port 8787 > /tmp/otello-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/worker-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/otello-worker.log
            exit 1
          fi
          curl -fsS -D /tmp/worker-summary.headers http://127.0.0.1:8787/api/dashboard/summary -o /tmp/worker-summary.json
          curl -fsS -D /tmp/worker-economic.headers http://127.0.0.1:8787/api/dashboard/economic -o /tmp/worker-economic.json
          curl -fsS http://127.0.0.1:8787/api/dashboard/waterfall -o /tmp/worker-waterfall.json
          curl -fsS http://127.0.0.1:8787/api/dashboard/report-status -o /tmp/worker-report-status.json
          curl -fsS -D /tmp/worker-history.headers 'http://127.0.0.1:8787/api/dashboard/history?days=365&max_points=300' -o /tmp/worker-history.json
          curl -fsS -D /tmp/worker-forecast.headers 'http://127.0.0.1:8787/api/buybacks/forecast?as_of_date=2026-08-17' -o /tmp/worker-forecast.json
          curl -fsS http://127.0.0.1:8787/api/buybacks/dashboard -o /tmp/worker-buyback-dashboard.json
          curl -fsS http://127.0.0.1:8787/api/bemobi/dashboard -o /tmp/worker-bemobi-dashboard.json
          curl -fsS http://127.0.0.1:8787/api/bemobi/consensus -o /tmp/worker-bemobi-consensus.json
          curl -fsS http://127.0.0.1:8787/api/bemobi/source-status -o /tmp/worker-bemobi-source-status.json
          curl -fsS -D /tmp/worker-quotes.headers http://127.0.0.1:8787/api/market/quotes -o /tmp/worker-quotes.json
          curl -fsS -D /tmp/worker-index.headers http://127.0.0.1:8787/ -o /tmp/worker-index.html
          curl -fsS http://127.0.0.1:8787/dashboard/history > /tmp/worker-spa-fallback.html
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/worker-health.json').read_text())
          actual = {
              'summary': json.loads(Path('/tmp/worker-summary.json').read_text()),
              'economic': json.loads(Path('/tmp/worker-economic.json').read_text()),
              'history': json.loads(Path('/tmp/worker-history.json').read_text()),
              'forecast': json.loads(Path('/tmp/worker-forecast.json').read_text()),
              'quotes': json.loads(Path('/tmp/worker-quotes.json').read_text()),
          }
          active_views = {
              'waterfall': json.loads(Path('/tmp/worker-waterfall.json').read_text()),
              'report_status': json.loads(Path('/tmp/worker-report-status.json').read_text()),
              'buyback_dashboard': json.loads(Path('/tmp/worker-buyback-dashboard.json').read_text()),
              'bemobi_dashboard': json.loads(Path('/tmp/worker-bemobi-dashboard.json').read_text()),
              'bemobi_consensus': json.loads(Path('/tmp/worker-bemobi-consensus.json').read_text()),
              'bemobi_source_status': json.loads(Path('/tmp/worker-bemobi-source-status.json').read_text()),
          }
          expected_dir = Path('/tmp/otello-worker-expected')
          expected = {
              name: json.loads((expected_dir / f'{name}.json').read_text())
              for name in ('summary', 'economic', 'history', 'forecast', 'quotes')
          }
          assert health['status'] == 'ok'
          assert health['environment'] == 'cloudflare'
          assert actual == expected
          assert actual['summary']['ready'] is True
          assert actual['economic']['ready'] is True
          assert actual['economic']['as_of_date'] == actual['summary']['as_of_date']
          assert actual['economic']['conservative_nav_per_share'] <= actual['economic']['nav_per_share']
          assert isinstance(actual['economic'].get('cash_fx'), dict)
          assert actual['history']['ready'] is True and actual['history']['points']
          assert actual['forecast']['ready'] is True
          assert actual['forecast']['status'] != 'INSUFFICIENT_VOLUME_HISTORY'
          assert actual['quotes']['ready'] is True
          assert {'OTEC', 'BMOB3'} <= set(actual['quotes']['symbols'])

          waterfall = active_views['waterfall']
          assert isinstance(waterfall.get('ready'), bool), waterfall
          if waterfall.get('ready'):
              assert isinstance(waterfall.get('components'), list), waterfall
          else:
              assert waterfall.get('reason'), waterfall
          assert isinstance(active_views['report_status'].get('ready'), bool), active_views['report_status']
          assert active_views['report_status'].get('status'), active_views['report_status']
          assert active_views['buyback_dashboard'].get('ready') is True, active_views['buyback_dashboard']
          assert active_views['bemobi_dashboard'].get('ready') is True, active_views['bemobi_dashboard']
          assert active_views['bemobi_consensus'].get('ready') is True, active_views['bemobi_consensus']
          source_status = active_views['bemobi_source_status']
          assert source_status.get('overall_status') in {'OK', 'PARTIAL', 'ERROR', 'UNKNOWN'}, source_status
          assert len(source_status.get('items') or []) == 4, source_status

          index = Path('/tmp/worker-index.html').read_text()
          fallback = Path('/tmp/worker-spa-fallback.html').read_text()
          assert '<title>Otello NAV-oversikt</title>' in index
          assert '<title>Otello NAV-oversikt</title>' in fallback

          index_headers = Path('/tmp/worker-index.headers').read_text().lower()
          summary_headers = Path('/tmp/worker-summary.headers').read_text().lower()
          economic_headers = Path('/tmp/worker-economic.headers').read_text().lower()
          history_headers = Path('/tmp/worker-history.headers').read_text().lower()
          forecast_headers = Path('/tmp/worker-forecast.headers').read_text().lower()
          quotes_headers = Path('/tmp/worker-quotes.headers').read_text().lower()
          assert 'content-security-policy:' in index_headers
          assert 'x-content-type-options: nosniff' in index_headers
          assert 'x-content-type-options: nosniff' in summary_headers
          assert 'x-frame-options: deny' in summary_headers
          assert 'cache-control: public, max-age=15' in summary_headers
          assert 'cache-control: public, max-age=15' in economic_headers
          assert 'cache-control: public, max-age=300' in history_headers
          assert 'cache-control: public, max-age=300' in forecast_headers
          assert 'cache-control: public, max-age=30' in quotes_headers
          print('Populated D1 -> workerd -> HTTP parity, active-view smoke and header test passed')
          PY

  docker-reference:
    name: Docker regression reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build reference backend/frontend images
        run: docker compose build api web
      - name: Verify nginx reference configuration
        run: docker run --rm --add-host api:127.0.0.1 otello-web:local nginx -t
      - name: Verify backend reference timezone
        run: docker run --rm otello-backend:local python -c "import os, time; assert os.environ.get('TZ') == 'Europe/Oslo'; assert time.tzname[0] in {'CET','CEST'}; print(os.environ['TZ'], time.tzname)"

# Docker remains only a regression/reference implementation and is not the production target.
