name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  cloudflare-diagnostic:
    name: Temporary Cloudflare error-tail diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_BASE: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read exact failure tails
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          base_url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/otello-full-refresh/instances"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            "${base_url}?per_page=1&direction=desc" \
            --output recent.json
          instance_id="$(python - <<'PY'
          import json
          with open('recent.json', encoding='utf-8') as f:
              print((json.load(f).get('result') or [])[0]['id'])
          PY
          )"
          encoded="$(python - "$instance_id" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            "${base_url}/${encoded}?order=asc" \
            --output detail.json
          python - <<'PY'
          import json
          with open('detail.json', encoding='utf-8') as f:
              result = json.load(f).get('result') or {}

          def msg(value):
              if isinstance(value, dict):
                  value = value.get('message') or value.get('name') or json.dumps(value)
              return str(value or '')

          print('WORKFLOW_STATUS', result.get('status'))
          overall = msg(result.get('error'))
          if overall:
              print('OVERALL_ERROR_TAIL', overall[-1800:])
          for step in result.get('steps') or []:
              if step.get('success') is False:
                  print('FAILED_STEP', step.get('name'))
                  if step.get('error'):
                      print('STEP_ERROR_TAIL', msg(step.get('error'))[-1800:])
                  for n, attempt in enumerate(step.get('attempts') or [], 1):
                      if attempt.get('error'):
                          print(f'ATTEMPT_{n}_ERROR_TAIL', msg(attempt.get('error'))[-1800:])
          PY
