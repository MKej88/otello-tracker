name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Run tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build api web
      - name: Verify nginx configuration
        run: docker compose run --rm --no-deps --add-host api:127.0.0.1 web nginx -t
      - name: Verify backend production timezone
        run: docker run --rm otello-backend:local python -c "import os, time; assert os.environ.get('TZ') == 'Europe/Oslo'; assert time.tzname[0] in {'CET','CEST'}; print(os.environ['TZ'], time.tzname)"

  phase14-report:
    name: Temporary Phase 14.3 result report
    if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'phase-14-3-security-performance' }}
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Put compact CI result in PR body
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          CURRENT="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$PR_URL")"
          BASE_BODY="$(printf '%s' "$CURRENT" | jq -r '.body // ""' | sed '/<!-- PHASE14_3_CI -->/,$d')"
          REPORT="PHASE14_3_CI backend=${BACKEND_RESULT} frontend=${FRONTEND_RESULT} docker=${DOCKER_RESULT} sha=${GITHUB_SHA}"
          NEW_BODY="${BASE_BODY}

<!-- PHASE14_3_CI -->
${REPORT}"
          PAYLOAD="$(jq -nc --arg body "$NEW_BODY" '{body:$body}')"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$PR_URL" \
            -d "$PAYLOAD" >/dev/null
