name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend reference tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Run reference backend tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  docker-reference:
    name: Docker regression reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build reference backend/frontend images
        run: docker compose build api web
      - name: Verify nginx reference configuration
        run: docker run --rm --add-host api:127.0.0.1 otello-web:local nginx -t
      - name: Verify backend reference timezone
        run: docker run --rm otello-backend:local python -c "import os, time; assert os.environ.get('TZ') == 'Europe/Oslo'; assert time.tzname[0] in {'CET','CEST'}; print(os.environ['TZ'], time.tzname)"

  phase15-generate-schema:
    name: Temporary D1 schema generator
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase-15-1-d1-schema-parity' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Generate consolidated schema
        run: python cloudflare/tools/generate_d1_schema.py
      - name: Commit generated schema when changed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- cloudflare/migrations/0001_initial_schema.sql && git ls-files --error-unmatch cloudflare/migrations/0001_initial_schema.sql >/dev/null 2>&1; then
            exit 0
          fi
          CONTENT="$(base64 -w0 cloudflare/migrations/0001_initial_schema.sql)"
          API_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/cloudflare/migrations/0001_initial_schema.sql"
          EXISTING_SHA="$(curl --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${API_URL}?ref=${HEAD_BRANCH}" | jq -r '.sha // empty')"
          if [ -n "$EXISTING_SHA" ]; then
            PAYLOAD="$(jq -nc --arg message 'Phase 15.1: generate D1 schema [skip ci]' --arg content "$CONTENT" --arg branch "$HEAD_BRANCH" --arg sha "$EXISTING_SHA" '{message:$message,content:$content,branch:$branch,sha:$sha}')"
          else
            PAYLOAD="$(jq -nc --arg message 'Phase 15.1: generate D1 schema [skip ci]' --arg content "$CONTENT" --arg branch "$HEAD_BRANCH" '{message:$message,content:$content,branch:$branch}')"
          fi
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL" -d "$PAYLOAD" >/dev/null

# Cloudflare Worker/D1 build and deploy jobs are added incrementally during Phase 15.
# Docker remains only a regression/reference implementation and is not the production target.
