name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend reference tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Run reference backend tests
        run: PYTHONPATH=. pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  d1-parity:
    name: Cloudflare D1 schema + historical data parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Verify generated D1 schema has no drift
        run: python cloudflare/tools/generate_d1_schema.py --check
      - name: Build deterministic historical reference fixture
        run: >-
          python cloudflare/tools/build_d1_bootstrap_fixture.py
          --database /tmp/otello-d1-reference.db
      - name: Export portable D1 bootstrap package
        run: >-
          python cloudflare/tools/d1_bootstrap.py export
          --database /tmp/otello-d1-reference.db
          --sql /tmp/otello-d1-bootstrap.sql
          --manifest /tmp/otello-d1-bootstrap.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Apply D1 migrations in local Wrangler runtime
        run: >-
          npx --yes wrangler@4 d1 migrations apply DB
          --local
          --config cloudflare/wrangler.schema-test.jsonc
      - name: Import historical bootstrap into local Wrangler D1
        run: >-
          npx --yes wrangler@4 d1 execute DB
          --local
          --config cloudflare/wrangler.schema-test.jsonc
          --file /tmp/otello-d1-bootstrap.sql
      - name: Verify exact logical D1 parity
        run: >-
          python cloudflare/tools/d1_bootstrap.py verify
          --database cloudflare/.wrangler/state/v3/d1
          --manifest /tmp/otello-d1-bootstrap.json
      - name: Verify D1 foreign keys and reference seed
        run: |
          npx --yes wrangler@4 d1 execute DB --local --config cloudflare/wrangler.schema-test.jsonc --command "PRAGMA foreign_key_check;"
          npx --yes wrangler@4 d1 execute DB --local --config cloudflare/wrangler.schema-test.jsonc --command "SELECT COUNT(*) AS source_count FROM sources; SELECT COUNT(*) AS instrument_count FROM instruments; SELECT COUNT(*) AS nav_count FROM nav_snapshots;"

  docker-reference:
    name: Docker regression reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build reference backend/frontend images
        run: docker compose build api web
      - name: Verify nginx reference configuration
        run: docker run --rm --add-host api:127.0.0.1 otello-web:local nginx -t
      - name: Verify backend reference timezone
        run: docker run --rm otello-backend:local python -c "import os, time; assert os.environ.get('TZ') == 'Europe/Oslo'; assert time.tzname[0] in {'CET','CEST'}; print(os.environ['TZ'], time.tzname)"

# Worker/API jobs are added incrementally during Phase 15.
# Docker remains only a regression/reference implementation and is not the production target.
