name: Produksjon – manuell fulloppdatering

on:
  workflow_dispatch:
    inputs:
      kontroll:
        description: Velg kontroll etter fulloppdateringen
        required: true
        type: choice
        default: fulloppdatering
        options:
          - fulloppdatering
          - kildekontroll
      target_date:
        description: "Dato (YYYY-MM-DD). Tom: gårsdagen i Oslo ved fulloppdatering, UTC ved kildekontroll."
        required: false
        type: string

permissions:
  contents: read

# Both variants start the same remote Workflow; serialize manual invocations.
concurrency:
  group: cloudflare-one-time-full-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && inputs.kontroll == 'fulloppdatering'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_DATABASE: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      INPUT_TARGET_DATE: ${{ inputs.target_date || '' }}
    steps:
      - name: Create a locked Cloudflare full-refresh Workflow instance and verify D1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import date, datetime, timedelta
          import json
          import os
          import re
          import sys
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          token = os.environ.get("CF_TOKEN", "").strip()
          account = os.environ.get("CF_ACCOUNT", "").strip()
          db_id = os.environ.get("CF_DATABASE", "").strip()
          if not token or not re.fullmatch(r"[A-Za-z0-9_-]{8,80}", account):
              raise SystemExit("Missing or invalid production Cloudflare credentials")
          yesterday = datetime.now(ZoneInfo("Europe/Oslo")).date() - timedelta(days=1)
          requested = os.getenv("INPUT_TARGET_DATE", "").strip()
          if not requested:
              requested = yesterday.isoformat()
          if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}", requested):
              raise SystemExit("Target date must be YYYY-MM-DD")
          target = date.fromisoformat(requested)
          if target > yesterday or (yesterday - target).days > 10:
              raise SystemExit("Only recent, completed Oslo calendar dates can be refreshed")

          def api(path, payload=None):
              url = "https://api.cloudflare.com/client/v4/accounts/" + account + path
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              req = Request(
                  url, data=data,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/json",
                           "Content-Type": "application/json"},
                  method="POST" if payload is not None else "GET",
              )
              try:
                  with urlopen(req, timeout=60) as resp:
                      body = json.load(resp)
              except HTTPError as exc:
                  raise RuntimeError("Cloudflare request returned HTTP " + str(exc.code)) from exc
              if body.get("success") is not True:
                  safe = [str(x.get("code", "?")) for x in body.get("errors", [])]
                  raise RuntimeError("Cloudflare API did not succeed, error codes: " + ",".join(safe))
              return body.get("result")

          name = "otello-full-refresh"
          instance = (
              "manual-" + requested + "-" +
              os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          params = json.dumps(
              {"target_date": requested, "trigger": "github_actions_manual_repair"},
              separators=(",", ":"),
          )
          created = api(
              "/workflows/" + name + "/instances",
              {"instance_id": instance, "params": params},
          )
          print("Started Cloudflare full refresh:", instance,
                "status:", created.get("status"), flush=True)
          status = None
          for attempt in range(50):
              time.sleep(9)
              detail = api("/workflows/" + name + "/instances/" + quote(instance))
              status = detail.get("status")
              print("Cloudflare Workflow check", attempt + 1, "status", status, flush=True)
              if status in ("complete", "errored", "terminated"):
                  break
          if status != "complete":
              raise SystemExit("Cloudflare Workflow did not complete successfully; instance=" + instance)

          # The remote Workflow can complete while the D1 job is PARTIAL.
          # Report the actual database status instead of presenting a false success.
          if not db_id:
              dbs = api("/d1/database?per_page=100")
              hits = [d for d in dbs if d.get("name") == "otello-nav"]
              if len(hits) != 1:
                  raise SystemExit("Unable to identify exactly one production D1 database")
              db_id = hits[0]["uuid"]
          if not re.fullmatch(r"[0-9a-f-]{36}", db_id, re.I):
              raise SystemExit("Invalid D1 database identifier")
          sql = (
              "SELECT id, status, started_at, finished_at, metadata_json "
              "FROM job_runs WHERE job_name='cloudflare_full_refresh' "
              "AND json_valid(metadata_json) "
              "AND json_extract(metadata_json,'$.target_date')='" + requested + "' "
              "ORDER BY id DESC LIMIT 1"
          )
          result = api("/d1/database/" + db_id + "/query", {"sql": sql})
          if not result or not result[0].get("results"):
              raise SystemExit("Workflow finished but no matching D1 full refresh row exists")
          job = result[0]["results"][0]
          print("D1 full refresh", "id", job["id"], "status", job["status"],
                "target_date", requested, flush=True)
          metadata = json.loads(job.get("metadata_json") or "{}")
          history = metadata.get("estimated_nav_history") or {}
          period_cache = history.get("period_cache") or {}
          print("D1 NAV history diagnostics:", json.dumps({
              "attempted": history.get("attempted"),
              "written": history.get("written"),
              "complete": history.get("complete"),
              "stop_reason": history.get("stop_reason"),
              "timings_ms": history.get("timings_ms"),
              "period_cache_status": period_cache.get("status"),
              "period_timings_ms": period_cache.get("timings_ms"),
              "repository_by_period": period_cache.get("repository_by_period"),
              "economic_reference_reused_periods": period_cache.get("economic_reference_reused_periods"),
              "period_failures": period_cache.get("failures"),
          }), flush=True)
          for key in ("source_results", "sources"):
              sources = metadata.get(key) or {}
              if isinstance(sources, dict):
                  bemobi = sources.get("bemobi_web") or sources.get("BEMOBI_IR")
                  if isinstance(bemobi, dict):
                      print("D1 Bemobi web:", json.dumps(
                          {k: bemobi.get(k) for k in (
                              "status", "result_release", "distribution_ingestion"
                          )}, default=str)[:3000], flush=True)
                      break
          # Diagnose the *actual* CVM accounts that the cash and payout cards
          # depend on; a SUCCESS job can still carry non-critical CVM omissions.
          cvm = (metadata.get("sources") or {}).get("cvm") or {}
          financials = cvm.get("financials") or {}
          print("D1 CVM financial refresh:", json.dumps(
              {k: financials.get(k) for k in (
                  "status", "reason", "archives", "rows_written",
                  "fact_status", "errors", "unavailable"
              )}, ensure_ascii=False, default=str)[:5000], flush=True)

          quarter_sql = """
              SELECT fact_key, as_of_date,
                json_extract(payload_json, '$.reported_net_income_parent_mbrl')
                  AS parent_net_income_mbrl,
                json_extract(payload_json, '$.reported_cash_mbrl') AS cash_mbrl,
                json_extract(payload_json, '$.reported_financial_investments_mbrl')
                  AS investments_mbrl,
                json_extract(payload_json, '$.reported_borrowings_mbrl')
                  AS borrowings_mbrl,
                json_extract(payload_json, '$.reported_net_debt_mbrl')
                  AS net_debt_mbrl,
                json_extract(payload_json, '$.reported_net_debt_method')
                  AS net_debt_method
              FROM bemobi_investor_facts
              WHERE fact_type='TTM_QUARTER'
                AND fact_key IN ('4Q25','1Q26','2Q26','3Q26')
              ORDER BY as_of_date ASC
          """
          qr = api("/d1/database/" + db_id + "/query", {"sql": quarter_sql})
          quarter_rows = (qr[0].get("results") or []) if qr else []
          indexed = {r["fact_key"]: r for r in quarter_rows}
          for row in quarter_rows:
              print("CVM TTM", json.dumps(row, ensure_ascii=False), flush=True)
          required = ("4Q25", "1Q26", "2Q26", "3Q26")
          missing = [
              key for key in required
              if key not in indexed or indexed[key].get("parent_net_income_mbrl") is None
          ]
          q3 = indexed.get("3Q26") or {}
          q3_balance_complete = all(q3.get(k) is not None for k in (
              "cash_mbrl", "investments_mbrl",
              "borrowings_mbrl", "net_debt_mbrl",
          ))
          if q3_balance_complete:
              liquidity = float(q3["cash_mbrl"]) + float(q3["investments_mbrl"])
              debt = float(q3["borrowings_mbrl"])
              net = -float(q3["net_debt_mbrl"])
              q3_balance_complete = (
                  abs(liquidity - 319.271) <= 0.01
                  and abs(debt - 41.449) <= 0.01
                  and abs(net - (liquidity - debt)) <= 0.01
                  and q3.get("net_debt_method") ==
                      "CVM_BORROWINGS_MINUS_CASH_AND_INVESTMENTS"
              )
          print("Q3 source completeness", json.dumps({
              "missing_ttm_net_income_quarters": missing,
              "q3_liquidity_and_debt_reconciled": q3_balance_complete,
          }), flush=True)
          if job["status"] != "SUCCESS":
              raise SystemExit("D1 full refresh has status " + str(job["status"]))
          if missing or not q3_balance_complete:
              raise SystemExit(
                  "CVM Q3 accounts are not fully source-verified in production D1."
              )
          PY

  verify:
    if: github.ref == 'refs/heads/main' && inputs.kontroll == 'kildekontroll'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CF_API_BASE: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      WORKFLOW_NAME: otello-full-refresh
      REQUESTED_TARGET_DATE: ${{ inputs.target_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$(python - <<'PY'
          import os
          from datetime import UTC, datetime, timedelta
          requested=os.environ.get('REQUESTED_TARGET_DATE','').strip()
          if requested:
              datetime.strptime(requested, '%Y-%m-%d')
              print(requested)
          else:
              print((datetime.now(UTC).date()-timedelta(days=1)).isoformat())
          PY
          )"
          echo "date=$target" >> "$GITHUB_OUTPUT"
          echo "Verifying production sources with full-refresh target_date=$target"

      - name: Start production full refresh
        id: start
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          python - <<'PY'
          import json, os
          body = {
              'params': json.dumps({'target_date': os.environ['TARGET_DATE']}, separators=(',', ':')),
              'instance_retention': {
                  'success_retention': '1 day',
                  'error_retention': '1 day',
              },
          }
          json.dump(body, open('/tmp/workflow-create.json','w',encoding='utf-8'))
          PY
          url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/workflow-create.json \
            "$url" > /tmp/workflow-created.json
          instance_id="$(python - <<'PY'
          import json
          payload=json.load(open('/tmp/workflow-created.json',encoding='utf-8'))
          if payload.get('success') is not True:
              raise SystemExit(payload)
          result=payload.get('result') or {}
          instance_id=str(result.get('id') or '')
          if not instance_id:
              raise SystemExit(f'Missing workflow instance id: {payload}')
          print(instance_id)
          print('Started production full refresh:', instance_id, 'status=', result.get('status'), file=__import__('sys').stderr)
          PY
          )"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Wait for full refresh completion
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.start.outputs.instance_id }}
        run: |
          set -Eeuo pipefail
          url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${INSTANCE_ID}"
          final=""
          for attempt in $(seq 1 120); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$url" > /tmp/workflow-instance.json
            status="$(python - <<'PY'
          import json
          payload=json.load(open('/tmp/workflow-instance.json',encoding='utf-8'))
          print((payload.get('result') or {}).get('status') or '')
          PY
            )"
            echo "Full refresh status: ${status:-unknown}"
            case "$status" in
              complete) final=complete; break ;;
              errored|terminated) final="$status"; break ;;
            esac
            sleep 10
          done
          if [ "$final" != complete ]; then
            echo 'Final workflow instance payload:'
            python - <<'PY'
          import json
          payload=json.load(open('/tmp/workflow-instance.json',encoding='utf-8'))
          result=payload.get('result') or {}
          print(json.dumps({k:result.get(k) for k in ('id','status','created_on','started_on','ended_on')}, indent=2))
          PY
            curl --silent --show-error \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${url}/step" > /tmp/workflow-step.json || true
            python - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/workflow-step.json')
          if path.exists() and path.stat().st_size:
              try:
                  payload=json.loads(path.read_text())
              except Exception:
                  payload={}
              print('Step diagnostic:', json.dumps(payload, ensure_ascii=False)[:10000])
          PY
            exit 1
          fi
          echo "Production full refresh completed: $INSTANCE_ID"

      - name: Verify Bemobi and NewsWeb source health
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          sql = """
          WITH ranked AS (
            SELECT s.code, sh.checked_at, sh.status, sh.error_message, sh.metadata_json,
                   ROW_NUMBER() OVER (
                     PARTITION BY s.code ORDER BY sh.checked_at DESC, sh.id DESC
                   ) AS rn
            FROM source_health sh
            JOIN sources s ON s.id=sh.source_id
            WHERE s.code IN ('BEMOBI_IR','NEWSWEB')
          )
          SELECT code, checked_at, status, error_message, metadata_json
          FROM ranked WHERE rn=1 ORDER BY code
          """
          json.dump({'sql': sql}, open('/tmp/d1-query.json','w',encoding='utf-8'))
          PY
          url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${CLOUDFLARE_D1_DATABASE_ID}/query"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/d1-query.json \
            "$url" > /tmp/d1-source-health.json
          python - <<'PY'
          import json, os
          payload=json.load(open('/tmp/d1-source-health.json',encoding='utf-8'))
          if payload.get('success') is not True:
              raise SystemExit(payload)
          blocks=payload.get('result') or []
          rows=(blocks[0].get('results') if blocks else None) or []
          by_code={str(row.get('code')): row for row in rows}
          target=os.environ['TARGET_DATE']
          failures={}
          for code in ('BEMOBI_IR','NEWSWEB'):
              row=by_code.get(code)
              if row is None:
                  raise SystemExit(f'Missing source_health row for {code}: {rows}')
              metadata={}
              try:
                  metadata=json.loads(str(row.get('metadata_json') or '{}'))
              except Exception:
                  pass
              metadata_target=str(metadata.get('target_date') or '')
              print(f'{code}: status={row.get("status")} checked_at={row.get("checked_at")} target_date={metadata_target} error={row.get("error_message")}')
              print(f'{code} result={json.dumps(metadata.get("result") or {}, ensure_ascii=False, sort_keys=True)[:14000]}')
              if metadata_target != target:
                  failures[code]=f'latest health target_date={metadata_target}, expected={target}'
              elif row.get('status') != 'OK':
                  failures[code]=str(row.get('status'))
          if failures:
              raise SystemExit(f'Production source health verification failed: {failures}')
          print('Production source health passed: BEMOBI_IR=OK NEWSWEB=OK')
          PY
