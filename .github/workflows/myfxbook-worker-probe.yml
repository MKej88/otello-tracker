name: Myfxbook Cloudflare edge probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/myfxbook-worker-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myfxbook-cloudflare-edge-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe Myfxbook from Cloudflare remote Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build isolated probe Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/myfxbook-probe
          cd /tmp/myfxbook-probe

          cat > worker.mjs <<'EOF'
          const targets = [
            {
              id: "xml_brl_all",
              kind: "export",
              url: "https://www.myfxbook.com/calendar_statement.xml?start=2026-09-01%2000:00&end=2026-09-02%2000:00&filter=0-1-2-3_PEI-BRL&calPeriod=10",
            },
            {
              id: "xml_brl_high",
              kind: "export",
              url: "https://www.myfxbook.com/calendar_statement.xml?start=2026-09-01%2000:00&end=2026-09-02%2000:00&filter=2-3_PEI-BRL&calPeriod=10",
            },
            {
              id: "csv_brl_all",
              kind: "export",
              url: "https://www.myfxbook.com/calendar_statement.csv?start=2026-09-01%2000:00&end=2026-09-02%2000:00&filter=0-1-2-3_PEI-BRL&calPeriod=10",
            },
            {
              id: "brazil_page",
              kind: "page",
              url: "https://www.myfxbook.com/forex-economic-calendar/brazil",
            },
          ];

          function compact(text) {
            return String(text || "").replace(/\s+/g, " ").trim();
          }

          function contextAround(text, needle, width = 220) {
            const haystack = String(text || "");
            const lower = haystack.toLowerCase();
            const index = lower.indexOf(needle.toLowerCase());
            if (index < 0) return null;
            const start = Math.max(0, index - width);
            const end = Math.min(haystack.length, index + needle.length + width);
            return compact(haystack.slice(start, end)).slice(0, 600);
          }

          async function inspectTarget(target) {
            try {
              const response = await fetch(target.url, {
                redirect: "follow",
                headers: {
                  "Accept": target.kind === "export"
                    ? "application/xml,text/xml,text/csv,text/plain,*/*;q=0.8"
                    : "text/html,application/xhtml+xml,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.8",
                  "User-Agent": "Mozilla/5.0 (compatible; OtelloTrackerProbe/1.0; +https://otellotracker.com)",
                },
              });
              const body = await response.text();
              const lower = body.toLowerCase();
              const challenge = /cf-chl|captcha|just a moment|access denied|cloudflare ray id/.test(lower);
              return {
                id: target.id,
                kind: target.kind,
                ok: response.ok,
                status: response.status,
                content_type: response.headers.get("content-type"),
                bytes: new TextEncoder().encode(body).length,
                final_url: response.url,
                challenge,
                contains_consensus: lower.includes("consensus"),
                contains_gdp_qoq: lower.includes("gdp growth rate qoq"),
                contains_gdp_yoy: lower.includes("gdp growth rate yoy"),
                contains_0_4_pct: lower.includes("0.4%") || lower.includes("0.4 %"),
                contains_1_8_pct: lower.includes("1.8%") || lower.includes("1.8 %"),
                qoq_context: contextAround(body, "GDP Growth Rate QoQ"),
                yoy_context: contextAround(body, "GDP Growth Rate YoY"),
                body_prefix: compact(body.slice(0, 300)),
              };
            } catch (error) {
              return {
                id: target.id,
                kind: target.kind,
                ok: false,
                error: `${error?.name || "Error"}: ${error?.message || String(error)}`,
              };
            }
          }

          export default {
            async fetch(request) {
              const results = [];
              for (const target of targets) {
                results.push(await inspectTarget(target));
              }
              const exportUsable = results.some(
                (item) => item.kind === "export" && item.ok && !item.challenge && item.contains_gdp_qoq && item.contains_gdp_yoy,
              );
              const pageUsable = results.some(
                (item) => item.kind === "page" && item.ok && !item.challenge && item.contains_gdp_qoq && item.contains_gdp_yoy,
              );
              return Response.json({
                runtime: "cloudflare-worker-remote-preview",
                colo: request.cf?.colo || null,
                export_usable: exportUsable,
                page_usable: pageUsable,
                results,
              }, {
                headers: { "Cache-Control": "no-store" },
              });
            },
          };
          EOF

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "otello-myfxbook-edge-probe",
            "main": "worker.mjs",
            "compatibility_date": "2026-08-01",
            "workers_dev": true
          }
          EOF

          npm init -y >/dev/null 2>&1
          npm install --no-save wrangler@4.123.0

      - name: Run probe in Cloudflare remote Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/myfxbook-probe

          ./node_modules/.bin/wrangler dev --remote --ip 127.0.0.1 --port 8787 --config wrangler.jsonc >wrangler.log 2>&1 &
          wrangler_pid=$!
          cleanup() {
            kill "$wrangler_pid" 2>/dev/null || true
            wait "$wrangler_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 30 http://127.0.0.1:8787/ -o result.json; then
              ready=1
              break
            fi
            if ! kill -0 "$wrangler_pid" 2>/dev/null; then
              echo "::error::wrangler dev --remote exited before the probe became ready"
              cat wrangler.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Remote Worker probe did not become ready"
            cat wrangler.log || true
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("result.json").read_text(encoding="utf-8"))
          print(json.dumps(payload, indent=2, ensure_ascii=False))

          lines = [
              "# Myfxbook fra Cloudflare Worker",
              "",
              f"- Runtime: `{payload.get('runtime')}`",
              f"- Cloudflare colo: `{payload.get('colo') or '-'}`",
              f"- CSV/XML brukbar direkte: **{'JA' if payload.get('export_usable') else 'NEI'}**",
              f"- Offentlig Brazil-side brukbar som reserve: **{'JA' if payload.get('page_usable') else 'NEI'}**",
              "",
              "| Test | HTTP | Content-Type | Bytes | Challenge | BNP q/q | BNP y/y | 0,4 % | 1,8 % |",
              "|---|---:|---|---:|---|---|---|---|---|",
          ]
          for item in payload.get("results") or []:
              lines.append(
                  "| {id} | {status} | {ct} | {bytes} | {challenge} | {qoq} | {yoy} | {p04} | {p18} |".format(
                      id=item.get("id", "-"),
                      status=item.get("status", item.get("error", "-")),
                      ct=(item.get("content_type") or "-").replace("|", "\\|"),
                      bytes=item.get("bytes", "-"),
                      challenge="JA" if item.get("challenge") else "NEI",
                      qoq="JA" if item.get("contains_gdp_qoq") else "NEI",
                      yoy="JA" if item.get("contains_gdp_yoy") else "NEI",
                      p04="JA" if item.get("contains_0_4_pct") else "NEI",
                      p18="JA" if item.get("contains_1_8_pct") else "NEI",
                  )
              )
              if item.get("qoq_context"):
                  lines.extend(["", f"**{item.get('id')} q/q-utdrag:** `{item['qoq_context'][:500]}`"])
              if item.get("yoy_context"):
                  lines.extend(["", f"**{item.get('id')} y/y-utdrag:** `{item['yoy_context'][:500]}`"])
              if item.get("error"):
                  lines.extend(["", f"**{item.get('id')} feil:** `{item['error'][:500]}`"])

          summary = "\n".join(lines) + "\n"
          Path("probe-summary.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY

          cat probe-summary.md >> "$GITHUB_STEP_SUMMARY"
