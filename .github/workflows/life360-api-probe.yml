name: Life360 API probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/life360-api-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe no-key quote sources for LIF
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.error
          import urllib.request
          from datetime import UTC, datetime

          sources = {
              "nasdaq": ("https://api.nasdaq.com/api/quote/LIF/info?assetclass=stocks", 8),
              "yahoo_chart": ("https://query1.finance.yahoo.com/v8/finance/chart/LIF?interval=1d&range=5d&includePrePost=false", 8),
              "stooq": ("https://stooq.com/q/l/?s=lif.us&f=sd2t2ohlcv&h&e=csv", 8),
          }

          headers = {
              "User-Agent": "OtelloTracker/1.0 (+https://otellotracker.com)",
              "Accept": "application/json,text/csv,text/plain,*/*",
          }

          for name, (url, timeout) in sources.items():
              print(f"\n=== {name} ===")
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      body = response.read().decode("utf-8", "replace")
                      print("HTTP", response.status)
                      print("content-type", response.headers.get("content-type"))
                      if name == "nasdaq":
                          payload = json.loads(body)
                          data = payload.get("data") or {}
                          primary = data.get("primaryData") or {}
                          print("symbol", data.get("symbol"))
                          print("company", data.get("companyName"))
                          print("lastSalePrice", primary.get("lastSalePrice"))
                          print("lastTradeTimestamp", primary.get("lastTradeTimestamp"))
                          print("marketStatus", data.get("marketStatus"))
                      elif name == "yahoo_chart":
                          payload = json.loads(body)
                          result = ((payload.get("chart") or {}).get("result") or [None])[0]
                          meta = (result or {}).get("meta") or {}
                          ts = meta.get("regularMarketTime")
                          print("symbol", meta.get("symbol"))
                          print("currency", meta.get("currency"))
                          print("regularMarketPrice", meta.get("regularMarketPrice"))
                          print("regularMarketTime", ts)
                          print("regularMarketTimeUtc", datetime.fromtimestamp(ts, tz=UTC).isoformat() if ts else None)
                          print("exchangeName", meta.get("exchangeName"))
                          print("exchangeTimezoneName", meta.get("exchangeTimezoneName"))
                          timestamps = result.get("timestamp") or [] if result else []
                          quote = (((result or {}).get("indicators") or {}).get("quote") or [{}])[0]
                          closes = quote.get("close") or []
                          pairs = [(t, c) for t, c in zip(timestamps, closes) if c is not None]
                          if pairs:
                              t, c = pairs[-1]
                              print("lastDailyClose", c)
                              print("lastDailyTimestampUtc", datetime.fromtimestamp(t, tz=UTC).isoformat())
                      else:
                          rows = list(csv.DictReader(io.StringIO(body)))
                          print("rows", len(rows))
                          print("row", rows[-1] if rows else None)
              except urllib.error.HTTPError as exc:
                  print("HTTP", exc.code)
                  print("error-body", exc.read().decode("utf-8", "replace")[:500])
              except Exception as exc:
                  print(type(exc).__name__, str(exc))
          PY
