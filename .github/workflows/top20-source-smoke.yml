name: Top 20 source smoke

on:
  pull_request:
    paths:
      - "cloudflare/tools/capture_shareholder_top20.mjs"
      - ".github/workflows/prime-shareholder-snapshot.yml"
      - ".github/workflows/top20-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Live OMS Top 20 capture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOP20_OUTPUT: /tmp/otec-top20.json
      TOP20_DEBUG_DIR: /tmp/otec-top20-debug
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify Chrome on runner
        shell: bash
        run: |
          command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null || command -v chromium >/dev/null

      - name: Install pinned Playwright client
        run: npm install --no-save --ignore-scripts --prefix cloudflare/tools playwright-core@1.58.2

      - name: Capture live OMS Top 20
        run: node cloudflare/tools/capture_shareholder_top20.mjs

      - name: Verify exactly 20 rows
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/otec-top20.json', 'utf8'));
          const rows = payload.rows || [];
          if (rows.length !== 20) throw new Error(`Expected 20 rows, found ${rows.length}`);
          console.log({ method: payload.method, source_url: payload.source_url, rows: rows.length });
          NODE

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top20-source-smoke-${{ github.run_id }}
          path: |
            /tmp/otec-top20-debug
            /tmp/otec-top20.json
          if-no-files-found: ignore
          retention-days: 3
