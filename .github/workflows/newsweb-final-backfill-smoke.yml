name: NewsWeb final backfill smoke

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Full NewsWeb OTEC backfill
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from app.buybacks.official_backfill import seed_known_official_buybacks
          from app.db.connection import get_connection
          from app.db.migration_runner import init_database
          from app.history import seed_curated_history
          from app.newsweb import collect_newsweb_buybacks, newsweb_buyback_status, sync_newsweb_daily_buyback_cash

          with tempfile.TemporaryDirectory() as tmp:
              db = str(Path(tmp) / "newsweb-final.db")
              init_database(db)
              seed_curated_history(db)
              seed_known_official_buybacks(db)

              result = collect_newsweb_buybacks(
                  db, from_date="2024-07-01", to_date="2026-08-17", timeout=45
              )
              summary = {
                  "discovered": result["discovered"],
                  "ingested": result["ingested"],
                  "daily_rows": result["daily_rows"],
                  "daily_rows_written": result["daily_rows_written"],
                  "attachment_review_count": result["attachment_review_count"],
                  "no_attachment_count": result["no_attachment_count"],
                  "no_purchase_count": result["no_purchase_count"],
                  "hard_errors": len(result["errors"]),
                  "warnings": result["warnings"],
              }
              print("NEWSWEB_SUMMARY", json.dumps(summary, indent=2, ensure_ascii=False, default=str))
              if result["errors"]:
                  raise SystemExit(f"Hard NewsWeb errors: {result['errors']}")
              if result["discovered"] < 80 or result["ingested"] != result["discovered"]:
                  raise SystemExit("Incomplete NewsWeb message ingestion")
              if result["daily_rows"] < 150:
                  raise SystemExit(f"Too little daily detail: {result['daily_rows']}")
              if result["attachment_review_count"] > 10:
                  raise SystemExit(f"Too many attachment-review fallbacks: {result['attachment_review_count']}")

              sync = sync_newsweb_daily_buyback_cash(db)
              status = newsweb_buyback_status(db)
              print("CASH_SYNC", json.dumps(sync, indent=2, ensure_ascii=False, default=str))
              print("NEWSWEB_STATUS", json.dumps(status, indent=2, ensure_ascii=False, default=str))
              if sync["weeks_synced"] < 30:
                  raise SystemExit(f"Too little daily cash coverage: {sync['weeks_synced']} weeks")

              with get_connection(db) as connection:
                  duplicate = connection.execute(
                      """
                      SELECT buyback_id, movement_date, COUNT(*) n
                      FROM cash_movements
                      WHERE movement_type='OTELLO_BUYBACK_DAILY'
                      GROUP BY buyback_id, movement_date HAVING COUNT(*) > 1 LIMIT 1
                      """
                  ).fetchone()
                  if duplicate is not None:
                      raise SystemExit(f"Duplicate daily cash: {dict(duplicate)}")
                  both = connection.execute(
                      """
                      SELECT b.id, b.trade_date
                      FROM buybacks b
                      WHERE EXISTS (SELECT 1 FROM buyback_daily_transactions d WHERE d.weekly_buyback_id=b.id)
                        AND EXISTS (SELECT 1 FROM cash_movements c WHERE c.buyback_id=b.id AND c.movement_type='OTELLO_BUYBACK')
                      LIMIT 1
                      """
                  ).fetchone()
                  if both is not None:
                      raise SystemExit(f"Weekly and daily cash coexist: {dict(both)}")
          PY
