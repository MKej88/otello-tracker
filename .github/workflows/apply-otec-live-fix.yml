name: Apply OTEC live fix

on:
  push:
    branches:
      - fix/otec-live-last-everywhere

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-live-last-everywhere
      - name: Apply code changes
        run: echo '' | base64 -d | python
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bruk siste OTEC-handel som felles nåkurs"
          git push origin HEAD:fix/otec-live-last-everywhere
