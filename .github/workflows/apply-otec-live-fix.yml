name: Apply OTEC live fix

on:
  push:
    branches:
      - fix/otec-live-last-everywhere

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-live-last-everywhere

      - name: Apply code changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quote_path = Path("backend/app/marketdata/quote_details.py")
          quote = quote_path.read_text(encoding="utf-8")
          old_order = """        ORDER BY mp.trading_date DESC,
                   CASE WHEN mp.price_type='CLOSE' THEN 0 ELSE 1 END,
                   mp.observed_at DESC, mp.id DESC
          LIMIT 1
          \"\"\",
          (symbol,),"""
          new_order = """        ORDER BY mp.trading_date DESC,
                   CASE
                       WHEN ?='OTEC' AND mp.price_type='LAST' THEN 0
                       WHEN ?<>'OTEC' AND mp.price_type='CLOSE' THEN 0
                       ELSE 1
                   END,
                   mp.observed_at DESC, mp.id DESC
          LIMIT 1
          \"\"\",
          (symbol, symbol, symbol),"""
          if old_order not in quote:
              raise SystemExit("Fant ikke forventet _latest_price-sortering")
          quote = quote.replace(old_order, new_order, 1)

          old_override = """    if current_close and str(current_close[\"trading_date\"]) >= str(
              latest[\"trading_date\"]
          ):
              latest = {"""
          new_override = """    if current_close and (
              str(current_close[\"trading_date\"]) > str(latest[\"trading_date\"])
              or (
                  str(current_close[\"trading_date\"]) == str(latest[\"trading_date\"])
                  and latest.get(\"price_type\") != \"LAST\"
              )
          ):
              latest = {"""
          if old_override not in quote:
              raise SystemExit("Fant ikke forventet OTEC close-overstyring")
          quote = quote.replace(old_override, new_override, 1)
          quote_path.write_text(quote, encoding="utf-8")

          forecast_path = Path("backend/app/buybacks/forecast.py")
          forecast = forecast_path.read_text(encoding="utf-8")
          old_import = "from app.marketdata.oslo_calendar import oslo_bors_trading_days\n"
          new_import = (
              "from app.marketdata.oslo_calendar import oslo_bors_trading_days\n"
              "from app.marketdata.quote_details import _latest_price\n"
          )
          if old_import not in forecast:
              raise SystemExit("Fant ikke forventet forecast-import")
          forecast = forecast.replace(old_import, new_import, 1)

          old_price = """        last = lookback[-1]
          last_close = Decimal(last[\"last_price_nok\"]) if last[\"last_price_nok\"] is not None else None
          max_price = Decimal(program[\"max_price_nok\"]) if program[\"max_price_nok\"] is not None else None"""
          new_price = """        last = lookback[-1]
          last_close = (
              Decimal(str(last[\"last_price_nok\"]))
              if last[\"last_price_nok\"] is not None
              else None
          )
          if as_of_date is None:
              live_quote = _latest_price(connection, \"OTEC\")
              live_price = live_quote.get(\"price\") if live_quote else None
              if live_price is not None:
                  last_close = Decimal(str(live_price))
          max_price = Decimal(program[\"max_price_nok\"]) if program[\"max_price_nok\"] is not None else None"""
          if old_price not in forecast:
              raise SystemExit("Fant ikke forventet forecast-prisblokk")
          forecast = forecast.replace(old_price, new_price, 1)
          forecast_path.write_text(forecast, encoding="utf-8")

          Path(".github/workflows/apply-otec-live-fix.yml").unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bruk siste OTEC-handel som felles nåkurs"
          git push origin HEAD:fix/otec-live-last-everywhere
