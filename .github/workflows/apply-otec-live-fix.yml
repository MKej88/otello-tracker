name: Apply OTEC live fix

on:
  push:
    branches:
      - fix/otec-live-last-everywhere

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-live-last-everywhere

      - name: Apply code changes
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          quote_path = Path("backend/app/marketdata/quote_details.py")
          quote = quote_path.read_text(encoding="utf-8")
          order_pattern = re.compile(
              r"        ORDER BY mp\.trading_date DESC,\n"
              r"\s+CASE WHEN mp\.price_type='CLOSE' THEN 0 ELSE 1 END,\n"
              r"\s+mp\.observed_at DESC, mp\.id DESC\n"
              r"\s+LIMIT 1\n\s+\"\"\",\n\s+\(symbol,\),"
          )
          order_replacement = """        ORDER BY mp.trading_date DESC,
                   CASE
                       WHEN ?='OTEC' AND mp.price_type='LAST' THEN 0
                       WHEN ?<>'OTEC' AND mp.price_type='CLOSE' THEN 0
                       ELSE 1
                   END,
                   mp.observed_at DESC, mp.id DESC
        LIMIT 1
        \"\"\",
        (symbol, symbol, symbol),"""
          quote, count = order_pattern.subn(order_replacement, quote, count=1)
          if count != 1:
              raise SystemExit(f"Kunne ikke endre _latest_price-sortering: {count}")

          override_pattern = re.compile(
              r"    if current_close and str\(current_close\[\"trading_date\"\]\) >= str\(\n"
              r"\s+latest\[\"trading_date\"\]\n"
              r"\s+\):\n"
              r"\s+latest = \{"
          )
          override_replacement = """    if current_close and (
        str(current_close[\"trading_date\"]) > str(latest[\"trading_date\"])
        or (
            str(current_close[\"trading_date\"]) == str(latest[\"trading_date\"])
            and latest.get(\"price_type\") != \"LAST\"
        )
    ):
        latest = {"""
          quote, count = override_pattern.subn(override_replacement, quote, count=1)
          if count != 1:
              raise SystemExit(f"Kunne ikke endre OTEC close-overstyring: {count}")
          quote_path.write_text(quote, encoding="utf-8")

          forecast_path = Path("backend/app/buybacks/forecast.py")
          forecast = forecast_path.read_text(encoding="utf-8")
          import_line = "from app.marketdata.oslo_calendar import oslo_bors_trading_days\n"
          if import_line not in forecast:
              raise SystemExit("Fant ikke forecast-import")
          forecast = forecast.replace(
              import_line,
              import_line + "from app.marketdata.quote_details import _latest_price\n",
              1,
          )

          price_pattern = re.compile(
              r"        last = lookback\[-1\]\n"
              r"\s+last_close = Decimal\(last\[\"last_price_nok\"\]\) if last\[\"last_price_nok\"\] is not None else None\n"
              r"\s+max_price = Decimal\(program\[\"max_price_nok\"\]\) if program\[\"max_price_nok\"\] is not None else None"
          )
          price_replacement = """        last = lookback[-1]
        last_close = (
            Decimal(str(last[\"last_price_nok\"]))
            if last[\"last_price_nok\"] is not None
            else None
        )
        if as_of_date is None:
            live_quote = _latest_price(connection, \"OTEC\")
            live_price = live_quote.get(\"price\") if live_quote else None
            if live_price is not None:
                last_close = Decimal(str(live_price))
        max_price = Decimal(program[\"max_price_nok\"]) if program[\"max_price_nok\"] is not None else None"""
          forecast, count = price_pattern.subn(price_replacement, forecast, count=1)
          if count != 1:
              raise SystemExit(f"Kunne ikke endre forecast-pris: {count}")
          forecast_path.write_text(forecast, encoding="utf-8")

          Path(".github/workflows/apply-otec-live-fix.yml").unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bruk siste OTEC-handel som felles nåkurs"
          git push origin HEAD:fix/otec-live-last-everywhere
