name: Apply overview 52w ranges

on:
  push:
    branches:
      - ui/overview-52w-ranges
    paths:
      - .github/workflows/tmp-overview-52w-ranges.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/overview-52w-ranges
          persist-credentials: true

      - name: Add compact 52-week ranges to overview drivers
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, got {count}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          page = "frontend/src/OverviewPage.tsx"
          replace_once(
              page,
              '''  brl_nok_insights?: {
              daily_pct?: number | null;
              month_pct?: number | null;
              nav_effect_1m_per_share_nok?: number | null;
            };''',
              '''  brl_nok_insights?: {
              daily_pct?: number | null;
              month_pct?: number | null;
              nav_effect_1m_per_share_nok?: number | null;
              range_1y?: {
                low?: number | null;
                high?: number | null;
                position_pct?: number | null;
              };
            };''',
          )

          replace_once(
              page,
              '''function MarketTicker({ label, quote }: { label: string; quote?: Quote }) {
            return (
              <div className="overviewTickerItem">
                <span>{label}</span>
                <strong>{quotePrice(quote)}</strong>
                <b className={tone(quote?.changes?.daily_pct)}>{signed(quote?.changes?.daily_pct, 1, " %")}</b>
              </div>
            );
          }

          export default function OverviewPage() {''',
              '''function MarketTicker({ label, quote }: { label: string; quote?: Quote }) {
            return (
              <div className="overviewTickerItem">
                <span>{label}</span>
                <strong>{quotePrice(quote)}</strong>
                <b className={tone(quote?.changes?.daily_pct)}>{signed(quote?.changes?.daily_pct, 1, " %")}</b>
              </div>
            );
          }

          function rangePosition(
            current?: number | null,
            low?: number | null,
            high?: number | null,
          ) {
            if (
              current == null
              || low == null
              || high == null
              || !Number.isFinite(current)
              || !Number.isFinite(low)
              || !Number.isFinite(high)
              || high < low
            ) return null;
            if (high === low) return 50;
            return Math.max(0, Math.min(100, ((current - low) / (high - low)) * 100));
          }

          function OverviewRange({
            current,
            low,
            high,
            digits,
            prefix = "",
          }: {
            current?: number | null;
            low?: number | null;
            high?: number | null;
            digits: number;
            prefix?: string;
          }) {
            const position = rangePosition(current, low, high);
            const available = low != null
              && high != null
              && Number.isFinite(low)
              && Number.isFinite(high)
              && high >= low;
            if (!available) return null;
            return (
              <div className="overviewRange52">
                <div className="overviewRange52Header">
                  <span>52 uker</span>
                  <small>{position == null ? "" : `${formatNumber(position, 0)} % opp i intervallet`}</small>
                </div>
                <div className="overviewRange52Scale">
                  <span>{prefix}{formatNumber(low, digits)}</span>
                  <div className="overviewRange52Track" aria-label="Posisjon i 52-ukersintervallet">
                    {position != null ? <i style={{ left: `${position}%` }} /> : null}
                  </div>
                  <span>{prefix}{formatNumber(high, digits)}</span>
                </div>
              </div>
            );
          }

          export default function OverviewPage() {''',
          )

          replace_once(
              page,
              '''            <small>BMOB3 {bemobi?.price_brl == null ? "—" : `R$${formatNumber(bemobi.price_brl, 2)}`}</small>
                  </article>

                  <article className="card overviewDriverCard">
                    <span className="label">BRL/NOK</span>
                    <strong>{signed(brl?.month_pct, 1, " % siste måned")}</strong>
                    <div className={`overviewDriverEffect ${tone(brl?.nav_effect_1m_per_share_nok)}`}>
                      {signed(brl?.nav_effect_1m_per_share_nok, 2, " kr NAV/aksje")}
                    </div>
                    <small>Dagens kurs {summary?.brl_nok == null ? "—" : formatNumber(summary.brl_nok, 4)}</small>
                  </article>''',
              '''            <small>BMOB3 {bemobi?.price_brl == null ? "—" : `R$${formatNumber(bemobi.price_brl, 2)}`}</small>
                    <OverviewRange
                      current={quotes?.symbols?.BMOB3?.last ?? bemobi?.price_brl}
                      low={quotes?.symbols?.BMOB3?.range_52w?.low}
                      high={quotes?.symbols?.BMOB3?.range_52w?.high}
                      digits={2}
                      prefix="R$"
                    />
                  </article>

                  <article className="card overviewDriverCard">
                    <span className="label">BRL/NOK</span>
                    <strong>{signed(brl?.month_pct, 1, " % siste måned")}</strong>
                    <div className={`overviewDriverEffect ${tone(brl?.nav_effect_1m_per_share_nok)}`}>
                      {signed(brl?.nav_effect_1m_per_share_nok, 2, " kr NAV/aksje")}
                    </div>
                    <small>Dagens kurs {summary?.brl_nok == null ? "—" : formatNumber(summary.brl_nok, 4)}</small>
                    <OverviewRange
                      current={summary?.brl_nok}
                      low={brl?.range_1y?.low}
                      high={brl?.range_1y?.high}
                      digits={4}
                    />
                  </article>''',
          )

          css = "frontend/src/overview-page.css"
          target = Path(css)
          text = target.read_text(encoding="utf-8")
          marker = ".overviewDriverCard>small{margin-top:auto;color:var(--ot-text-muted)}"
          if text.count(marker) != 1:
              raise SystemExit("Could not find overview driver CSS marker")
          addition = '''.overviewDriverCard>small{margin-top:auto;color:var(--ot-text-muted)}.overviewRange52{display:grid;gap:6px;margin-top:5px;padding-top:10px;border-top:1px solid var(--ot-border-soft)}.overviewRange52Header{display:flex;justify-content:space-between;gap:10px;align-items:center}.overviewRange52Header>span{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ot-text-muted)}.overviewRange52Header>small{font-size:.67rem;color:var(--ot-text-muted)}.overviewRange52Scale{display:grid;grid-template-columns:auto minmax(68px,1fr) auto;gap:8px;align-items:center}.overviewRange52Scale>span{font-size:.68rem;color:var(--ot-text-secondary);font-variant-numeric:tabular-nums}.overviewRange52Track{position:relative;height:5px;border-radius:999px;background:var(--ot-control-soft);box-shadow:inset 0 0 0 1px var(--ot-border-soft)}.overviewRange52Track>i{position:absolute;top:50%;width:9px;height:9px;border:2px solid var(--ot-surface);border-radius:50%;background:var(--ot-accent);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--ot-accent)}'''
          target.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-overview-52w-ranges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/OverviewPage.tsx frontend/src/overview-page.css .github/workflows/tmp-overview-52w-ranges.yml
          git commit -m "Legg 52-ukersintervall under Bemobi og BRL NOK"
          git push origin HEAD:ui/overview-52w-ranges
