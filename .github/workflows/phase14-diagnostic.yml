name: Phase 14 backend diagnostic

on:
  push:
    branches: ["phase-14-1-otec-light-feed"]

permissions:
  contents: write

jobs:
  backend-diagnostic:
    if: ${{ !contains(github.event.head_commit.message, '[phase14 diagnostic result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests and capture result
        shell: bash
        run: |
          set +e
          cd backend
          PYTHONPATH=. pytest -q > ../phase14-backend-test-result.txt 2>&1
          code=$?
          cd ..
          {
            echo
            echo "exit_code=$code"
            echo "tested_sha=${GITHUB_SHA}"
          } >> phase14-backend-test-result.txt
          exit 0
      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase14-backend-test-result.txt
          git commit -m "[phase14 diagnostic result] backend test output" || exit 0
          git push
