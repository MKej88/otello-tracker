name: NewsWeb pre-2023 buyback diagnostic

on:
  push:
    branches: [phase-9-4-full-newsweb-history-clean]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: List classified old NewsWeb buybacks
        working-directory: backend
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from app.db.connection import get_connection
          from app.db.migration_runner import init_database
          from app.newsweb import collect_newsweb_history

          with tempfile.TemporaryDirectory() as tmp:
              db = str(Path(tmp) / "old-buybacks.db")
              init_database(db)
              result = collect_newsweb_history(
                  db, from_date="2020-01-01", to_date="2023-06-19", timeout=45
              )
              with get_connection(db) as connection:
                  rows = connection.execute(
                      """
                      SELECT sd.external_id, cn.published_at, cn.headline, cn.processing_status
                      FROM company_news cn
                      JOIN source_documents sd ON sd.id=cn.source_document_id
                      JOIN sources s ON s.id=sd.source_id
                      WHERE s.code='NEWSWEB' AND cn.category='BUYBACK'
                      ORDER BY cn.published_at
                      """
                  ).fetchall()
              print("ARCHIVE", json.dumps(result, indent=2, ensure_ascii=False, default=str))
              print("BUYBACK_ROWS", json.dumps([dict(row) for row in rows], indent=2, ensure_ascii=False))
          PY
