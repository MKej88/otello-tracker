name: Apply zero receivable display fix

on:
  push:
    branches:
      - fix/hide-zero-receivable-nav-move
    paths:
      - .github/workflows/tmp-hide-zero-receivable.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hide-zero-receivable-nav-move
          persist-credentials: true

      - name: Hide zero-effect Bemobi receivable breakdown
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/NavPageV2.tsx')
          text = path.read_text(encoding='utf-8')

          marker = 'function groupedDrivers(drivers: Driver[]): DisplayDriver[] {'
          helper = '''function hasVisibleReceivableEffect(driver: Driver) {
            // Match the precision used in the UI: 0.0 mill. kr and 0.00 kr/aksje
            // should not create a separate "Fordring" detail row.
            return (
              Math.abs(driver.amount_mnok ?? 0) >= 0.05 ||
              Math.abs(driver.per_share_nok) >= 0.005
            );
          }

          function groupedDrivers(drivers: Driver[]): DisplayDriver[] {'''
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one groupedDrivers marker, got {text.count(marker)}')
          text = text.replace(marker, helper, 1)

          group_marker = 'label: "Bemobi-utbetalinger"'
          group_pos = text.find(group_marker)
          if group_pos < 0:
              raise SystemExit('Could not find Bemobi-utbetalinger group')

          target = 'breakdown: parts.map((part) => ({'
          target_pos = text.find(target, group_pos)
          if target_pos < 0:
              raise SystemExit('Could not find Bemobi breakdown mapping')
          replacement = '''breakdown: parts
                .filter((part) => (
                  part.key !== "bemobi_receivable" || hasVisibleReceivableEffect(part)
                ))
                .map((part) => ({'''
          text = text[:target_pos] + replacement + text[target_pos + len(target):]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-hide-zero-receivable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/NavPageV2.tsx .github/workflows/tmp-hide-zero-receivable.yml
          git commit -m "Skjul null-effekt fordring i NAV-bevegelse"
          git push origin HEAD:fix/hide-zero-receivable-nav-move
