name: Temporary buyback dashboard patch

on:
  push:
    branches:
      - fix/buyback-dashboard-week-metrics-max-price

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/buyback-dashboard-week-metrics-max-price
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply patch
        if: github.event.head_commit.message == 'Kjør buyback-patch fra script'
        run: |
          python scripts/tmp_apply_buyback_dashboard_patch.py
          python scripts/tmp_fix_buyback_patch_fixture.py
      - name: Run focused tests
        if: github.event.head_commit.message == 'Kjør buyback-patch fra script'
        run: |
          python -m pip install --disable-pip-version-check --quiet -r backend/requirements.txt pytest
          PYTHONPATH=backend python -m pytest -q backend/tests/test_buyback_investor_dashboard.py backend/tests/test_cloudflare_newsweb_ingestion.py
      - name: Commit code changes
        if: github.event.head_commit.message == 'Kjør buyback-patch fra script'
        run: |
          git config user.name 'MKej88'
          git config user.email 'mads.kristensen2@gmail.com'
          git add backend/app/buybacks/dashboard.py cloudflare/src/buyback_dashboard.py cloudflare/src/newsweb_buybacks.py frontend/src/BuybackPage.tsx backend/tests/test_buyback_investor_dashboard.py backend/tests/test_cloudflare_newsweb_ingestion.py
          git diff --cached --check
          git commit -m 'Fyll ut tilbakekjøpskapasitet og maks kjøpspris'
          git push origin HEAD:fix/buyback-dashboard-week-metrics-max-price
