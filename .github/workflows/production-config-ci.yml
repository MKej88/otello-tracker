name: Production config CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  production-config:
    name: Cloudflare production config dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build dashboard assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Worker tooling
        working-directory: cloudflare
        run: |
          python -m pip install workers-py==1.16.2 uv==0.12.3
          npm install --no-save wrangler@4.123.0

      - name: Render production-shaped config
        env:
          CLOUDFLARE_D1_DATABASE_ID: 11111111-2222-3333-4444-555555555555
          CLOUDFLARE_WORKER_NAME: otello-tracker
          CLOUDFLARE_D1_DATABASE_NAME: otello-nav
          CLOUDFLARE_R2_BUCKET_NAME: otello-source-archive
        run: python cloudflare/tools/render_production_config.py

      - name: Validate rendered fields and cost guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('cloudflare/wrangler.production.jsonc').read_text())
          assert config['name'] == 'otello-tracker'
          assert config['main'] == 'src/worker.py'
          assert config['workers_dev'] is True
          assert config['compatibility_date'] == '2026-08-18'
          assert config['d1_databases'][0]['database_id'] == '11111111-2222-3333-4444-555555555555'
          assert config['r2_buckets'][0]['bucket_name'] == 'otello-source-archive'
          assert 'browser' not in config
          assert 'cache' not in config
          assert config['exports']['default']['type'] == 'worker'
          assert config['exports']['default']['cache']['enabled'] is True
          assert config['observability']['enabled'] is True
          assert config['observability']['logs']['enabled'] is True
          assert config['observability']['logs']['invocation_logs'] is True
          assert config['observability']['logs']['head_sampling_rate'] == 0.05
          assert config['observability']['traces']['enabled'] is False
          assert config['limits']['cpu_ms'] == 60000
          assert config['limits']['subrequests'] == 500
          assert config['triggers']['crons'] == ['*/30 * * * *']
          workflows = {item['binding']: item for item in config['workflows']}
          assert workflows['FULL_REFRESH']['schedules'] == ['35 3 * * *']
          assert 'SHAREHOLDER_SNAPSHOT' not in workflows

          shareholder_ci = Path('.github/workflows/prime-shareholder-snapshot.yml').read_text()
          assert 'cron: "15 3 * * *"' in shareholder_ci
          assert 'branches: ["main"]' in shareholder_ci
          assert 'capture_shareholder_top20.mjs' in shareholder_ci
          assert 'store_shareholder_top20_d1.mjs' in shareholder_ci
          PY

      - name: Dry-run production Python Worker bundle
        working-directory: cloudflare
        run: >-
          pywrangler deploy --dry-run
          --config wrangler.production.jsonc
          --outdir /tmp/otello-production-dist
