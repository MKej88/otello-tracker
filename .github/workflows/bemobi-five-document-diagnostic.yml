name: Bemobi five-document translation diagnosis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bemobi-five-document-diagnostic.yml
      - tools/diagnose_bemobi_five_documents.py
  pull_request:
    paths:
      - .github/workflows/bemobi-five-document-diagnostic.yml
      - tools/diagnose_bemobi_five_documents.py
      - backend/tests/test_bemobi_five_document_diagnostic.py

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - run: python3 -m pytest -q backend/tests/test_bemobi_five_document_diagnostic.py
  diagnose:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Les kun de fem dokumentradene
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/diagnose_bemobi_five_documents.py collect "$RUNNER_TEMP/bemobi-five"
      - run: npm ci --prefix cloudflare --no-audit --no-fund
      - name: Verifiser eksisterende R2-originaler med lesetilgang
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
        run: python3 tools/diagnose_bemobi_five_documents.py read-r2 "$RUNNER_TEMP/bemobi-five"
      - name: Analyser originaltekst og numerisk deling uten credentials
        run: python3 tools/diagnose_bemobi_five_documents.py diagnose "$RUNNER_TEMP/bemobi-five"
