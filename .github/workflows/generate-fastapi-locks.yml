name: Temporary FastAPI lock regeneration (remove before merge)
on:
  pull_request:
    paths:
      - ".github/workflows/generate-fastapi-locks.yml"
permissions:
  contents: read
jobs:
  regenerate:
    name: Compile Python 3.12 hash locks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate and emit both locked dependency files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.3
          uv pip compile backend/requirements.txt --python-version 3.12 --python-platform x86_64-manylinux_2_17 --generate-hashes --output-file backend/requirements.lock.txt
          uv pip compile backend/requirements-dev.txt --python-version 3.12 --python-platform x86_64-manylinux_2_17 --generate-hashes --output-file backend/requirements-dev.lock.txt
          python - <<'PY'
          import json
          from pathlib import Path
          for file in ("backend/requirements.lock.txt", "backend/requirements-dev.lock.txt"):
              body = Path(file).read_text()
              assert "fastapi==0.142.2" in body
              assert "opentelemetry-api==" in body
              print("OTELLO_LOCK_BEGIN " + file)
              for line in body.splitlines(keepends=True):
                  print("OTELLO_LOCK_LINE " + json.dumps(line, ensure_ascii=True))
              print("OTELLO_LOCK_END " + file)
          PY
