name: NewsWeb full history smoke

on:
  push:
    branches: [phase-9-4-full-newsweb-history-clean]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Full NewsWeb archive and historical buyback validation
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from app.buybacks.official_backfill import seed_known_official_buybacks
          from app.db.connection import get_connection
          from app.db.migration_runner import init_database
          from app.history import seed_curated_history
          from app.newsweb import (
              collect_newsweb_buybacks,
              collect_newsweb_history,
              newsweb_history_status,
              sync_newsweb_daily_buyback_cash,
          )

          with tempfile.TemporaryDirectory() as tmp:
              db = str(Path(tmp) / "phase94.db")
              init_database(db)
              seed_curated_history(db)
              seed_known_official_buybacks(db)

              archive = collect_newsweb_history(
                  db, from_date="2020-01-01", to_date="2026-08-17", timeout=45
              )
              print("ARCHIVE", json.dumps(archive, indent=2, ensure_ascii=False, default=str))
              archive_status = newsweb_history_status(db)
              print("ARCHIVE_STATUS", json.dumps(archive_status, indent=2, ensure_ascii=False))
              if archive["errors"]:
                  raise SystemExit(f"Archive errors: {archive['errors'][:10]}")
              if archive["archived"] < 500:
                  raise SystemExit(f"Too few archived messages: {archive['archived']}")
              # NewsWeb's first OTEC message in the requested 2020+ window is 11 Feb 2020.
              if archive_status.get("from") > "2020-02-29":
                  raise SystemExit(f"Archive does not reach the first 2020 OTEC records: {archive_status}")

              with get_connection(db) as connection:
                  body_leak = connection.execute(
                      """
                      SELECT COUNT(*) n FROM source_documents sd
                      JOIN sources s ON s.id=sd.source_id
                      WHERE s.code='NEWSWEB'
                        AND (sd.metadata_json LIKE '%\"body\"%' OR sd.metadata_json LIKE '%body_persisted\": true%')
                      """
                  ).fetchone()["n"]
                  if body_leak:
                      raise SystemExit(f"NewsWeb body persistence marker found: {body_leak}")

              buybacks = collect_newsweb_buybacks(
                  db, from_date="2023-06-20", to_date="2026-08-17", timeout=45
              )
              print("BUYBACKS", json.dumps({
                  "discovered": buybacks["discovered"],
                  "ingested": buybacks["ingested"],
                  "daily_rows": buybacks["daily_rows"],
                  "review": buybacks["attachment_review_count"],
                  "errors": buybacks["errors"],
              }, indent=2, ensure_ascii=False, default=str))
              sync = sync_newsweb_daily_buyback_cash(db)
              print("SYNC", json.dumps(sync, indent=2, ensure_ascii=False, default=str))
              if buybacks["errors"]:
                  raise SystemExit(f"Historical buyback errors: {buybacks['errors'][:10]}")
              if buybacks["discovered"] < 120:
                  raise SystemExit(f"Too few historical buyback messages: {buybacks['discovered']}")
              if sync["weeks_synced"] < 100:
                  raise SystemExit(f"Too few daily-cash weeks: {sync['weeks_synced']}")
          PY
