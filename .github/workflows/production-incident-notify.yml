name: Production incident notifications

# Trusted default-branch workflow. Never check out code from the triggering run.
on:
  workflow_run:
    workflows: ["Cloudflare workflow diagnostics"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: otello-production-incident-notifications
  cancel-in-progress: false

jobs:
  incident:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'schedule' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or resolve incident issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
          PARENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["PARENT_RUN_ID"]
          run_url = os.environ["PARENT_RUN_URL"]
          base = "https://api.github.com/repos/" + repo
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              raw = None if payload is None else json.dumps(payload).encode("utf-8")
              req = Request(url, data=raw, headers=headers, method=method)
              with urlopen(req, timeout=25) as response:
                  body = response.read()
              return json.loads(body) if body else {}

          # Distinguish the nightly D1 diagnosis from the 2-hour freshness probe.
          jobs = request("GET", base + "/actions/runs/" + run_id + "/jobs?per_page=100")["jobs"]
          kinds = [
              ("nightly", "Read Cloudflare Workflow and D1 status",
               "OtelloTracker: nattlig produksjonsdiagnose feilet"),
              ("fast", "Read-only fast-refresh watchdog",
               "OtelloTracker: 30-minuttersoppdatering feilet"),
          ]
          selected = [
              (slug, title, job["conclusion"])
              for slug, job_name, title in kinds
              for job in jobs
              if job.get("name") == job_name
              and job.get("conclusion") in {"success", "failure"}
          ]
          if not selected:
              print("No completed production diagnosis to notify")
              raise SystemExit(0)

          for slug, title, result in selected:
              marker = "<!-- otello-production-incident:" + slug + " -->"
              body = (
                  marker + "\n"
                  "Automatisk driftsvarsel uten produksjonsdata eller hemmeligheter.\n\n"
                  "**Siste feilede kontroll:** " + run_url + "\n\n"
                  "Se GitHub Actions-loggen og [fast statusrapport](https://github.com/"
                  + repo + "/issues/164) før eventuell omkjøring.\n\n"
                  "Saken lukkes automatisk etter en vellykket kontroll av samme type."
              )
              # Search all recent issue states, then match a unique private marker.
              query = quote("repo:" + repo + " is:issue in:title \"" + title + "\"", safe="")
              results = request("GET", "https://api.github.com/search/issues?q=" + query
                                + "&per_page=100").get("items", [])
              found = next((i for i in results if marker in (i.get("body") or "")), None)
              if result == "failure":
                  if found:
                      if found.get("state") == "open":
                          print(slug + ": existing open alert " + str(found["number"]))
                          continue
                      request("PATCH", base + "/issues/" + str(found["number"]),
                              {"state": "open", "body": body})
                      print(slug + ": reopened incident " + str(found["number"]))
                  else:
                      issue = request("POST", base + "/issues", {
                          "title": title,
                          "body": body,
                          "assignees": ["MKej88"],
                      })
                      print(slug + ": opened incident " + str(issue["number"]))
              elif found and found.get("state") == "open":
                  request("PATCH", base + "/issues/" + str(found["number"]),
                          {"state": "closed", "state_reason": "completed"})
                  print(slug + ": resolved incident " + str(found["number"]))
              else:
                  print(slug + ": healthy; no open incident")
          PY
