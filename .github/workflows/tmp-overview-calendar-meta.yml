name: Apply overview calendar metadata

on:
  push:
    branches:
      - ui/overview-calendar-time-consensus
    paths:
      - .github/workflows/tmp-overview-calendar-meta.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/overview-calendar-time-consensus
          persist-credentials: true

      - name: Update overview calendar metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/OverviewPage.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '''type BrazilCalendarEvent = {
            date: string;
            name: string;
            kind: string;
            importance: string;
          };''',
              '''type BrazilCalendarExpectation = {
            value?: number | null;
            unit?: string;
            event_consensus?: boolean;
            previous?: string | null;
            release_at_utc?: string | null;
          };

          type BrazilCalendarEvent = {
            date: string;
            name: string;
            kind: string;
            importance: string;
            expectation?: BrazilCalendarExpectation | null;
          };''',
          )

          replace_once(
              '''  source?: string | null;
            importance: number;
          };''',
              '''  source?: string | null;
            importance: number;
            macroExpectation?: BrazilCalendarExpectation | null;
          };''',
          )

          replace_once(
              '''function countdownLabel(input: string) {
            const days = daysUntil(input);
            if (days == null) return "";
            if (days === 0) return "I dag";
            if (days === 1) return "I morgen";
            return days > 1 ? `Om ${days} dager` : "";
          }

          function macroTitle''',
              '''function countdownLabel(input: string) {
            const days = daysUntil(input);
            if (days == null) return "";
            if (days === 0) return "I dag";
            if (days === 1) return "I morgen";
            return days > 1 ? `Om ${days} dager` : "";
          }

          function norwayReleaseTime(value?: string | null) {
            if (!value) return null;
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return null;
            return new Intl.DateTimeFormat("nb-NO", {
              timeZone: "Europe/Oslo",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            }).format(parsed);
          }

          function expectationLabel(expectation?: BrazilCalendarExpectation | null) {
            if (!expectation?.event_consensus) return null;
            const value = finiteNumber(expectation.value);
            if (value == null) return null;
            const unit = expectation.unit ? ` ${expectation.unit}` : "";
            return `Konsensus ${formatNumber(value, 2)}${unit}`;
          }

          function eventMetaLabel(event: OverviewEvent) {
            if (event.badgeClass === "macro") {
              const parts: string[] = [];
              const releaseTime = norwayReleaseTime(event.macroExpectation?.release_at_utc);
              const expectation = expectationLabel(event.macroExpectation);
              if (releaseTime) parts.push(`Norsk tid kl. ${releaseTime}`);
              if (expectation) parts.push(expectation);
              if (expectation && event.macroExpectation?.previous) {
                parts.push(`Forrige ${event.macroExpectation.previous}`);
              }
              return parts.join(" · ");
            }
            return `${event.confirmed ? "Bekreftet dato" : "Forventet dato"}${event.source ? ` · ${event.source}` : ""}`;
          }

          function macroTitle''',
          )

          replace_once(
              '''      confirmed: true,
                source: "BCB / IBGE",
                importance: 0,
              });''',
              '''      confirmed: true,
                importance: 0,
                macroExpectation: event.expectation,
              });''',
          )

          replace_once(
              '''                  <small>{nextEvent.confirmed ? "Bekreftet dato" : "Forventet dato"}{nextEvent.source ? ` · ${nextEvent.source}` : ""}</small>''',
              '''                  {eventMetaLabel(nextEvent) ? <small>{eventMetaLabel(nextEvent)}</small> : null}''',
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-overview-calendar-meta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/OverviewPage.tsx .github/workflows/tmp-overview-calendar-meta.yml
          git commit -m "Vis norsk tid og konsensus i viktige datoer"
          git push origin HEAD:ui/overview-calendar-time-consensus
