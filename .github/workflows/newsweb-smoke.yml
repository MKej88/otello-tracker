name: NewsWeb smoke

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Live NewsWeb cross-anchor integration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from decimal import Decimal

          from app.db.connection import get_connection
          from app.db.migration_runner import init_database
          from app.history import seed_curated_history
          from app.newsweb import collect_newsweb_buybacks, sync_newsweb_daily_buyback_cash
          from app.nav.cash_curve import _known_movements

          with tempfile.TemporaryDirectory() as tmp:
              db = str(Path(tmp) / "newsweb-live.db")
              init_database(db)
              seed_curated_history(db)

              result = collect_newsweb_buybacks(
                  db,
                  from_date="2025-06-25",
                  to_date="2025-07-10",
              )
              print("COLLECT", json.dumps(result, indent=2, ensure_ascii=False, default=str))
              if result["errors"]:
                  raise SystemExit(f"NewsWeb live collector errors: {result['errors']}")
              if result["ingested"] < 1 or result["daily_rows"] < 1:
                  raise SystemExit("NewsWeb live collector returned no daily buyback data")

              sync = sync_newsweb_daily_buyback_cash(db)
              print("SYNC", json.dumps(sync, indent=2, ensure_ascii=False, default=str))
              if sync["weeks_synced"] < 1:
                  raise SystemExit("No NewsWeb daily buyback weeks synced to cash")

              with get_connection(db) as connection:
                  rows = connection.execute(
                      """
                      SELECT d.trade_date, d.shares, d.amount_nok, b.trade_date period_end
                      FROM buyback_daily_transactions d
                      JOIN buybacks b ON b.id=d.weekly_buyback_id
                      WHERE d.trade_date BETWEEN '2025-06-25' AND '2025-07-10'
                      ORDER BY d.trade_date
                      """
                  ).fetchall()
                  print("DAILY", [dict(row) for row in rows])
                  if not rows:
                      raise SystemExit("No live daily transaction rows")

                  crossing = [row for row in rows if row["trade_date"] == "2025-06-30"]
                  after = [row for row in rows if row["trade_date"] > "2025-06-30"]
                  if not crossing or not after:
                      raise SystemExit("Expected NewsWeb week crossing the 2025-06-30 cash anchor")

                  movements = _known_movements(connection, "2025-06-30", "2025-07-10")
                  daily_movements = [
                      item for item in movements
                      if item["movement_type"] == "OTELLO_BUYBACK_DAILY"
                  ]
                  if any(item["movement_date"] <= "2025-06-30" for item in daily_movements):
                      raise SystemExit("Pre/at-anchor daily buyback leaked into post-anchor cash")
                  if not daily_movements:
                      raise SystemExit("Expected post-anchor NewsWeb daily cash movements")

                  weekly_cash = connection.execute(
                      """
                      SELECT COUNT(*) n FROM cash_movements cm
                      JOIN buyback_daily_transactions d ON d.weekly_buyback_id=cm.buyback_id
                      WHERE cm.movement_type='OTELLO_BUYBACK'
                        AND d.trade_date BETWEEN '2025-06-25' AND '2025-07-10'
                      """
                  ).fetchone()["n"]
                  if weekly_cash != 0:
                      raise SystemExit("Weekly cash summary remains alongside NewsWeb daily cash")
          PY
