name: NewsWeb smoke

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect NewsWeb list contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          UA = "otello-tracker/phase-9.3"
          app_url = "https://newsweb.oslobors.no/"
          html = urllib.request.urlopen(urllib.request.Request(app_url, headers={"User-Agent": UA}), timeout=30).read().decode("utf-8", "replace")
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, re.I)
          print("SCRIPTS", scripts)
          for src in scripts:
              js_url = urllib.parse.urljoin(app_url, src)
              js = urllib.request.urlopen(urllib.request.Request(js_url, headers={"User-Agent": UA}), timeout=30).read().decode("utf-8", "replace")
              print("JS_LEN", len(js), js_url)
              for needle in ("newsreader/list", "newsreader/customQuery", "issuerId", "issuerIds", "fromDate", "toDate"):
                  start = 0
                  count = 0
                  while True:
                      pos = js.find(needle, start)
                      if pos < 0 or count >= 8:
                          break
                      lo = max(0, pos - 1200)
                      hi = min(len(js), pos + 1800)
                      print(f"SNIPPET {needle} #{count+1}")
                      print(js[lo:hi])
                      print("END_SNIPPET")
                      start = pos + len(needle)
                      count += 1
          PY
