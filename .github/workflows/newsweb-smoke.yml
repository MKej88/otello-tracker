name: NewsWeb smoke

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NewsWeb message and attachment API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          import io
          import json
          import urllib.request
          from pypdf import PdfReader

          base = "https://api3.oslo.oslobors.no/v1/newsreader"
          message_id = 678028
          headers = {
              "Accept": "application/json",
              "Origin": "https://newsweb.oslobors.no",
              "Referer": "https://newsweb.oslobors.no/",
              "User-Agent": "otello-tracker/phase-9.3",
          }
          req = urllib.request.Request(
              f"{base}/message?messageId={message_id}",
              data=b"{}",
              method="POST",
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode("utf-8"))
          message = data["data"]["message"]
          print("MESSAGE", message["messageId"], message["issuerSign"], message["publishedTime"])
          print("BODY", message["body"])
          print("ATTACHMENTS", json.dumps(message["attachments"], ensure_ascii=False))

          attachment = message["attachments"][0]
          attachment_url = f"{base}/attachment?messageId={message_id}&attachmentId={attachment['id']}"
          req = urllib.request.Request(
              attachment_url,
              headers={"Accept": "application/pdf", "User-Agent": "otello-tracker/phase-9.3"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              pdf = r.read()
              print("PDF", r.status, r.headers.get("content-type"), len(pdf), attachment_url)
          reader = PdfReader(io.BytesIO(pdf))
          text = "\n".join(page.extract_text() or "" for page in reader.pages)
          print("PDF_TEXT_BEGIN")
          print(text[:30000])
          print("PDF_TEXT_END")
          PY
