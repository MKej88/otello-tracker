name: NewsWeb smoke

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NewsWeb OTEC list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://api3.oslo.oslobors.no/v1/newsreader"
          params = {
              "category": "",
              "issuer": "7759",
              "fromDate": "2026-06-01",
              "toDate": "2026-08-17",
              "market": "",
              "messageTitle": "share buyback program status",
          }
          url = f"{base}/list?{urllib.parse.urlencode(params)}"
          req = urllib.request.Request(
              url,
              data=b"{}",
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Origin": "https://newsweb.oslobors.no",
                  "Referer": "https://newsweb.oslobors.no/",
                  "User-Agent": "otello-tracker/phase-9.3",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.loads(r.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False, indent=2)[:50000])
          data = payload.get("data", payload)
          messages = data.get("messages", [])
          print("COUNT", len(messages), "OVERFLOW", data.get("overflow"))
          assert messages, "NewsWeb returned no OTEC buyback messages"
          assert all(str(m.get("issuerId")) == "7759" for m in messages)
          assert any(int(m.get("messageId", m.get("id", 0))) == 678028 for m in messages)
          PY
