name: NewsWeb smoke

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Live NewsWeb integration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from app.db.connection import get_connection
          from app.db.migration_runner import init_database
          from app.history import seed_curated_history
          from app.newsweb import collect_newsweb_buybacks, sync_newsweb_daily_buyback_cash

          with tempfile.TemporaryDirectory() as tmp:
              db = str(Path(tmp) / "newsweb-live.db")
              init_database(db)
              seed_curated_history(db)

              historical = collect_newsweb_buybacks(
                  db, from_date="2025-06-25", to_date="2025-07-10"
              )
              print("HISTORICAL", json.dumps(historical, indent=2, ensure_ascii=False, default=str))
              if historical["errors"]:
                  raise SystemExit(f"Historical NewsWeb errors: {historical['errors']}")
              if historical["daily_rows"] < 1:
                  raise SystemExit("Expected at least one historical attachment with daily detail")
              missing = [r for r in historical["results"] if r.get("message_id") == 650769]
              if not missing or missing[0].get("daily_status") != "NO_TRANSACTION_ATTACHMENT":
                  raise SystemExit("Expected 2025-07-04 week to retain weekly fallback")
              reconciled = [r for r in historical["results"] if r.get("daily_status") == "RECONCILED"]
              if not reconciled:
                  raise SystemExit("Expected immaterial historical amount difference to be RECONCILED")

              current = collect_newsweb_buybacks(
                  db, from_date="2026-07-11", to_date="2026-07-11"
              )
              print("CURRENT", json.dumps(current, indent=2, ensure_ascii=False, default=str))
              if current["errors"]:
                  raise SystemExit(f"Current NewsWeb errors: {current['errors']}")
              message = [r for r in current["results"] if r.get("message_id") == 678028]
              if not message:
                  raise SystemExit("Expected NewsWeb message 678028")
              detail = message[0]
              if detail.get("daily_rows") != 5:
                  raise SystemExit(f"Expected 5 daily rows, got {detail.get('daily_rows')}")
              if detail.get("daily_reconciliation", {}).get("shares") != 65300:
                  raise SystemExit("Expected 65,300 shares in message 678028 attachment")

              sync = sync_newsweb_daily_buyback_cash(db)
              print("SYNC", json.dumps(sync, indent=2, ensure_ascii=False, default=str))
              if sync["weeks_synced"] < 2:
                  raise SystemExit("Expected at least two attachment-backed weeks synced to cash")

              with get_connection(db) as connection:
                  rows = connection.execute(
                      """
                      SELECT movement_date, amount_nok
                      FROM cash_movements
                      WHERE movement_type='OTELLO_BUYBACK_DAILY'
                        AND buyback_id=(SELECT id FROM buybacks WHERE trade_date='2026-07-10' ORDER BY id LIMIT 1)
                      ORDER BY movement_date
                      """
                  ).fetchall()
                  if len(rows) != 5:
                      raise SystemExit(f"Expected 5 NewsWeb daily cash rows for 2026-07-10 week, got {len(rows)}")
                  weekly = connection.execute(
                      """
                      SELECT COUNT(*) n FROM cash_movements
                      WHERE movement_type='OTELLO_BUYBACK'
                        AND buyback_id=(SELECT id FROM buybacks WHERE trade_date='2026-07-10' ORDER BY id LIMIT 1)
                      """
                  ).fetchone()["n"]
                  if weekly != 0:
                      raise SystemExit("Weekly cash summary remains alongside NewsWeb daily cash")
          PY
