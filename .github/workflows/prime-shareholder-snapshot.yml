name: Daily shareholder snapshot

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shareholder-top20-production
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
      TOP20_OUTPUT: /tmp/otec-top20.json
      TOP20_DEBUG_DIR: /tmp/otec-top20-debug
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate production settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_PUBLIC_URL"
          command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null || command -v chromium >/dev/null

      - name: Install pinned Playwright client
        run: npm install --no-save --ignore-scripts --prefix cloudflare/tools playwright-core@1.58.2

      - name: Capture Euronext Top 20 in regular Chrome
        run: node cloudflare/tools/capture_shareholder_top20.mjs

      - name: Store validated Top 20 in production D1
        run: node cloudflare/tools/store_shareholder_top20_d1.mjs

      - name: Verify public Top 20 API
        shell: bash
        run: |
          set -euo pipefail
          target_date="$(TZ=Europe/Oslo date +%F)"
          base="${CLOUDFLARE_PUBLIC_URL%/}"
          ready=0
          for attempt in $(seq 1 6); do
            sleep 2
            curl --fail --show-error --silent \
              "$base/api/shareholders/dashboard?github_capture=${attempt}-$(date +%s)" \
              -o /tmp/otello-shareholders-after.json
            if TARGET_DATE="$target_date" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/otello-shareholders-after.json', 'utf8'));
          const history = payload.history || {};
          const snapshots = history.snapshots || [];
          const rows = history.latest_rows || [];
          const latestDate = String((snapshots[0] || {}).snapshot_date || '').slice(0, 10);
          process.exit(latestDate === process.env.TARGET_DATE && rows.length === 20 ? 0 : 1);
          NODE
            then
              ready=1
              break
            fi
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::D1 was written, but the public dashboard did not expose today’s 20 rows.'
            cat /tmp/otello-shareholders-after.json || true
            exit 1
          fi
          echo "Top 20 snapshot ready for ${target_date}."

      - name: Upload Top 20 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: top20-diagnostics-${{ github.run_id }}
          path: |
            /tmp/otec-top20-debug
            /tmp/otec-top20.json
            /tmp/otello-shareholders-after.json
          if-no-files-found: ignore
          retention-days: 7
