name: Bemobi August 2026 JCP diagnostic

on:
  push:
    branches: [phase-10-august-2026-jcp]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: pip install 'pypdf>=5,<7'
      - name: Inspect exact official CVM August 2026 shareholder notice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import re
          import urllib.request
          from pypdf import PdfReader

          url = 'https://www.rad.cvm.gov.br/ENET/frmDownloadDocumento.aspx?Tela=ext&descTipo=IPE&CodigoInstituicao=1&numProtocolo=1556263&numSequencia=1080969&numVersao=2'
          request = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; otello-tracker/1.0; private research)',
                  'Accept': 'application/pdf,text/html;q=0.9,*/*;q=0.8',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read(15 * 1024 * 1024)
                  content_type = response.headers.get('Content-Type', '')
                  final_url = response.geturl()
          except Exception as exc:
              print('FETCH_ERROR', repr(exc))
              raise

          print('META', {'content_type': content_type, 'bytes': len(body), 'final_url': final_url, 'magic': body[:16]})
          if body.startswith(b'%PDF') or 'pdf' in content_type.lower():
              reader = PdfReader(io.BytesIO(body))
              text = '\n'.join((page.extract_text() or '') for page in reader.pages[:15])
              text = re.sub(r'\n{3,}', '\n\n', text)
              print('TEXT_BEGIN')
              print(text[:50000])
              print('TEXT_END')
          else:
              decoded = body.decode('utf-8', errors='replace')
              print('BODY_BEGIN')
              print(decoded[:30000])
              print('BODY_END')
          PY
