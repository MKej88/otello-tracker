name: Update overview performance contract tests

on:
  push:
    branches:
      - perf/overview-events-bootstrap
    paths:
      - .github/workflows/tmp-update-overview-perf-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/overview-events-bootstrap
          persist-credentials: true

      - name: Update reference tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path_str: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: expected one match, got {count}: {old[:120]!r}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          patch(
              "backend/tests/test_dashboard_hot_snapshot.py",
              [
                  (
                      '        "forecast": asyncio.Event(),\n',
                      '        "forecast": asyncio.Event(),\n        "events": asyncio.Event(),\n',
                  ),
                  (
                      '    async def fake_forecast(_repository):\n'
                      '        calls.append("forecast")\n'
                      '        await mark_started("forecast")\n'
                      '        return {\n'
                      '            "ready": True,\n'
                      '            "status": "READY",\n'
                      '            "estimate": {"base_case_shares": 1000},\n'
                      '        }\n\n',
                      '    async def fake_forecast(_repository):\n'
                      '        calls.append("forecast")\n'
                      '        await mark_started("forecast")\n'
                      '        return {\n'
                      '            "ready": True,\n'
                      '            "status": "READY",\n'
                      '            "estimate": {"base_case_shares": 1000},\n'
                      '        }\n\n'
                      '    async def fake_events(_repository):\n'
                      '        calls.append("events")\n'
                      '        await mark_started("events")\n'
                      '        return {"ready": True, "events": [], "calendar": []}\n\n',
                  ),
                  (
                      '    monkeypatch.setattr(hot, "buyback_forecast", fake_forecast)\n\n',
                      '    monkeypatch.setattr(hot, "buyback_forecast", fake_forecast)\n'
                      '    monkeypatch.setattr(hot, "overview_events", fake_events)\n\n',
                  ),
                  (
                      '    assert result["components"] == ["economic", "forecast", "quotes", "summary"]\n',
                      '    assert result["components"] == ["economic", "events", "forecast", "quotes", "summary"]\n',
                  ),
                  (
                      '    assert set(calls[:4]) == {"summary", "economic", "quotes", "forecast"}\n',
                      '    assert set(calls[:5]) == {"summary", "economic", "quotes", "forecast", "events"}\n',
                  ),
                  (
                      '    assert snapshot["forecast"]["estimate"]["base_case_shares"] == 1000\n\n'
                      '    for component in ("summary", "economic", "quotes", "forecast"):\n',
                      '    assert snapshot["forecast"]["estimate"]["base_case_shares"] == 1000\n'
                      '    assert snapshot["events"]["ready"] is True\n\n'
                      '    for component in ("summary", "economic", "quotes", "forecast", "events"):\n',
                  ),
                  (
                      '        "forecast": {"ready": True},\n    }\n    repository.rows[hot.STATE_KEY]',
                      '        "forecast": {"ready": True},\n        "events": {"ready": True, "events": [], "calendar": []},\n    }\n    repository.rows[hot.STATE_KEY]',
                  ),
                  (
                      '    monkeypatch.setattr(hot, "buyback_forecast", must_not_run)\n\n'
                      '    result = asyncio.run(hot.refresh_dashboard_hot_snapshot(repository, force=False))',
                      '    monkeypatch.setattr(hot, "buyback_forecast", must_not_run)\n'
                      '    monkeypatch.setattr(hot, "overview_events", must_not_run)\n\n'
                      '    result = asyncio.run(hot.refresh_dashboard_hot_snapshot(repository, force=False))',
                  ),
                  (
                      '        "forecast": {"ready": True, "status": "READY"},\n    }\n    repository.rows[hot.STATE_KEY]',
                      '        "forecast": {"ready": True, "status": "READY"},\n        "events": {"ready": True, "events": [], "calendar": []},\n    }\n    repository.rows[hot.STATE_KEY]',
                  ),
                  (
                      '    monkeypatch.setattr(hot, "buyback_forecast", must_not_run)\n\n'
                      '    result = asyncio.run(hot.dashboard_bootstrap_payload(repository))',
                      '    monkeypatch.setattr(hot, "buyback_forecast", must_not_run)\n'
                      '    monkeypatch.setattr(hot, "overview_events", must_not_run)\n\n'
                      '    result = asyncio.run(hot.dashboard_bootstrap_payload(repository))',
                  ),
                  (
                      '    assert result["forecast"] == existing["forecast"]\n    assert result["meta"]["source"]',
                      '    assert result["forecast"] == existing["forecast"]\n'
                      '    assert result["events"] == existing["events"]\n'
                      '    assert result["meta"]["source"]',
                  ),
                  (
                      '        "forecast": {"ready": True},\n    }\n    encoded = json.dumps(existing)',
                      '        "forecast": {"ready": True},\n        "events": {"ready": True, "events": [], "calendar": []},\n    }\n    encoded = json.dumps(existing)',
                  ),
                  (
                      '    assert status["components"] == ["economic", "forecast", "quotes", "summary"]\n',
                      '    assert status["components"] == ["economic", "events", "forecast", "quotes", "summary"]\n',
                  ),
                  (
                      '                "forecast": {"ready": True},\n            }\n        ),',
                      '                "forecast": {"ready": True},\n                "events": {"ready": True, "events": [], "calendar": []},\n            }\n        ),',
                  ),
              ],
          )

          patch(
              "backend/tests/test_estimated_cash_card.py",
              [
                  ('STATE_KEY = "dashboard_hot_snapshot_v6"', 'STATE_KEY = "dashboard_hot_snapshot_v7"'),
                  ('SNAPSHOT_VERSION = 6', 'SNAPSHOT_VERSION = 7'),
              ],
          )

          patch(
              "backend/tests/test_nav_live_composition_contract.py",
              [
                  ('STATE_KEY = "dashboard_hot_snapshot_v6"', 'STATE_KEY = "dashboard_hot_snapshot_v7"'),
                  ('SNAPSHOT_VERSION = 6', 'SNAPSHOT_VERSION = 7'),
              ],
          )

          patch(
              "backend/tests/test_first_load_performance_contract.py",
              [
                  (
                      'assert \'CLIENT_CACHE_KEY = "otello.dashboard.bootstrap.v1"\' in source',
                      'assert \'CLIENT_CACHE_KEY = "otello.dashboard.bootstrap.v2"\' in source',
                  ),
                  (
                      '    assert overview.count("    true,\\n  );") == 7\n'
                      '    assert \'"/api/dashboard/discount-history?days=365&max_points=72"\' in overview\n'
                      '    assert \'"/api/news-events"\' in overview\n'
                      '    assert \'"/api/brazil/dashboard"\' in overview\n',
                      '    assert overview.count("    true,\\n  );") == 6\n'
                      '    assert \'"/api/dashboard/discount-history?days=365&max_points=72"\' in overview\n'
                      '    assert \'"/api/overview/events"\' in overview\n'
                      '    assert \'"/api/news-events"\' not in overview\n'
                      '    assert \'"/api/brazil/dashboard"\' not in overview\n',
                  ),
              ],
          )

          patch(
              "backend/tests/test_overview_cockpit_frontend.py",
              [
                  (
                      '    assert \'"/api/news-events"\' in source\n'
                      '    assert \'"/api/brazil/dashboard"\' in source\n',
                      '    assert \'"/api/overview/events"\' in source\n'
                      '    assert \'"/api/news-events"\' not in source\n'
                      '    assert \'"/api/brazil/dashboard"\' not in source\n',
                  ),
              ],
          )

          Path("backend/tests/test_overview_event_sources.py").write_text(
              '''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[2]\nOVERVIEW = ROOT / "frontend" / "src" / "OverviewPage.tsx"\nOVERVIEW_EVENTS = ROOT / "cloudflare" / "src" / "overview_events.py"\nBRAZIL_CACHE = ROOT / "cloudflare" / "src" / "brazil_focus_resilience.py"\n\n\ndef test_overview_uses_lightweight_company_and_macro_event_feed() -> None:\n    overview = OVERVIEW.read_text(encoding="utf-8")\n    event_feed = OVERVIEW_EVENTS.read_text(encoding="utf-8")\n    brazil_cache = BRAZIL_CACHE.read_text(encoding="utf-8")\n\n    assert '"/api/overview/events"' in overview\n    assert '"/api/news-events"' not in overview\n    assert '"/api/brazil/dashboard"' not in overview\n    assert '"/api/bemobi/dashboard"' not in overview\n    assert "bemobi_investor_facts" in event_feed\n    assert "calendar_events(as_of_date=today_iso, focus={})" in event_feed\n    assert "apply_cached_event_expectations" in event_feed\n    assert "live_external_fetches" in event_feed\n    assert "EVENT_STATE_KEY" in brazil_cache\n    assert 'event.importance.startsWith("Høy")' in overview\n''',
              encoding="utf-8",
          )

          Path("backend/tests/test_overview_no_blocking_calendar.py").write_text(
              '''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[2]\nOVERVIEW = ROOT / "frontend" / "src" / "OverviewPage.tsx"\n\n\ndef test_case_calendar_is_independent_of_live_nav_rendering() -> None:\n    page = OVERVIEW.read_text(encoding="utf-8")\n\n    assert 'const { data: nav } = usePollingResource<EstimatedNav>(' in page\n    assert 'const { data: overviewEvents } = usePollingResource<OverviewEventsPayload>(' in page\n    assert '"/api/overview/events"' in page\n    assert 'nav?.ready ? `${formatNumber(nav.nav_per_share, 2)} kr` : "Laster …"' in page\n    assert 'const events = upcomingEvents(overviewEvents);' in page\n''',
              encoding="utf-8",
          )

          patch(
              "backend/tests/test_overview_upcoming_events.py",
              [
                  (
                      '    assert \'"/api/news-events"\' in page\n'
                      '    assert \'"/api/brazil/dashboard"\' in page\n',
                      '    assert \'"/api/overview/events"\' in page\n'
                      '    assert \'"/api/news-events"\' not in page\n'
                      '    assert \'"/api/brazil/dashboard"\' not in page\n',
                  ),
              ],
          )

          patch(
              "backend/tests/test_runtime_fx_self_heal.py",
              [
                  (
                      '                        "forecast": {},\n                    }\n',
                      '                        "forecast": {},\n                        "events": {},\n                    }\n',
                  ),
              ],
          )
          PY

      - name: Remove workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-update-overview-perf-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests .github/workflows/tmp-update-overview-perf-tests.yml
          git commit -m "Oppdater kontrakttester for rask event-feed"
          git push origin HEAD:perf/overview-events-bootstrap
