name: Temporary source health patch

on:
  push:
    branches:
      - fix/source-health-degraded

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-health-degraded
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply parser changes
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/apply.py
          python /tmp/apply.py
      - name: Run targeted tests
        run: |
          python -m pip install --disable-pip-version-check --quiet -r backend/requirements.txt
          PYTHONPATH=backend pytest -q backend/tests/test_newsweb_enrichment.py backend/tests/test_cloudflare_newsweb_ingestion.py backend/tests/test_bemobi_web_refresh.py
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'MKej88'
          git config user.email 'mads.kristensen2@gmail.com'
          git rm .github/workflows/tmp-source-health-diagnostic.yml
          git add cloudflare/src/newsweb_daily_buybacks.py backend/app/newsweb/enrichment.py cloudflare/src/bemobi_web_refresh.py backend/tests/test_newsweb_enrichment.py backend/tests/test_cloudflare_newsweb_ingestion.py backend/tests/test_bemobi_web_refresh.py
          git diff --cached --check
          git commit -m 'Rett degraderte Bemobi- og NewsWeb-kilder'
          git push origin HEAD:fix/source-health-degraded
