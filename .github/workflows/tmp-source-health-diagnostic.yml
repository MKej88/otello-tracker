name: Temporary source health diagnostic

on:
  push:
    branches:
      - fix/source-health-degraded

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_API_BASE: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || 'otello-nav' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve official Bemobi 2Q26 presentation URL
        shell: bash
        run: |
          set -Eeuo pipefail
          databases_url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "name=${D1_DATABASE_NAME}" --data-urlencode "per_page=10" \
            "$databases_url" > databases.json
          database_id="$(python - <<'PY'
          import json, os
          rows=[r for r in json.load(open('databases.json',encoding='utf-8')).get('result',[]) if r.get('name')==os.environ['D1_DATABASE_NAME']]
          if len(rows)!=1: raise SystemExit('D1 database not uniquely resolved')
          print(rows[0]['uuid'])
          PY
          )"
          python - <<'PY'
          import json
          sql="""
          SELECT sd.id, sd.url, sd.title FROM company_news cn
          JOIN instruments i ON i.id=cn.issuer_instrument_id
          JOIN source_documents sd ON sd.id=cn.source_document_id
          WHERE i.symbol='BMOB3' AND cn.category='RESULTS' AND sd.url IS NOT NULL
          ORDER BY COALESCE(cn.published_at, sd.published_at) DESC, cn.id DESC LIMIT 6
          """
          json.dump({'sql':sql},open('query.json','w',encoding='utf-8'))
          PY
          query_url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${database_id}/query"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" --data-binary @query.json \
            "$query_url" > candidates.json
          python - <<'PY' > bemobi_presentation_url.txt
          import json
          from urllib.parse import urlparse
          rows=(json.load(open('candidates.json',encoding='utf-8')).get('result') or [{}])[0].get('results') or []
          matches=[r for r in rows if 'apresenta' in str(r.get('title') or '').lower() and ('2t26' in str(r.get('title') or '').lower() or '2q26' in str(r.get('title') or '').lower())]
          if len(matches)!=1: raise SystemExit(f'2Q26 presentation not uniquely resolved: {[(r.get("id"),r.get("title")) for r in rows]}')
          url=str(matches[0].get('url') or '')
          host=(urlparse(url).hostname or '').lower().rstrip('.')
          allowed=('cvm.gov.br','bemobi.com.br','mziq.com','mzweb.com.br')
          if not any(host==s or host.endswith('.'+s) for s in allowed): raise SystemExit(f'Unexpected host {host}')
          print(url)
          print('BEMOBI_PRESENTATION_SOURCE_ID=',matches[0].get('id'),file=__import__('sys').stderr)
          PY

      - name: Run production result fetcher against presentation and inspect metric labels
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --quiet 'pypdf>=5,<7'
          python - <<'PY'
          import asyncio
          import re
          import sys
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          sys.path.insert(0, str(Path('cloudflare/src').resolve()))
          import bemobi_web_refresh as b

          class Response:
              def __init__(self, response, payload):
                  self.status=getattr(response,'status',200)
                  self.ok=200 <= self.status < 300
                  self.headers={k.lower():v for k,v in response.headers.items()}
                  self.payload=payload
              async def arrayBuffer(self):
                  return self.payload

          async def fetcher(url, **kwargs):
              headers=dict(kwargs.get('headers') or {})
              req=urllib.request.Request(str(url),headers=headers)
              with urllib.request.urlopen(req,timeout=45) as response:
                  payload=response.read(20*1024*1024)
                  return Response(response,payload)

          url=Path('bemobi_presentation_url.txt').read_text().strip()
          payload,resolved,followed=asyncio.run(b._fetch_result_payload(url,fetcher=fetcher))
          text=b._pdf_text(payload)
          print('PRESENTATION_BYTES=',len(payload))
          print('PRESENTATION_RESOLVED_HOST=',urlparse(resolved).hostname)
          print('PRESENTATION_FOLLOWED_HTML=',followed)
          try:
              parsed=b.parse_bemobi_result_text(text,published_date='2026-08-12')
              print('PRESENTATION_PARSE_OK=',parsed)
          except Exception as exc:
              print('PRESENTATION_PARSE_ERROR=',type(exc).__name__,str(exc))
          for line_no,raw in enumerate(text.splitlines(),start=1):
              line=' '.join(raw.replace('\u00a0',' ').split())
              low=line.lower()
              if any(token in low for token in ('receita','ebitda','lucro','capex','cash','caixa')):
                  if len(line)>600: line=line[:600]
                  print(f'PRESENTATION_LINE_{line_no}: {line}')
          PY
