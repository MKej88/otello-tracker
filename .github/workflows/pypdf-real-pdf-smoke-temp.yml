name: Temporary pypdf issuer PDF compatibility smoke

on:
  push:
    branches:
      - dependabot/pip/cloudflare/pypdf-7.0.0
    paths:
      - .github/workflows/pypdf-real-pdf-smoke-temp.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"

      - name: Download two real public issuer PDFs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          urls = {
              "otello": "https://storage.mfn.se/c/aHR0cHM6Ly9hcGkzLm9zbG8ub3Nsb2JvcnMubm8vdjEvbmV3c3JlYWRlci9hdHRhY2htZW50P21lc3NhZ2VJZD02ODA0NDUmYXR0YWNobWVudElkPTMzMTY3OQ/report-1h26-final.pdf?news-id=907e078e-0007-50c1-b9bc-dc9b5ecf9679",
              "bemobi": "https://api.mziq.com/mzfilemanager/v2/d/deed72f2-beae-4c6f-b423-db57178bae31/72692d9f-42df-626d-15dc-d2260c2d2357?origin=2",
          }
          for name, url in urls.items():
              req = Request(url, headers={"User-Agent": "OtelloTracker-compatibility-smoke/1.0"})
              with urlopen(req, timeout=30) as response:
                  data = response.read(16_000_001)
              if len(data) > 16_000_000 or not data.startswith(b"%PDF"):
                  raise RuntimeError(f"{name} is not an expected bounded PDF")
              Path(name + ".pdf").write_bytes(data)
              print(f"{name}: downloaded {len(data)} bytes")
          PY

      - name: Baseline extraction with pypdf 6.21.4
        shell: bash
        run: |
          python -m pip install --quiet pypdf==6.21.4
          python - <<'PY'
          import json
          import re
          from pypdf import PdfReader
          result = {}
          for name in ("otello", "bemobi"):
              reader = PdfReader(name + ".pdf")
              text = re.sub(r"\s+", " ", " ".join(page.extract_text() or "" for page in reader.pages)).strip()
              if not text:
                  raise RuntimeError(f"{name} has no extracted text in baseline")
              result[name] = {"pages": len(reader.pages), "characters": len(text)}
              print(f"{name}: baseline pages={len(reader.pages)}, chars={len(text)}")
          with open("pypdf-baseline.json", "w", encoding="utf-8") as file:
              json.dump(result, file)
          PY

      - name: Compare pypdf 7.1.0 against production baseline
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pypdf==7.1.0
          python - <<'PY'
          import json
          import re
          from pypdf import PdfReader
          baseline = json.load(open("pypdf-baseline.json", encoding="utf-8"))
          required = {
              "otello": ("OTELLO", "BEMOBI", "2026"),
              "bemobi": ("BEMOBI", "2026"),
          }
          for name, keywords in required.items():
              reader = PdfReader(name + ".pdf")
              text = re.sub(r"\s+", " ", " ".join(page.extract_text() or "" for page in reader.pages)).strip()
              old = baseline[name]
              ratio = len(text) / old["characters"]
              if len(reader.pages) != old["pages"] or ratio < 0.85:
                  raise RuntimeError(f"{name}: page count or extracted text volume regressed: {ratio:.2%}")
              missing = [item for item in keywords if item not in text.upper()]
              if missing:
                  raise RuntimeError(f"{name}: required real-document terms missing: {missing}")
              print(f"{name}: pages={len(reader.pages)}, chars={len(text)}, relative-to-6.21.4={ratio:.2%}; PASS")
          PY
