name: Euronext delayed-data diagnostic

on:
  push:
    branches: [phase-11-otec-delayed-price]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Locate actual Euronext trade CSV header
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import urllib.request
          import zipfile
          from pathlib import Path

          url = 'https://marketdata.euronext.com/data-reporting-service/trades-file/download/EQUITIES/CURRENT_TRADING_DAY/OSL'
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; otello-tracker/1.0; private research)'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=120) as response:
              payload = response.read(100 * 1024 * 1024)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              raw = archive.read('Trades_Equities.csv')
          text = raw.decode('utf-8-sig')
          source_lines = text.splitlines()
          lines = []
          lines.append(f'LINE_COUNT={len(source_lines)}')
          for index, line in enumerate(source_lines[:25]):
              lines.append(f'LINE_{index}={line[:8000]!r}')
          header_candidates = []
          for index, line in enumerate(source_lines[:100]):
              upper = line.upper()
              if 'ISIN' in upper or ('PRICE' in upper and 'QUANTITY' in upper):
                  header_candidates.append((index, line))
          lines.append(f'HEADER_CANDIDATES={header_candidates!r}')
          Path('euronext-header-diagnostic.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add euronext-header-diagnostic.txt
          git commit -m 'Phase 11: header diagnostic result [skip ci]'
          git push
