name: Euronext delayed-data diagnostic

on:
  push:
    branches: [phase-11-otec-delayed-price]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect public delayed-trades page and scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          page_url = 'https://marketdata.euronext.com/data-reporting-service/trades-file'
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; otello-tracker/1.0; private research)'}
          req = urllib.request.Request(page_url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode('utf-8', errors='replace')
              print('PAGE', response.status, response.geturl(), len(html))

          print('FORM_LINES')
          for line in html.splitlines():
              lower = line.lower()
              if any(term in lower for term in ('extract csv', 'trade', 'download', 'api', 'script src')):
                  if len(line) < 5000:
                      print(line[:5000])

          srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          print('SCRIPT_COUNT', len(srcs))
          for src in srcs:
              url = urllib.parse.urljoin(page_url, src)
              print('SCRIPT', url)
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(10 * 1024 * 1024).decode('utf-8', errors='replace')
              except Exception as exc:
                  print('SCRIPT_ERROR', url, repr(exc))
                  continue
              matches = []
              for pattern in (
                  r'.{0,300}trades-file.{0,500}',
                  r'.{0,300}Extract CSV.{0,500}',
                  r'.{0,300}extractCsv.{0,500}',
                  r'.{0,300}download.{0,500}',
                  r'.{0,300}/api/.{0,500}',
                  r'.{0,300}axios.{0,500}',
                  r'.{0,300}fetch\(.{0,500}',
              ):
                  matches.extend(re.findall(pattern, body, flags=re.I | re.S))
              if matches:
                  print('MATCHES_BEGIN', url)
                  for match in matches[:40]:
                      print(re.sub(r'\s+', ' ', match)[:1500])
                  print('MATCHES_END', url)
          PY
