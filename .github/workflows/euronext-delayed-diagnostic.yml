name: Euronext delayed OTEC live smoke

on:
  push:
    branches: [phase-11-otec-delayed-price]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Live official Euronext delayed OTEC validation
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import tempfile
          from decimal import Decimal
          from pathlib import Path

          from app.db.connection import get_connection
          from app.db.migration_runner import init_database
          from app.marketdata.euronext_delayed import refresh_otec_delayed_price

          with tempfile.TemporaryDirectory() as tmp:
              db = str(Path(tmp) / 'otec-delayed.db')
              init_database(db)
              result = refresh_otec_delayed_price(db, timeout=120)
              print('RESULT', json.dumps(result, indent=2, ensure_ascii=False, default=str))
              if result['status'] != 'ok':
                  raise SystemExit(f'No live OTEC trade resolved: {result}')
              if result['selected'] not in {'CURRENT_TRADING_DAY', 'PREVIOUS_TRADING_DAY'}:
                  raise SystemExit(f'Unexpected selection: {result}')
              if Decimal(result['price_nok']) <= 0:
                  raise SystemExit(f'Invalid price: {result}')
              with get_connection(db) as connection:
                  row = connection.execute(
                      """
                      SELECT mp.price_type, mp.price, mp.currency, mp.quality,
                             mp.trading_date, mp.observed_at, mp.metadata_json,
                             s.code AS source_code, sd.document_type
                      FROM market_prices mp
                      JOIN instruments i ON i.id=mp.instrument_id
                      JOIN sources s ON s.id=mp.source_id
                      JOIN source_documents sd ON sd.id=mp.source_document_id
                      WHERE i.symbol='OTEC'
                      ORDER BY mp.observed_at DESC LIMIT 1
                      """
                  ).fetchone()
                  print('DB_ROW', dict(row))
                  if row['price_type'] != 'LAST':
                      raise SystemExit(f'Delayed trade mislabeled: {dict(row)}')
                  if row['source_code'] != 'EURONEXT' or row['quality'] != 'DIRECT':
                      raise SystemExit(f'Bad provenance/quality: {dict(row)}')
                  if row['currency'] != 'NOK':
                      raise SystemExit(f'Bad currency: {dict(row)}')
                  if 'LATEST_REPORTED_TRADE_NOT_OFFICIAL_CLOSE' not in row['metadata_json']:
                      raise SystemExit(f'Missing price semantics: {dict(row)}')
          PY
