name: Euronext delayed-data diagnostic

on:
  push:
    branches: [phase-11-otec-delayed-price]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect official delayed-trade parameter values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request

          page_url = 'https://marketdata.euronext.com/data-reporting-service/trades-file'
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; otello-tracker/1.0; private research)'}
          req = urllib.request.Request(page_url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode('utf-8', errors='replace')
          print('PAGE_LEN', len(page))

          for token in ('downloadFile', 'typeFile', 'timeSelection', 'tradingLocation', 'Current Trading Day', 'Oslo'):
              print('TOKEN', token)
              start = 0
              count = 0
              while True:
                  idx = page.lower().find(token.lower(), start)
                  if idx < 0:
                      break
                  count += 1
                  left = max(0, idx - 1800)
                  right = min(len(page), idx + 3000)
                  snippet = re.sub(r'\s+', ' ', page[left:right])
                  print('OCCURRENCE', count, snippet[:4800])
                  start = idx + len(token)
                  if count >= 10:
                      break
              print('COUNT', count)
          PY
