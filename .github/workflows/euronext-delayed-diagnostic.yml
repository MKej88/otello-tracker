name: Euronext delayed-data diagnostic

on:
  push:
    branches: [phase-11-otec-delayed-price]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect official Oslo equity trade files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import io
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = 'https://marketdata.euronext.com/data-reporting-service/trades-file/download/EQUITIES'
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; otello-tracker/1.0; private research)'}
          lines = []

          for selection in ('CURRENT_TRADING_DAY', 'PREVIOUS_TRADING_DAY', 'SINCE_PREVIOUS_TRADING_DAY'):
              url = f'{base}/{selection}/OSL'
              lines.append(f'## {selection} {url}')
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=120) as response:
                      payload = response.read(100 * 1024 * 1024)
                      lines.append(
                          f'STATUS={response.status} CONTENT_TYPE={response.headers.get("Content-Type")!r} '
                          f'CONTENT_DISPOSITION={response.headers.get("Content-Disposition")!r} BYTES={len(payload)}'
                      )
              except urllib.error.HTTPError as exc:
                  lines.append(f'HTTP_ERROR={exc.code}')
                  continue
              except Exception as exc:
                  lines.append(f'ERROR={exc!r}')
                  continue

              text = None
              encoding_used = None
              for encoding in ('utf-8-sig', 'cp1252', 'latin-1'):
                  try:
                      text = payload.decode(encoding)
                      encoding_used = encoding
                      break
                  except UnicodeDecodeError:
                      pass
              if text is None:
                  lines.append('DECODE_ERROR')
                  continue
              lines.append(f'ENCODING={encoding_used} LINE_COUNT={len(text.splitlines())}')
              first_line = text.splitlines()[0] if text.splitlines() else ''
              delimiter = ';' if first_line.count(';') >= first_line.count(',') else ','
              lines.append(f'DELIMITER={delimiter!r} HEADER_RAW={first_line[:5000]!r}')

              try:
                  reader = csv.DictReader(io.StringIO(text), delimiter=delimiter)
                  fieldnames = reader.fieldnames or []
                  lines.append(f'FIELDS={fieldnames!r}')
                  otec_rows = []
                  total_rows = 0
                  for row in reader:
                      total_rows += 1
                      joined = ' | '.join(str(value or '') for value in row.values()).upper()
                      if 'NO0010040611' in joined or re.search(r'(^|[^A-Z0-9])OTEC([^A-Z0-9]|$)', joined):
                          otec_rows.append(row)
                  lines.append(f'TOTAL_ROWS={total_rows} OTEC_ROWS={len(otec_rows)}')
                  for row in otec_rows[-25:]:
                      lines.append('OTEC_ROW=' + repr(dict(row))[:12000])
              except Exception as exc:
                  lines.append(f'CSV_ERROR={exc!r}')

          Path('euronext-equities-diagnostic.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add euronext-equities-diagnostic.txt
          git commit -m 'Phase 11: equity file diagnostic result [skip ci]'
          git push
