name: Euronext delayed-data diagnostic

on:
  push:
    branches: [phase-11-otec-delayed-price]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve and test official file-type values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = 'https://marketdata.euronext.com'
          page_url = base + '/data-reporting-service/trades-file'
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; otello-tracker/1.0; private research)'}
          with urllib.request.urlopen(urllib.request.Request(page_url, headers=headers), timeout=30) as response:
              page = response.read().decode('utf-8', errors='replace')

          file_types = []
          pattern = re.compile(
              r'<input[^>]+name=["\']fileType["\'][^>]+value=["\']([^"\']+)["\'][^>]*>\s*<label[^>]*>(.*?)</label>',
              flags=re.I | re.S,
          )
          for value, label in pattern.findall(page):
              label = re.sub(r'<[^>]+>', '', label)
              label = re.sub(r'\s+', ' ', label).strip()
              file_types.append((value, label))

          lines = [f'FILE_TYPES={file_types!r}']
          for value, label in file_types:
              url = (
                  base + '/data-reporting-service/trades-file/download/'
                  + urllib.parse.quote(value, safe='')
                  + '/CURRENT_TRADING_DAY/OSL'
              )
              request = urllib.request.Request(url, headers=headers, method='HEAD')
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      lines.append(
                          f'HEAD value={value!r} label={label!r} status={response.status} '
                          f'content_type={response.headers.get("Content-Type")!r} '
                          f'content_disposition={response.headers.get("Content-Disposition")!r} url={url}'
                      )
              except urllib.error.HTTPError as exc:
                  lines.append(f'HEAD value={value!r} label={label!r} status={exc.code} url={url}')
              except Exception as exc:
                  lines.append(f'HEAD value={value!r} label={label!r} error={exc!r} url={url}')

          Path('euronext-download-diagnostic.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add euronext-download-diagnostic.txt
          git commit -m 'Phase 11: download diagnostic result [skip ci]'
          git push
