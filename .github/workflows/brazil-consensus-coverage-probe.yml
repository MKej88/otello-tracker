name: Brazil consensus coverage Cloudflare edge probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/brazil-consensus-coverage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brazil-consensus-coverage-cloudflare-edge-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Compare Brazil consensus coverage from Cloudflare remote Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build isolated comparison Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/brazil-consensus-probe
          cd /tmp/brazil-consensus-probe

          cat > worker.mjs <<'EOF'
          const UA = "Mozilla/5.0 (compatible; OtelloTrackerProbe/1.0; +https://otellotracker.com)";

          function compact(value) {
            return String(value ?? "").replace(/\s+/g, " ").trim();
          }

          function decodeEntities(value) {
            return String(value ?? "")
              .replace(/&nbsp;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&quot;/gi, '"')
              .replace(/&#x27;|&#39;/gi, "'")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">");
          }

          function stripHtml(value) {
            return compact(decodeEntities(String(value ?? "").replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ")));
          }

          function attr(attrs, name) {
            const match = String(attrs || "").match(new RegExp(`${name}\\s*=\\s*["']([^"']*)["']`, "i"));
            return match ? decodeEntities(match[1]) : null;
          }

          function numericish(value) {
            const text = compact(value);
            if (!text || text === "-" || /^n\/?a$/i.test(text)) return null;
            return /[-+]?\d/.test(text) ? text : null;
          }

          async function get(url, accept = "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8") {
            const response = await fetch(url, {
              redirect: "follow",
              headers: { "Accept": accept, "Accept-Language": "en-US,en;q=0.8", "User-Agent": UA },
            });
            const body = await response.text();
            return {
              url: response.url,
              status: response.status,
              ok: response.ok,
              contentType: response.headers.get("content-type"),
              body,
              bytes: new TextEncoder().encode(body).length,
            };
          }

          function parseTradingEconomics(html) {
            const events = [];
            for (const match of html.matchAll(/<tr\b([^>]*)>([\s\S]*?)<\/tr>/gi)) {
              const attrs = match[1] || "";
              if (!/data-country\s*=\s*["']?brazil["']?/i.test(attrs)) continue;
              const cells = [...match[2].matchAll(/<td\b[^>]*>([\s\S]*?)<\/td>/gi)].map((cell) => stripHtml(cell[1]));
              if (!cells.length) continue;
              events.push({
                event: attr(attrs, "data-event") || attr(attrs, "data-category") || null,
                category: attr(attrs, "data-category"),
                symbol: attr(attrs, "data-symbol"),
                cells,
              });
            }
            return events.slice(0, 20);
          }

          function parseInvesting(html) {
            const normalized = html
              .replace(/\\u0026/g, "&")
              .replace(/\\u003c/g, "<")
              .replace(/\\u003e/g, ">")
              .replace(/\\"/g, '"');
            const events = [];
            let from = 0;
            while (events.length < 20) {
              const index = normalized.indexOf('"currency":"BRL"', from);
              if (index < 0) break;
              const start = Math.max(normalized.lastIndexOf("{", index), index - 2500);
              const endBrace = normalized.indexOf("}", index);
              const end = endBrace >= 0 ? Math.min(endBrace + 1, index + 4500) : Math.min(normalized.length, index + 4500);
              const chunk = normalized.slice(start, end);
              const pick = (key) => {
                const m = chunk.match(new RegExp(`"${key}"\\s*:\\s*(?:"([^"]*)"|([^,}]+))`, "i"));
                return m ? compact(m[1] ?? m[2]) : null;
              };
              const event = pick("eventLong") || pick("event") || pick("name");
              const item = {
                event,
                date: pick("date"),
                time: pick("time"),
                period: pick("period"),
                forecast: pick("forecast") || pick("consensus"),
                previous: pick("previous"),
                actual: pick("actual"),
                importance: pick("importance"),
                path: pick("path"),
                context: compact(chunk).slice(0, 1200),
              };
              if (event || item.date || item.period) events.push(item);
              from = index + 15;
            }
            return events;
          }

          function parseFxstreet(html) {
            const normalized = html
              .replace(/\\u0026/g, "&")
              .replace(/\\u003c/g, "<")
              .replace(/\\u003e/g, ">")
              .replace(/\\"/g, '"');
            const events = [];
            const seen = new Set();
            const eventLink = /\/economic-calendar\/event\/[0-9a-f-]{36}/ig;
            for (const match of normalized.matchAll(eventLink)) {
              const path = match[0];
              if (seen.has(path)) continue;
              const index = match.index ?? 0;
              const chunk = normalized.slice(Math.max(0, index - 2200), Math.min(normalized.length, index + 3000));
              if (!/brazil|brl/i.test(chunk)) continue;
              seen.add(path);
              const pick = (keys) => {
                for (const key of keys) {
                  const m = chunk.match(new RegExp(`"${key}"\\s*:\\s*(?:"([^"]*)"|([^,}]+))`, "i"));
                  if (m) return compact(m[1] ?? m[2]);
                }
                return null;
              };
              const titleMatch = chunk.match(/Brazil[^"<]{0,120}(?:GDP|Gross Domestic Product|Inflation|Production|PMI|Trade|Retail|Unemployment|Confidence)[^"<]{0,120}/i);
              events.push({
                event: pick(["eventName", "name", "title"]) || (titleMatch ? compact(titleMatch[0]) : null),
                path,
                date: pick(["date", "releaseDate", "startDate"]),
                consensus: pick(["consensus", "forecast"]),
                previous: pick(["previous", "previousValue"]),
                actual: pick(["actual", "actualValue"]),
                context: compact(chunk).slice(0, 1400),
              });
              if (events.length >= 20) break;
            }
            if (!events.length) {
              let cursor = 0;
              while (events.length < 20) {
                const index = normalized.toLowerCase().indexOf("brazil", cursor);
                if (index < 0) break;
                const chunk = normalized.slice(Math.max(0, index - 1200), Math.min(normalized.length, index + 2200));
                if (/consensus|previous|gross domestic product|industrial production|inflation|pmi/i.test(chunk)) {
                  events.push({ event: null, path: null, date: null, consensus: null, previous: null, actual: null, context: compact(chunk).slice(0, 1400) });
                }
                cursor = index + 6;
              }
            }
            return events;
          }

          function coverage(events, consensusKeys = ["consensus", "forecast"]) {
            let numericConsensus = 0;
            let numericPrevious = 0;
            let numericActual = 0;
            for (const event of events) {
              const consensus = consensusKeys.map((key) => event[key]).find((value) => numericish(value));
              if (consensus) numericConsensus += 1;
              if (numericish(event.previous)) numericPrevious += 1;
              if (numericish(event.actual)) numericActual += 1;
            }
            return { events: events.length, numeric_consensus_or_forecast: numericConsensus, numeric_previous: numericPrevious, numeric_actual: numericActual };
          }

          export default {
            async fetch(request) {
              const teHtml = await get("https://tradingeconomics.com/brazil/calendar");
              const teApi = await get("https://api.tradingeconomics.com/calendar/country/brazil/2026-09-01/2026-09-30?c=guest%3Aguest&f=json", "application/json,text/plain,*/*;q=0.8");
              const investing = await get("https://www.investing.com/economic-calendar/");
              const fxstreet = await get("https://www.fxstreet.com/economic-calendar");

              const teEvents = parseTradingEconomics(teHtml.body);
              const investingEvents = parseInvesting(investing.body);
              const fxstreetEvents = parseFxstreet(fxstreet.body);

              let teApiParsed = null;
              try { teApiParsed = JSON.parse(teApi.body); } catch (_) { teApiParsed = null; }

              return Response.json({
                runtime: "cloudflare-worker-remote-preview",
                colo: request.cf?.colo || null,
                fetched_at: new Date().toISOString(),
                sources: {
                  trading_economics_html: {
                    status: teHtml.status,
                    bytes: teHtml.bytes,
                    coverage: coverage(teEvents, []),
                    events: teEvents,
                  },
                  trading_economics_guest_api: {
                    status: teApi.status,
                    bytes: teApi.bytes,
                    parsed_array: Array.isArray(teApiParsed),
                    count: Array.isArray(teApiParsed) ? teApiParsed.length : null,
                    sample: Array.isArray(teApiParsed) ? teApiParsed.slice(0, 20) : compact(teApi.body).slice(0, 1600),
                  },
                  investing: {
                    status: investing.status,
                    bytes: investing.bytes,
                    coverage: coverage(investingEvents),
                    events: investingEvents,
                  },
                  fxstreet: {
                    status: fxstreet.status,
                    bytes: fxstreet.bytes,
                    coverage: coverage(fxstreetEvents),
                    events: fxstreetEvents,
                  },
                },
              }, { headers: { "Cache-Control": "no-store" } });
            },
          };
          EOF

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "otello-brazil-consensus-coverage-probe",
            "main": "worker.mjs",
            "compatibility_date": "2026-08-01",
            "workers_dev": true
          }
          EOF

          npm init -y >/dev/null 2>&1
          npm install --no-save wrangler@4.123.0

      - name: Run comparison in Cloudflare remote Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/brazil-consensus-probe
          ./node_modules/.bin/wrangler dev --remote --ip 127.0.0.1 --port 8787 --config wrangler.jsonc >wrangler.log 2>&1 &
          wrangler_pid=$!
          cleanup() {
            kill "$wrangler_pid" 2>/dev/null || true
            wait "$wrangler_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 45 http://127.0.0.1:8787/ -o result.json; then
              ready=1
              break
            fi
            if ! kill -0 "$wrangler_pid" 2>/dev/null; then
              echo "::error::wrangler dev --remote exited before the probe became ready"
              cat wrangler.log || true
              exit 1
            fi
            sleep 2
          done
          test "$ready" -eq 1

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("result.json").read_text(encoding="utf-8"))
          print(json.dumps(payload, indent=2, ensure_ascii=False))

          lines = [
              "# Brazil consensus coverage fra Cloudflare Worker",
              "",
              f"- Runtime: `{payload.get('runtime')}`",
              f"- Colo: `{payload.get('colo') or '-'}`",
              f"- Hentet: `{payload.get('fetched_at')}`",
              "",
          ]
          for name, source in (payload.get("sources") or {}).items():
              lines.append(f"## {name}")
              lines.append("")
              lines.append(f"- HTTP: `{source.get('status')}`")
              lines.append(f"- Bytes: `{source.get('bytes')}`")
              if source.get("coverage") is not None:
                  cov = source["coverage"]
                  lines.append(f"- Hendelser funnet: **{cov.get('events')}**")
                  lines.append(f"- Numerisk consensus/forecast: **{cov.get('numeric_consensus_or_forecast')}**")
                  lines.append(f"- Numerisk previous: **{cov.get('numeric_previous')}**")
              if "parsed_array" in source:
                  lines.append(f"- Guest API JSON-array: **{source.get('parsed_array')}**")
                  lines.append(f"- Guest API antall: **{source.get('count')}**")
              lines.append("")
              sample = source.get("events") or source.get("sample")
              if sample:
                  lines.append("```json")
                  lines.append(json.dumps(sample, ensure_ascii=False, indent=2)[:16000])
                  lines.append("```")
                  lines.append("")

          summary = "\n".join(lines) + "\n"
          Path("probe-summary.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY
          cat probe-summary.md >> "$GITHUB_STEP_SUMMARY"
