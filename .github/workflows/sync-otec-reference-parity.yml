name: Sync OTEC reference parity

on:
  push:
    branches:
      - fix/otec-production-live-price

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-production-live-price
      - name: Align SQLite reference with production semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Fant ikke forventet blokk i {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          dashboard = "backend/app/dashboard.py"
          replace_once(
              dashboard,
              "from app.nav_waterfall_attribution import symmetric_two_factor_attribution\n",
              "from app.nav_waterfall_attribution import symmetric_two_factor_attribution\nfrom app.marketdata.quote_details import _latest_price\n",
          )
          replace_once(
              dashboard,
              '''def _nav_discount_insights(\n    connection, *, calculation_version: str, nav_scope: str, latest\n) -> dict[str, Any]:''',
              '''def _nav_discount_insights(\n    connection,\n    *,\n    calculation_version: str,\n    nav_scope: str,\n    latest,\n    current_otec_price: Any = None,\n) -> dict[str, Any]:''',
          )
          replace_once(
              dashboard,
              '        share_price=latest["otec_price_nok"],',
              '''        share_price=(\n            current_otec_price\n            if current_otec_price is not None\n            else latest["otec_price_nok"]\n        ),''',
          )
          replace_once(
              dashboard,
              '''        as_of_date = str(latest["as_of_at"])[:10]\n        holding = connection.execute(''',
              '''        as_of_date = str(latest["as_of_at"])[:10]\n        latest_otec = _latest_price(connection, "OTEC")\n        live_otec_price = (\n            _float(latest_otec.get("price"))\n            if latest_otec is not None and latest_otec.get("price") is not None\n            else _float(latest["otec_price_nok"])\n        )\n        nav_discount_insight = _nav_discount_insights(\n            connection,\n            calculation_version=calculation_version,\n            nav_scope=model_scope,\n            latest=latest,\n            current_otec_price=live_otec_price,\n        )\n        holding = connection.execute(''',
          )
          replace_once(
              dashboard,
              '''        otec_change = _pct_change(\n            latest["otec_price_nok"], previous["otec_price_nok"] if previous else None\n        )\n        discount_change = (\n            float(\n                Decimal(str(latest["discount_pct"]))\n                - Decimal(str(previous["discount_pct"]))\n            )\n            if previous is not None\n            and latest["discount_pct"] is not None\n            and previous["discount_pct"] is not None\n            else None\n        )''',
              '''        otec_change = _pct_change(\n            live_otec_price, previous["otec_price_nok"] if previous else None\n        )\n        current_discount = nav_discount_insight.get("discount_pct")\n        discount_change = (\n            float(\n                Decimal(str(current_discount))\n                - Decimal(str(previous["discount_pct"]))\n            )\n            if previous is not None\n            and current_discount is not None\n            and previous["discount_pct"] is not None\n            else None\n        )''',
          )
          replace_once(
              dashboard,
              '''            "otec_price": _float(latest["otec_price_nok"]),\n            "nav_discount_pct": _float(latest["discount_pct"]),\n            "nav_discount_insights": _nav_discount_insights(\n                connection,\n                calculation_version=calculation_version,\n                nav_scope=model_scope,\n                latest=latest,\n            ),''',
              '''            "otec_price": live_otec_price,\n            "otec_price_date": (\n                latest_otec.get("trading_date")\n                if latest_otec is not None\n                else otec.get("price_date")\n            ),\n            "otec_price_observed_at": (\n                latest_otec.get("observed_at")\n                if latest_otec is not None\n                else otec.get("price_observed_at")\n            ),\n            "otec_price_type": (\n                latest_otec.get("price_type")\n                if latest_otec is not None\n                else otec.get("price_type")\n            ),\n            "nav_discount_pct": current_discount,\n            "nav_discount_insights": nav_discount_insight,''',
          )
          replace_once(
              dashboard,
              '''            "otec_price_quality": otec.get("price_quality"),\n            "otec_price_source": otec.get("price_source"),''',
              '''            "otec_price_quality": (\n                latest_otec.get("quality")\n                if latest_otec is not None\n                else otec.get("price_quality")\n            ),\n            "otec_price_source": (\n                latest_otec.get("source_code")\n                if latest_otec is not None\n                else otec.get("price_source")\n            ),''',
          )

          freshness = "backend/app/dashboard_freshness.py"
          replace_once(
              freshness,
              '''    component_dates = {\n        "otec": _as_date(otec.get("price_date")),\n        "bmob3": _as_date(bmob3.get("price_date")),\n        "brl_nok": _as_date(bmob3.get("brl_nok_date")),\n    }''',
              '''    component_dates = {\n        "otec": _as_date(summary.get("otec_price_date") or otec.get("price_date")),\n        "bmob3": _as_date(bmob3.get("price_date")),\n        "brl_nok": _as_date(bmob3.get("brl_nok_date")),\n    }''',
          )
          replace_once(
              freshness,
              '''        "otec": {\n            "date": otec.get("price_date"),\n            "observed_at": otec.get("price_observed_at"),\n            "price_type": otec.get("price_type"),\n        },''',
              '''        "otec": {\n            "date": summary.get("otec_price_date") or otec.get("price_date"),\n            "observed_at": (\n                summary.get("otec_price_observed_at")\n                or otec.get("price_observed_at")\n            ),\n            "price_type": summary.get("otec_price_type") or otec.get("price_type"),\n        },''',
          )

          economic = "backend/app/economic_nav_investor.py"
          replace_once(
              economic,
              "from app.nav_waterfall_attribution import symmetric_two_factor_attribution\n",
              "from app.nav_waterfall_attribution import symmetric_two_factor_attribution\nfrom app.marketdata.quote_details import _latest_price\n",
          )
          replace_once(
              economic,
              '''        month_row = connection.execute(\n            """\n            SELECT substr(as_of_at, 1, 10) AS as_of_date, shares_outstanding\n            FROM nav_snapshots\n            WHERE calculation_version=? AND nav_scope='FULL'\n              AND substr(as_of_at, 1, 10) <= ?\n            ORDER BY as_of_at DESC, id DESC LIMIT 1\n            """,\n            (FULL_CALCULATION_VERSION, month_target),\n        ).fetchone()''',
              '''        month_row = connection.execute(\n            """\n            SELECT substr(as_of_at, 1, 10) AS as_of_date, shares_outstanding\n            FROM nav_snapshots\n            WHERE calculation_version=? AND nav_scope='FULL'\n              AND substr(as_of_at, 1, 10) <= ?\n            ORDER BY as_of_at DESC, id DESC LIMIT 1\n            """,\n            (FULL_CALCULATION_VERSION, month_target),\n        ).fetchone()\n        latest_otec = _latest_price(connection, "OTEC")''',
          )
          replace_once(
              economic,
              '''    otec_price_nok = (\n        Decimal(str(row["otec_price_nok"]))\n        if row["otec_price_nok"] is not None\n        else None\n    )\n\n    base_pre_option_total = (''',
              '''    otec_price_nok = (\n        Decimal(str(row["otec_price_nok"]))\n        if row["otec_price_nok"] is not None\n        else None\n    )\n    if latest_otec is not None and latest_otec.get("price") is not None:\n        try:\n            live_otec_price = Decimal(str(latest_otec["price"]))\n        except (InvalidOperation, TypeError, ValueError):\n            live_otec_price = None\n        if (\n            live_otec_price is not None\n            and live_otec_price.is_finite()\n            and live_otec_price > 0\n        ):\n            otec_price_nok = live_otec_price\n\n    base_pre_option_total = (''',
          )

          for test_path in (\n              "backend/tests/test_estimated_cash_card.py",\n              "backend/tests/test_nav_live_composition_contract.py",\n          ):
              path = Path(test_path)
              text = path.read_text(encoding="utf-8")
              if 'dashboard_hot_snapshot_v6' not in text:
                  raise SystemExit(f"Fant ikke v6 i {test_path}")
              path.write_text(\n                  text.replace('dashboard_hot_snapshot_v6', 'dashboard_hot_snapshot_v7'),\n                  encoding="utf-8",\n              )

          Path(".github/workflows/sync-otec-reference-parity.yml").unlink()
          PY
      - name: Compile changed Python
        run: python -m compileall -q backend/app cloudflare/src
      - name: Commit parity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synk OTEC livepris mellom produksjon og referanse"
          git push origin HEAD:fix/otec-production-live-price
