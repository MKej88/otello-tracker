name: Buyback live smoke

on:
  push:
    branches: ["phase-6-buyback-tracker"]
    paths:
      - ".github/workflows/buyback-live-smoke.yml"
      - "backend/app/buybacks/**"
      - "backend/app/db/migrations/0009_mfn_mirror_source.sql"
      - "backend/app/db/migrations/0010_buyback_cumulative_values.sql"
      - "backend/app/jobs/collect_buybacks.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Collect public Otello buybacks and verify current cumulative coverage
        env:
          PYTHONPATH: .
        run: |
          python -m app.jobs.collect_buybacks --database /tmp/buyback-smoke.db > /tmp/result.json
          cat /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          c=d['collection']
          s=d['buyback_status']
          assert c['discovered'] >= 1, d
          assert c['ingested'] >= 1, d
          assert not c['errors'], d
          assert c['current_coverage_complete'], c['current_coverage_gaps']
          assert s['current_coverage_complete'], s['current_coverage_gaps']
          # Historical coverage is intentionally allowed to show a prefix gap before
          # the latest reported cash anchor; that gap is a future backfill task.
          assert s['latest_reported_cash_anchor'] == '2025-12-31', s
          assert s['latest']['trade_date'] == '2026-08-14', s
          assert s['latest']['treasury_shares_after'] == 5787397, s
          assert s['latest']['cumulative_program_shares'] == 600393, s
          PY
