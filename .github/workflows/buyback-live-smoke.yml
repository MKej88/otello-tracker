name: Buyback live smoke

on:
  push:
    branches: ["phase-6-buyback-tracker"]
    paths:
      - ".github/workflows/buyback-live-smoke.yml"
      - "backend/app/buybacks/**"
      - "backend/app/jobs/collect_buybacks.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Collect public Euronext buybacks
        env:
          PYTHONPATH: .
        run: |
          python -m app.jobs.collect_buybacks --database /tmp/buyback-smoke.db > /tmp/result.json
          cat /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          assert d['collection']['discovered'] >= 1, d
          assert d['collection']['ingested'] >= 1, d
          assert not d['collection']['errors'], d
          PY
