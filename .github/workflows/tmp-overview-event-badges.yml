name: Apply overview event badges

on:
  push:
    branches:
      - ui/overview-event-scope-badges
    paths:
      - .github/workflows/tmp-overview-event-badges.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/overview-event-scope-badges
          persist-credentials: true

      - name: Apply event badge changes
        run: python scripts/tmp_apply_event_badges.py

      - name: Remove temporary files and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-overview-event-badges.yml
          rm scripts/tmp_apply_event_badges.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/OverviewPage.tsx frontend/src/overview-page.css .github/workflows/tmp-overview-event-badges.yml scripts/tmp_apply_event_badges.py
          git commit -m "Merk viktige datoer med type og selskap eller Brasil"
          git push origin HEAD:ui/overview-event-scope-badges
