name: Apply overview event badges

on:
  push:
    branches:
      - ui/overview-event-scope-badges
    paths:
      - .github/workflows/tmp-overview-event-badges.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui/overview-event-scope-badges
          persist-credentials: true

      - name: Add type and scope badges to important dates
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one match in {path}, got {count}: {old[:140]!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          page = "frontend/src/OverviewPage.tsx"

          replace_once(
              page,
              '''type NewsEvent = {
            id: string | number;
            date: string;
            company: "Otello" | "Bemobi";
            title: string;
            importance: "HIGH" | "MEDIUM" | "LOW";
            confirmed: boolean;
            source?: string | null;
          };''',
              '''type NewsEvent = {
            id: string | number;
            date: string;
            company: "Otello" | "Bemobi";
            title: string;
            category?: string | null;
            importance: "HIGH" | "MEDIUM" | "LOW";
            confirmed: boolean;
            source?: string | null;
          };''',
          )

          replace_once(
              page,
              '''type OverviewEvent = {
            id: string;
            date: string;
            title: string;
            badge: string;
            badgeClass: "bemobi" | "otello" | "macro";
            confirmed: boolean;
            source?: string | null;
            importance: number;
            macroExpectation?: BrazilCalendarExpectation | null;
          };''',
              '''type OverviewEvent = {
            id: string;
            date: string;
            title: string;
            typeBadge: string;
            scopeBadge: string;
            scopeClass: "bemobi" | "otello" | "brazil";
            eventKind: "company" | "macro";
            confirmed: boolean;
            source?: string | null;
            importance: number;
            macroExpectation?: BrazilCalendarExpectation | null;
          };''',
          )

          replace_once(
              page,
              '''function eventMetaLabel(event: OverviewEvent) {
            if (event.badgeClass === "macro") {''',
              '''function eventMetaLabel(event: OverviewEvent) {
            if (event.eventKind === "macro") {''',
          )

          replace_once(
              page,
              '''function macroTitle(event: BrazilCalendarEvent) {
            const labels: Record<string, string> = {
              copom: "Rentebeslutning fra sentralbanken",
              services: "Aktivitet i tjenestenæringene",
              retail: "Omsetning i detaljhandelen",
              activity: "Samlet økonomisk aktivitet",
              labor: "Arbeidsledighet",
            };
            if (event.kind === "inflation") return event.name.includes("15") ? "Foreløpig prisvekst" : "Prisvekst";
            if (event.kind === "gdp") return event.name.replace("BNP", "Økonomisk vekst (BNP)");
            return labels[event.kind] ?? event.name;
          }

          function upcomingEvents(''',
              '''function macroTitle(event: BrazilCalendarEvent) {
            const labels: Record<string, string> = {
              copom: "Rentebeslutning fra sentralbanken",
              services: "Aktivitet i tjenestenæringene",
              retail: "Omsetning i detaljhandelen",
              activity: "Samlet økonomisk aktivitet",
              labor: "Arbeidsledighet",
            };
            if (event.kind === "inflation") return event.name.includes("15") ? "Foreløpig prisvekst" : "Prisvekst";
            if (event.kind === "gdp") return event.name.replace("BNP", "Økonomisk vekst (BNP)");
            return labels[event.kind] ?? event.name;
          }

          function companyEventType(category?: string | null) {
            const labels: Record<string, string> = {
              RESULTS: "Rapport",
              DIVIDEND: "Utbytte",
              DISTRIBUTION: "Utbytte",
              JCP: "JCP",
              BUYBACK: "Tilbakekjøp",
              M_AND_A: "Transaksjon",
              CAPITAL: "Kapital",
              GUIDANCE: "Utsikter",
            };
            return labels[String(category ?? "").toUpperCase()] ?? "Selskap";
          }

          function upcomingEvents(''',
          )

          replace_once(
              page,
              '''      title: event.title,
                  badge: event.company,
                  badgeClass: event.company === "Bemobi" ? "bemobi" : "otello",
                  confirmed: event.confirmed,''',
              '''      title: event.title,
                  typeBadge: companyEventType(event.category),
                  scopeBadge: event.company,
                  scopeClass: event.company === "Bemobi" ? "bemobi" : "otello",
                  eventKind: "company",
                  confirmed: event.confirmed,''',
          )

          replace_once(
              page,
              '''      title: macroTitle(event),
                  badge: "Makro",
                  badgeClass: "macro",
                  confirmed: true,''',
              '''      title: macroTitle(event),
                  typeBadge: "Makro",
                  scopeBadge: "Brasil",
                  scopeClass: "brazil",
                  eventKind: "macro",
                  confirmed: true,''',
          )

          replace_once(
              page,
              '''                  <div>
                        <strong>{nextEvent.title}</strong>
                        <span className={`overviewEventBadge ${nextEvent.badgeClass}`}>{nextEvent.badge}</span>
                      </div>''',
              '''                  <div>
                        <strong>{nextEvent.title}</strong>
                        <span className="overviewEventBadges">
                          <span className="overviewEventBadge type">{nextEvent.typeBadge}</span>
                          <span className={`overviewEventBadge ${nextEvent.scopeClass}`}>{nextEvent.scopeBadge}</span>
                        </span>
                      </div>''',
          )

          replace_once(
              page,
              '''                    <div key={event.id}>
                          <time>{eventDateLabel(event.date)}</time>
                          <strong>{event.title}</strong>
                          <span className={`overviewEventBadge ${event.badgeClass}`}>{event.badge}</span>
                        </div>''',
              '''                    <div key={event.id}>
                          <time>{eventDateLabel(event.date)}</time>
                          <strong>{event.title}</strong>
                          <span className="overviewEventBadges">
                            <span className="overviewEventBadge type">{event.typeBadge}</span>
                            <span className={`overviewEventBadge ${event.scopeClass}`}>{event.scopeBadge}</span>
                          </span>
                        </div>''',
          )

          css = "frontend/src/overview-page.css"
          target = Path(css)
          text = target.read_text(encoding="utf-8")
          old = '''.overviewEventBadge{font-size:.63rem;font-weight:800;padding:3px 6px;border-radius:999px;background:var(--ot-accent-soft);color:var(--ot-accent-strong)}.overviewEventBadge.otello{background:var(--ot-control-soft);color:var(--ot-text-secondary)}'''
          new = '''.overviewEventBadges{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}.overviewEventBadge{font-size:.63rem;font-weight:800;padding:3px 6px;border-radius:999px;background:var(--ot-accent-soft);color:var(--ot-accent-strong)}.overviewEventBadge.type{background:var(--ot-control-soft);color:var(--ot-text-secondary)}.overviewEventBadge.bemobi{background:var(--ot-accent-soft);color:var(--ot-accent-strong)}.overviewEventBadge.otello{background:var(--ot-control-soft);color:var(--ot-text-secondary)}.overviewEventBadge.brazil{background:var(--ot-accent-soft);color:var(--ot-accent-strong)}'''
          if text.count(old) != 1:
              raise SystemExit("Could not find event badge CSS marker")
          text = text.replace(old, new, 1)
          old_mobile = '''.overviewUpcomingRows .overviewEventBadge{grid-column:2;justify-self:start}'''
          new_mobile = '''.overviewUpcomingRows .overviewEventBadges{grid-column:2;justify-self:start}'''
          if text.count(old_mobile) != 1:
              raise SystemExit("Could not find mobile event badge CSS marker")
          target.write_text(text.replace(old_mobile, new_mobile, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-overview-event-badges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/OverviewPage.tsx frontend/src/overview-page.css .github/workflows/tmp-overview-event-badges.yml
          git commit -m "Merk viktige datoer med type og selskap eller Brasil"
          git push origin HEAD:ui/overview-event-scope-badges
