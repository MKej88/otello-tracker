name: Python static analysis

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "cloudflare/src/**"
      - ".github/workflows/python-static-analysis.yml"
      - "tools/ruff.in"
      - "tools/ruff.lock.txt"
  push:
    branches: ["main"]
    paths:
      - "backend/app/**"
      - "cloudflare/src/**"
      - ".github/workflows/python-static-analysis.yml"
      - "tools/ruff.in"
      - "tools/ruff.lock.txt"

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff correctness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install --require-hashes -r tools/ruff.lock.txt
      - name: Run expanded correctness checks
        # newsweb_daily_buybacks validates target_date by assigning date.fromisoformat;
        # keep this one deliberate F841 exception local to that proven parser.
        run: >-
          ruff check --select E4,E7,E9,F
          --per-file-ignores "cloudflare/src/newsweb_daily_buybacks.py:F841"
          backend/app cloudflare/src
