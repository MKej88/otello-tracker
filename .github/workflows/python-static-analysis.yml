name: Python static analysis

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "cloudflare/src/**"
      - ".github/workflows/python-static-analysis.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/app/**"
      - "cloudflare/src/**"
      - ".github/workflows/python-static-analysis.yml"

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff correctness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.3
      - name: Run expanded correctness checks
        run: ruff check --select E4,E7,E9,F backend/app cloudflare/src
