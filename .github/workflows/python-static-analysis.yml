          )

          economic = "backend/app/economic_nav_investor.py"
          replace_once(
              economic,
              "from app.nav_waterfall_attribution import symmetric_two_factor_attribution\n",
              "from app.nav_waterfall_attribution import symmetric_two_factor_attribution\nfrom app.marketdata.quote_details import _latest_price\n",
          )
          replace_once(
              economic,
              '''        month_row = connection.execute(
            """
            SELECT substr(as_of_at, 1, 10) AS as_of_date, shares_outstanding
            FROM nav_snapshots
            WHERE calculation_version=? AND nav_scope='FULL'
              AND substr(as_of_at, 1, 10) <= ?
            ORDER BY as_of_at DESC, id DESC LIMIT 1
            """,
            (FULL_CALCULATION_VERSION, month_target),
        ).fetchone()''',
              '''        month_row = connection.execute(
            """
            SELECT substr(as_of_at, 1, 10) AS as_of_date, shares_outstanding
            FROM nav_snapshots
            WHERE calculation_version=? AND nav_scope='FULL'
              AND substr(as_of_at, 1, 10) <= ?
            ORDER BY as_of_at DESC, id DESC LIMIT 1
            """,
            (FULL_CALCULATION_VERSION, month_target),
        ).fetchone()
        latest_otec = _latest_price(connection, "OTEC")''',
          )
          replace_once(
              economic,
              '''    otec_price_nok = (
        Decimal(str(row["otec_price_nok"]))
        if row["otec_price_nok"] is not None
        else None
    )

    base_pre_option_total = (''',
              '''    otec_price_nok = (
        Decimal(str(row["otec_price_nok"]))
        if row["otec_price_nok"] is not None
        else None
    )
    if latest_otec is not None and latest_otec.get("price") is not None:
        try:
            live_otec_price = Decimal(str(latest_otec["price"]))
        except (InvalidOperation, TypeError, ValueError):
            live_otec_price = None
        if (
            live_otec_price is not None
            and live_otec_price.is_finite()
            and live_otec_price > 0
        ):
            otec_price_nok = live_otec_price

    base_pre_option_total = (''',
          )
          PY
      - name: Restore normal workflow and remove temporary helper
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/python-static-analysis.yml
          rm -f .github/workflows/sync-otec-reference-parity.yml
      - name: Commit parity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synk OTEC livepris mellom produksjon og referanse"
          git push origin HEAD:fix/otec-production-live-price
