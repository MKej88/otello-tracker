name: Fix OTEC production import

on:
  push:
    branches:
      - fix/otec-production-live-price

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-production-live-price
      - name: Fix import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("cloudflare/src/buyback_service.py")
          text = path.read_text(encoding="utf-8")
          old = "from decimal import Decimal\n"
          new = "from decimal import Decimal, InvalidOperation\n"
          if old not in text:
              raise SystemExit("Fant ikke Decimal-import")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/fix-otec-import.yml").unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rett OTEC livepris-import"
          git push origin HEAD:fix/otec-production-live-price
