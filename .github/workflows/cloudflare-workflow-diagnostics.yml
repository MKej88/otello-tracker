name: Cloudflare workflow diagnostics

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: Cloudflare Workflow to inspect
        required: true
        default: otello-full-refresh
        type: choice
        options:
          - otello-full-refresh
          - otello-r2-snapshot-drill
      instance_id:
        description: Instance ID, or latest
        required: true
        default: latest
        type: string
  schedule:
    # Full refresh starts at 03:35 UTC. Give it 55 minutes before the daily diagnosis.
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read Cloudflare Workflow and D1 status
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_API_BASE: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKFLOW_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_name || 'otello-full-refresh' }}
      REQUESTED_INSTANCE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.instance_id || 'latest' }}
      D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || 'otello-nav' }}
    steps:
      - name: Validate read-only configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::GitHub secret CLOUDFLARE_READ_TOKEN mangler.'
            exit 1
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_NAME"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$WORKFLOW_NAME" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
          [[ "$D1_DATABASE_NAME" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
          if [ "$REQUESTED_INSTANCE_ID" != "latest" ]; then
            [[ "$REQUESTED_INSTANCE_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]]
          fi

      - name: Read recent instances and selected details
        id: fetch
        shell: bash
        run: |
          set -Eeuo pipefail
          base_url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            "${base_url}?per_page=10&direction=desc" \
            --output recent.json

          resolved_instance_id="$(python - <<'PY'
          import json
          import os

          with open("recent.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare Workflow list request failed")

          requested = os.environ["REQUESTED_INSTANCE_ID"]
          if requested != "latest":
              print(requested)
          else:
              instances = payload.get("result") or []
              if not instances:
                  raise SystemExit("Cloudflare returned no Workflow instances")
              print(instances[0]["id"])
          PY
          )"

          echo "resolved_instance_id=$resolved_instance_id" >> "$GITHUB_OUTPUT"
          encoded_instance_id="$(python - "$resolved_instance_id" <<'PY'
          import sys
          from urllib.parse import quote

          print(quote(sys.argv[1], safe=""))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            "${base_url}/${encoded_instance_id}?order=asc" \
            --output detail.json

      - name: Report status, retries and errors
        id: workflow_report
        shell: bash
        env:
          RESOLVED_INSTANCE_ID: ${{ steps.fetch.outputs.resolved_instance_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          def clean(value, limit=800):
              if value is None:
                  return ""
              if isinstance(value, dict):
                  value = ": ".join(
                      str(value.get(key, "")) for key in ("name", "message")
                  ).strip(": ") or json.dumps(value, ensure_ascii=False)
              text = str(value).replace("\r", " ").replace("\n", " ")
              text = re.sub(r"(?i)(bearer\s+)[A-Za-z0-9._~+/-]+", r"\1[REDACTED]", text)
              text = re.sub(r"(?i)(token|secret|password|api[_ -]?key)(\s*[:=]\s*)[^&\s]+", r"\1\2[REDACTED]", text)
              text = re.sub(r"([?&][^=&#\s]+)=([^&#\s]+)", r"\1=[REDACTED]", text)
              return text[:limit]

          recent_payload = load("recent.json")
          detail_payload = load("detail.json")
          if detail_payload.get("success") is not True:
              raise SystemExit("Cloudflare Workflow detail request failed")

          result = detail_payload.get("result") or {}
          recent = recent_payload.get("result") or []
          lines = [
              "# Cloudflare Workflow-diagnose",
              "",
              f"- Workflow: `{os.environ['WORKFLOW_NAME']}`",
              f"- Instans: `{os.environ['RESOLVED_INSTANCE_ID']}`",
              f"- Status: **{clean(result.get('status') or 'unknown')}**",
              f"- Start: `{clean(result.get('start') or result.get('started_on') or '-')}`",
              f"- Slutt: `{clean(result.get('end') or result.get('ended_on') or '-')}`",
              f"- Antall trinn: **{result.get('step_count', len(result.get('steps') or []))}**",
          ]

          if result.get("error"):
              lines.extend(["", "## Overordnet feil", "", clean(result["error"])])

          lines.extend([
              "",
              "## Trinn",
              "",
              "| Trinn | Resultat | Forsøk | Start | Slutt | Feil |",
              "|---|---:|---:|---|---|---|",
          ])

          failure_count = 0
          retry_count = 0
          for index, step in enumerate(result.get("steps") or [], start=1):
              attempts = step.get("attempts") or []
              retries = max(0, len(attempts) - 1)
              retry_count += retries
              errors = []
              for attempt in attempts:
                  if attempt.get("success") is False:
                      failure_count += 1
                  if attempt.get("error"):
                      errors.append(clean(attempt["error"], 300))
              if step.get("error"):
                  errors.append(clean(step["error"], 300))
              success = step.get("success")
              outcome = "OK" if success is True else "FEIL" if success is False else clean(step.get("type") or "-")
              name = clean(step.get("name") or f"Trinn {index}", 120).replace("|", "\\|")
              error_text = "; ".join(dict.fromkeys(errors)).replace("|", "\\|") or "-"
              lines.append(
                  f"| {name} | {outcome} | {len(attempts)} | "
                  f"{clean(step.get('start') or '-')} | {clean(step.get('end') or '-')} | {error_text} |"
              )

          lines.extend([
              "",
              f"- Omkjøringer: **{retry_count}**",
              f"- Mislykkede forsøk: **{failure_count}**",
              "",
              "## Ti siste instanser",
              "",
              "| Instans | Status | Opprettet | Start | Slutt |",
              "|---|---|---|---|---|",
          ])
          for instance in recent:
              lines.append(
                  f"| `{clean(instance.get('id'), 120)}` | {clean(instance.get('status') or '-')} | "
                  f"{clean(instance.get('created_on') or '-')} | {clean(instance.get('started_on') or '-')} | "
                  f"{clean(instance.get('ended_on') or '-')} |"
              )

          production_unhealthy = (
              result.get("status") in {"errored", "terminated"}
              or result.get("success") is False
          )
          lines.extend([
              "",
              "## Diagnoseutfall",
              "",
              (
                  "- Diagnostikken kunne lese Workflow-instansen, men fant et produksjonsavvik."
                  if production_unhealthy
                  else "- Diagnostikken kunne lese Workflow-instansen uten produksjonsavvik."
              ),
          ])

          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(report)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"production_unhealthy={'true' if production_unhealthy else 'false'}\n"
              )
          if production_unhealthy:
              print("::warning::Diagnostikken fant en feilet Cloudflare Workflow-instans.")
          PY

      - name: Read production D1 diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          databases_url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --get \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "name=${D1_DATABASE_NAME}" \
            --data-urlencode "per_page=10" \
            "$databases_url" \
            --output d1-databases.json

          database_id="$(python - <<'PY'
          import json
          import os

          with open("d1-databases.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare D1 list request failed")
          wanted = os.environ["D1_DATABASE_NAME"]
          matches = [row for row in (payload.get("result") or []) if row.get("name") == wanted]
          if len(matches) != 1 or not matches[0].get("uuid"):
              raise SystemExit(f"Expected exactly one D1 database named {wanted!r}")
          print(matches[0]["uuid"])
          PY
          )"

          python - <<'PY'
          import json

          batch = [
              {
                  "sql": """
                      SELECT id, job_name, started_at, finished_at, status,
                             records_written, error_message, metadata_json
                      FROM job_runs
                      WHERE job_name IN ('cloudflare_full_refresh', 'cloudflare_fast_refresh')
                      ORDER BY id DESC
                      LIMIT 12
                  """
              },
              {
                  "sql": """
                      SELECT s.code, s.name, sh.checked_at, sh.status,
                             sh.latency_ms, sh.error_message
                      FROM source_health sh
                      JOIN sources s ON s.id = sh.source_id
                      JOIN (
                          SELECT source_id, MAX(id) AS max_id
                          FROM source_health
                          GROUP BY source_id
                      ) latest ON latest.max_id = sh.id
                      WHERE s.is_active = 1
                      ORDER BY s.code
                  """
              },
              {
                  "sql": """
                      SELECT fr.base_currency, fr.quote_currency,
                             substr(fr.observed_at, 1, 10) AS observed_date,
                             fr.rate, fr.fetched_at, s.code AS source_code
                      FROM fx_rates fr
                      JOIN sources s ON s.id = fr.source_id
                      WHERE s.code = 'NORGES_BANK'
                        AND fr.quote_currency = 'NOK'
                        AND fr.base_currency IN ('BRL', 'USD')
                      ORDER BY fr.observed_at DESC, fr.base_currency
                      LIMIT 12
                  """
              },
              {
                  "sql": """
                      SELECT as_of_at, status, created_at, components_json
                      FROM nav_snapshots
                      WHERE nav_scope = 'CORE'
                      ORDER BY as_of_at DESC, id DESC
                      LIMIT 1
                  """
              },
          ]
          with open("d1-query-request.json", "w", encoding="utf-8") as handle:
              json.dump({"batch": batch}, handle)
          PY

          query_url="${CF_API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${database_id}/query"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data-binary @d1-query-request.json \
            "$query_url" \
            --output d1-query.json

          python - <<'PY'
          import json
          import os
          import re

          def clean(value, limit=500):
              if value is None:
                  return "-"
              text = str(value).replace("\r", " ").replace("\n", " ")
              text = re.sub(r"(?i)(bearer\s+)[A-Za-z0-9._~+/-]+", r"\1[REDACTED]", text)
              text = re.sub(r"(?i)(token|secret|password|api[_ -]?key)(\s*[:=]\s*)[^&\s]+", r"\1\2[REDACTED]", text)
              text = re.sub(r"(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b", "[REDACTED_EMAIL]", text)
              text = re.sub(r"([?&][^=&#\s]+)=([^&#\s]+)", r"\1=[REDACTED]", text)
              return text[:limit]

          def cell(value, limit=500):
              return clean(value, limit).replace("|", "\\|")

          def safe_json(value):
              if not value:
                  return {}
              try:
                  parsed = json.loads(str(value))
              except (TypeError, ValueError, json.JSONDecodeError):
                  return {}
              return parsed if isinstance(parsed, dict) else {}

          with open("d1-query.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("success") is not True:
              raise SystemExit("Cloudflare D1 query request failed")
          result = payload.get("result") or []
          if len(result) != 4 or any(item.get("success") is False for item in result):
              raise SystemExit("One or more read-only D1 diagnostic queries failed")

          jobs = result[0].get("results") or []
          sources = result[1].get("results") or []
          fx_rows = result[2].get("results") or []
          nav_rows = result[3].get("results") or []

          full = next((row for row in jobs if row.get("job_name") == "cloudflare_full_refresh"), None)
          fast = next((row for row in jobs if row.get("job_name") == "cloudflare_fast_refresh"), None)
          full_target = safe_json((full or {}).get("metadata_json")).get("target_date")

          latest_fx = {}
          for row in fx_rows:
              currency = row.get("base_currency")
              if currency in {"BRL", "USD"} and currency not in latest_fx:
                  latest_fx[currency] = row
          fx_dates = [latest_fx[c].get("observed_date") for c in ("BRL", "USD") if c in latest_fx]
          latest_common_fx = min(fx_dates) if len(fx_dates) == 2 and all(fx_dates) else None
          fx_matches_target = bool(full_target and latest_common_fx and latest_common_fx >= str(full_target))

          nav = nav_rows[0] if nav_rows else {}
          components = safe_json(nav.get("components_json"))
          bmob3 = components.get("bmob3") if isinstance(components.get("bmob3"), dict) else {}
          nav_brl_date = bmob3.get("brl_nok_date")

          full_status = (full or {}).get("status") or "MISSING"
          fast_status = (fast or {}).get("status") or "MISSING"
          d1_status = "OK"
          if full_status != "SUCCESS" or fast_status not in {"SUCCESS", "PARTIAL"}:
              d1_status = "AVVIK"
          if full_target and not fx_matches_target:
              d1_status = "AVVIK"

          lines = [
              "",
              "# D1 produksjonsdiagnose",
              "",
              f"- Database: `{cell(os.environ['D1_DATABASE_NAME'], 80)}`",
              f"- D1-status: **{d1_status}**",
              f"- Siste fulloppdatering: **{cell(full_status, 40)}** – `{cell((full or {}).get('finished_at') or (full or {}).get('started_at'), 80)}`",
              f"- Fulljobb mål-dato: `{cell(full_target, 20)}`",
              f"- Siste 30-minuttersjobb: **{cell(fast_status, 40)}** – `{cell((fast or {}).get('finished_at') or (fast or {}).get('started_at'), 80)}`",
              f"- Siste felles Norges Bank FX-dato: `{cell(latest_common_fx, 20)}`",
              f"- FX dekker fulljobbens mål-dato: **{'JA' if fx_matches_target else 'NEI' if full_target else 'UKJENT'}**",
              f"- BRL/NOK-dato brukt i siste CORE-NAV: `{cell(nav_brl_date, 20)}`",
              f"- Siste CORE-NAV: `{cell(nav.get('as_of_at'), 80)}` ({cell(nav.get('status'), 40)})",
              "",
              "## Siste jobber",
              "",
              "| Jobb | Status | Start | Slutt | Rader | Mål-dato | Feil |",
              "|---|---|---|---|---:|---|---|",
          ]
          for row in jobs:
              target = safe_json(row.get("metadata_json")).get("target_date")
              lines.append(
                  f"| {cell(row.get('job_name'), 80)} | {cell(row.get('status'), 30)} | "
                  f"{cell(row.get('started_at'), 60)} | {cell(row.get('finished_at'), 60)} | "
                  f"{cell(row.get('records_written'), 30)} | {cell(target, 20)} | "
                  f"{cell(row.get('error_message'), 300)} |"
              )

          lines.extend([
              "",
              "## Kildehelse",
              "",
              "| Kilde | Status | Kontrollert | Latens ms | Feil |",
              "|---|---|---|---:|---|",
          ])
          for row in sources:
              label = row.get("code") or row.get("name") or "-"
              lines.append(
                  f"| {cell(label, 80)} | {cell(row.get('status'), 30)} | "
                  f"{cell(row.get('checked_at'), 60)} | {cell(row.get('latency_ms'), 30)} | "
                  f"{cell(row.get('error_message'), 300)} |"
              )

          lines.extend([
              "",
              "## Siste Norges Bank FX-rader",
              "",
              "| Par | Dato | Kurs | Hentet |",
              "|---|---|---:|---|",
          ])
          for row in fx_rows:
              pair = f"{row.get('base_currency', '-')}/{row.get('quote_currency', '-')}"
              lines.append(
                  f"| {cell(pair, 20)} | {cell(row.get('observed_date'), 20)} | "
                  f"{cell(row.get('rate'), 40)} | {cell(row.get('fetched_at'), 60)} |"
              )

          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(report)
          PY

      - name: Alert on unhealthy scheduled production
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          steps.workflow_report.outputs.production_unhealthy == 'true'
        shell: bash
        run: |
          echo '::error::Den automatiske diagnosen fant en feilet Cloudflare Workflow-instans.'
          exit 1
