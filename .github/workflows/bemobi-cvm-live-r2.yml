name: "20 – Bemobi – innhenting av CVM-dokumenter"

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2,23 * * *'
  push:
    branches: [main]
    paths:
      - tools/mirror_bemobi_cvm_live.py
      - cloudflare/src/bemobi_cvm_mirror.py
      - backend/tests/test_bemobi_cvm_publish.py
      - tools/probe_bemobi_cvm_rad.py
      - cloudflare/src/bemobi_cvm_rad.py
  pull_request:
    paths:
      - .github/workflows/bemobi-cvm-live-r2.yml
      - tools/mirror_bemobi_cvm_live.py
      - cloudflare/src/bemobi_cvm_mirror.py
      - backend/tests/test_bemobi_cvm_publish.py
      - tools/probe_bemobi_cvm_rad.py
      - cloudflare/src/bemobi_cvm_rad.py

permissions:
  contents: read
concurrency:
  group: bemobi-cvm-live-r2-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    # Pull requests validate without production credentials. Main uses one download in publish.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - run: python3 -m pytest -q backend/tests/test_bemobi_cvm_publish.py
      - run: python3 tools/mirror_bemobi_cvm_live.py "$RUNNER_TEMP/cvm-mirror"
      - run: python3 tools/mirror_bemobi_cvm_live.py "$RUNNER_TEMP/cvm-mirror" --verify-only

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - run: python3 tools/mirror_bemobi_cvm_live.py "$RUNNER_TEMP/cvm-mirror"
      - run: npm ci --prefix cloudflare --no-audit --no-fund
      - name: Recheck the same locally validated bundle before upload
        run: python3 tools/mirror_bemobi_cvm_live.py "$RUNNER_TEMP/cvm-mirror" --verify-only
      - name: Publish immutable verified PDF first, then current index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$CLOUDFLARE_R2_BUCKET_NAME" =~ ^[a-zA-Z0-9_-]{1,63}$ ]]
          key="$(cat "$RUNNER_TEMP/cvm-mirror/key.txt")"
          [[ "$key" =~ ^mirror/official/bemobi/cvm-rad/v1/[0-9]+-[0-9]+-[0-9]+/[a-f0-9]{64}\.pdf$ ]]
          W="$GITHUB_WORKSPACE/cloudflare/node_modules/.bin/wrangler"
          "$W" r2 object put "$CLOUDFLARE_R2_BUCKET_NAME/$key" --file="$RUNNER_TEMP/cvm-mirror/release.pdf" --content-type=application/pdf --remote
          "$W" r2 object get "$CLOUDFLARE_R2_BUCKET_NAME/$key" --file="$RUNNER_TEMP/cvm-mirror/readback.pdf" --remote
          cmp "$RUNNER_TEMP/cvm-mirror/release.pdf" "$RUNNER_TEMP/cvm-mirror/readback.pdf"
          "$W" r2 object put "$CLOUDFLARE_R2_BUCKET_NAME/mirror/official/bemobi/cvm-rad/v1/latest.json" --file="$RUNNER_TEMP/cvm-mirror/latest.json" --content-type=application/json --remote
          "$W" r2 object get "$CLOUDFLARE_R2_BUCKET_NAME/mirror/official/bemobi/cvm-rad/v1/latest.json" --file="$RUNNER_TEMP/cvm-mirror/readback.json" --remote
          cmp "$RUNNER_TEMP/cvm-mirror/latest.json" "$RUNNER_TEMP/cvm-mirror/readback.json"
          echo "Verified PDF and index published and read back from private R2."
