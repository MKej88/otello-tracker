name: Temporary hygiene patch

on:
  push:
    branches: ["fix/workflow-failure-finalization-docs"]
    paths:
      - ".github/workflows/temp-hygiene-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/workflow-failure-finalization-docs
          fetch-depth: 0
      - name: Apply workflow failure finalization and documentation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Generic, idempotent failure finalization. Preserve existing job metadata and
          # never overwrite a job that is already SUCCESS/PARTIAL/FAILED.
          repo_path = Path("cloudflare/src/repository.py")
          repo_text = repo_path.read_text(encoding="utf-8")
          if "async def fail_job_if_running(" not in repo_text:
              repo_text = repo_text.rstrip() + '''\n\n    async def fail_job_if_running(\n        self,\n        job_id: int,\n        *,\n        finished_at: str,\n        error_message: str,\n        metadata: dict[str, Any] | None = None,\n    ) -> bool:\n        \"\"\"Mark a still-running job FAILED without overwriting a terminal result.\"\"\"\n        row = await self.first(\n            \"SELECT status, metadata_json FROM job_runs WHERE id=? LIMIT 1\",\n            (job_id,),\n        )\n        if row is None or str(row.get(\"status\") or \"\").upper() != \"RUNNING\":\n            return False\n\n        try:\n            existing_metadata = json.loads(str(row.get(\"metadata_json\") or \"{}\"))\n        except (TypeError, json.JSONDecodeError):\n            existing_metadata = {}\n        if not isinstance(existing_metadata, dict):\n            existing_metadata = {}\n        merged_metadata = {**existing_metadata, **(metadata or {})}\n        await self.finish_job(\n            job_id,\n            finished_at=finished_at,\n            status=\"FAILED\",\n            records_written=0,\n            error_message=error_message[:4000] or None,\n            metadata=merged_metadata,\n        )\n        return True\n'''
              repo_path.write_text(repo_text, encoding="utf-8")

          # 2) Wire failure finalization into the Workflow exception path before failure email.
          entry_path = Path("cloudflare/src/entry.py")
          entry_text = entry_path.read_text(encoding="utf-8")
          old = '''        except Exception as exc:\n            failure_result = {\n                \"status\": \"FAILED\",\n                \"job_id\": locals().get(\"job_id\"),\n                \"target_date\": target_date,\n                \"records_written\": 0,\n                \"source_health\": {},\n                \"critical_errors\": [\n                    {\n                        \"step\": \"workflow\",\n                        \"error\": str(exc)[:1000] or type(exc).__name__,\n                    }\n                ],\n                \"preflight\": locals().get(\"preflight_result\", {}),\n                \"errors\": [\n                    {\n                        \"step\": \"workflow\",\n                        \"error\": str(exc)[:1000] or type(exc).__name__,\n                    }\n                ],\n            }\n\n            @step.do(\n                \"send nightly failure status email\",'''
          new = '''        except Exception as exc:\n            workflow_error = str(exc)[:1000] or type(exc).__name__\n            failure_result = {\n                \"status\": \"FAILED\",\n                \"job_id\": locals().get(\"job_id\"),\n                \"target_date\": target_date,\n                \"records_written\": 0,\n                \"source_health\": {},\n                \"critical_errors\": [\n                    {\n                        \"step\": \"workflow\",\n                        \"error\": workflow_error,\n                    }\n                ],\n                \"preflight\": locals().get(\"preflight_result\", {}),\n                \"errors\": [\n                    {\n                        \"step\": \"workflow\",\n                        \"error\": workflow_error,\n                    }\n                ],\n            }\n\n            failure_job_id = failure_result.get(\"job_id\")\n            if failure_job_id is not None:\n                @step.do(\n                    \"finalize failed full refresh\",\n                    config={\"retries\": {\"limit\": 3, \"delay\": \"10 seconds\"}, \"timeout\": \"2 minutes\"},\n                )\n                async def failure_finalize_step():\n                    repository = PerformanceD1WriteRepository(self.env.DB)\n                    updated = await repository.fail_job_if_running(\n                        int(failure_job_id),\n                        finished_at=datetime.now(UTC).isoformat(timespec=\"milliseconds\").replace(\"+00:00\", \"Z\"),\n                        error_message=workflow_error,\n                        metadata={\n                            \"target_date\": target_date,\n                            \"failure\": {\"step\": \"workflow\", \"error\": workflow_error},\n                        },\n                    )\n                    return {\"updated\": updated, \"job_id\": int(failure_job_id)}\n\n                try:\n                    failure_result[\"job_finalization\"] = await failure_finalize_step()\n                except Exception as finalize_exc:\n                    finalize_error = str(finalize_exc)[:1000] or type(finalize_exc).__name__\n                    failure_result[\"job_finalization\"] = {\n                        \"updated\": False,\n                        \"error\": finalize_error,\n                    }\n                    failure_result[\"errors\"].append(\n                        {\"step\": \"failure_finalization\", \"error\": finalize_error}\n                    )\n\n            @step.do(\n                \"send nightly failure status email\",'''
          if old not in entry_text:
              raise SystemExit("Expected Workflow exception block was not found")
          entry_path.write_text(entry_text.replace(old, new, 1), encoding="utf-8")

          # Regression tests: RUNNING is finalized; terminal SUCCESS is never overwritten;
          # and the Workflow is actually wired to call the guarded finalizer.
          test_path = Path("backend/tests/test_cloudflare_job_failure_finalization.py")
          test_path.write_text('''from __future__ import annotations\n\nimport asyncio\nimport json\nimport sys\nfrom pathlib import Path\n\nCLOUDFLARE_SRC = Path(__file__).resolve().parents[2] / \"cloudflare\" / \"src\"\nif str(CLOUDFLARE_SRC) not in sys.path:\n    sys.path.insert(0, str(CLOUDFLARE_SRC))\n\nfrom repository import D1WriteRepository  # noqa: E402\n\n\nclass StubJobRepository(D1WriteRepository):\n    def __init__(self, row):\n        self.row = row\n        self.finished = []\n\n    async def first(self, sql, parameters=()):\n        assert \"FROM job_runs\" in sql\n        assert parameters == (42,)\n        return dict(self.row) if self.row is not None else None\n\n    async def finish_job(self, job_id, **kwargs):\n        self.finished.append((job_id, kwargs))\n\n\ndef test_fail_job_if_running_marks_failed_and_preserves_metadata():\n    repository = StubJobRepository(\n        {\n            \"status\": \"RUNNING\",\n            \"metadata_json\": json.dumps(\n                {\"phase\": \"16.3\", \"trigger\": \"workflow_schedule:35 3 * * *\"}\n            ),\n        }\n    )\n\n    updated = asyncio.run(\n        repository.fail_job_if_running(\n            42,\n            finished_at=\"2026-08-23T05:46:41.000Z\",\n            error_message=\"Too many API requests\",\n            metadata={\n                \"target_date\": \"2026-08-22\",\n                \"failure\": {\"step\": \"workflow\", \"error\": \"Too many API requests\"},\n            },\n        )\n    )\n\n    assert updated is True\n    assert len(repository.finished) == 1\n    job_id, values = repository.finished[0]\n    assert job_id == 42\n    assert values[\"status\"] == \"FAILED\"\n    assert values[\"finished_at\"] == \"2026-08-23T05:46:41.000Z\"\n    assert values[\"records_written\"] == 0\n    assert values[\"error_message\"] == \"Too many API requests\"\n    assert values[\"metadata\"][\"phase\"] == \"16.3\"\n    assert values[\"metadata\"][\"trigger\"] == \"workflow_schedule:35 3 * * *\"\n    assert values[\"metadata\"][\"target_date\"] == \"2026-08-22\"\n    assert values[\"metadata\"][\"failure\"][\"step\"] == \"workflow\"\n\n\ndef test_fail_job_if_running_does_not_overwrite_terminal_success():\n    repository = StubJobRepository(\n        {\"status\": \"SUCCESS\", \"metadata_json\": json.dumps({\"phase\": \"16.3\"})}\n    )\n\n    updated = asyncio.run(\n        repository.fail_job_if_running(\n            42,\n            finished_at=\"2026-08-23T05:46:41.000Z\",\n            error_message=\"email failed after successful refresh\",\n        )\n    )\n\n    assert updated is False\n    assert repository.finished == []\n\n\ndef test_full_workflow_exception_path_uses_guarded_failure_finalizer():\n    source = (CLOUDFLARE_SRC / \"entry.py\").read_text(encoding=\"utf-8\")\n    assert '\"finalize failed full refresh\"' in source\n    assert \"fail_job_if_running(\" in source\n    assert source.index('\"finalize failed full refresh\"') < source.index(\n        '\"send nightly failure status email\"'\n    )\n''', encoding="utf-8")

          # 3) Documentation drift: align active views, API version/endpoints, Life360,
          # failure finalization and current production subrequest safety ceiling.
          replace_once("README.md", "## Status 21.08.2026", "## Status 23.08.2026")
          replace_once(
              "README.md",
              "- Oversikt\n- NAV\n- Tilbakekjøp\n- Bemobi\n- Konsensus\n\nHistorikk, Nyheter og Innstillinger er fortsatt inaktive områder i navigasjonen.",
              "- Oversikt\n- NAV\n- Historikk\n- Tilbakekjøp\n- Bemobi\n- Konsensus\n\nNyheter og Innstillinger er fortsatt inaktive områder i navigasjonen.",
          )
          replace_once("README.md", "API-versjon: **0.12.1**", "API-versjon: **0.13.0**")
          replace_once(
              "README.md",
              "GET /api/dashboard/history\nGET /api/dashboard/report-status",
              "GET /api/dashboard/history\nGET /api/dashboard/discount-history\nGET /api/dashboard/report-status",
          )
          replace_once(
              "README.md",
              "blant annet Norges Bank, B3, CVM, Bemobi-webkilder",
              "blant annet Norges Bank, Life360, B3, CVM, Bemobi-webkilder",
          )
          replace_once(
              "README.md",
              "cleanup skal frigjøre låsen også ved feil, og expiry er siste sikkerhetsnett.",
              "cleanup skal frigjøre låsen også ved feil, og expiry er siste sikkerhetsnett. En startet D1-jobb terminaliseres eksplisitt til `FAILED` ved hard Workflow-feil dersom den fortsatt står `RUNNING`.",
          )
          replace_once("README.md", "Subrequests:  500", "Subrequests:  50 000")

          replace_once(
              "docs/architecture.md",
              "- Oversikt\n- NAV\n- Tilbakekjøp\n- Bemobi\n- Konsensus\n\nHistorikk, Nyheter og Innstillinger ligger fortsatt i navigasjonen som inaktive områder og skal ikke beskrives som ferdige sider.",
              "- Oversikt\n- NAV\n- Historikk\n- Tilbakekjøp\n- Bemobi\n- Konsensus\n\nNyheter og Innstillinger ligger fortsatt i navigasjonen som inaktive områder og skal ikke beskrives som ferdige sider.",
          )
          replace_once(
              "docs/architecture.md",
              "GET /api/dashboard/history\nGET /api/dashboard/report-status",
              "GET /api/dashboard/history\nGET /api/dashboard/discount-history\nGET /api/dashboard/report-status\nGET /api/dashboard/runtime-status",
          )
          replace_once(
              "docs/architecture.md",
              "inkludert Norges Bank-valuta, avstemming, NAV-oppdatering",
              "inkludert Norges Bank-valuta, Life360-markedsdata, avstemming, NAV-oppdatering",
          )
          replace_once(
              "docs/architecture.md",
              "Låsen skal alltid frigjøres også ved feil, og har i tillegg expiry som siste sikkerhetsnett.",
              "Låsen skal alltid frigjøres også ved feil, og har i tillegg expiry som siste sikkerhetsnett. Dersom Full Workflow krasjer etter at D1-jobben er startet, terminaliseres en fortsatt `RUNNING` jobbrad til `FAILED` før feilstatusmail forsøkes sendt.",
          )

          replace_once(
              "cloudflare/README.md",
              "GET /api/dashboard/history\nGET /api/dashboard/report-status",
              "GET /api/dashboard/history\nGET /api/dashboard/discount-history\nGET /api/dashboard/report-status\nGET /api/dashboard/runtime-status",
          )
          replace_once(
              "cloudflare/README.md",
              "1. Norges Bank FX – direkte BRL/NOK og USD/NOK;\n2. B3 COTAHIST;\n3. Bemobi/CVM;\n4. Bemobi investor-webfakta;\n5. NewsWeb reconciliation;\n6. NewsWeb PDF og tilbakekjøpsdetaljer;\n7. Otello-rapportinnlesing;\n8. OTEC recovery/EOD;\n9. NAV-oppdatering;\n10. D1 production-data preflight;\n11. R2 logical snapshot når retention-policy krever det;\n12. jobb-/source-health-finalisering.",
              "1. Norges Bank FX – direkte BRL/NOK og USD/NOK;\n2. Life360-markedsdata;\n3. B3 COTAHIST;\n4. Bemobi/CVM;\n5. Bemobi investor-webfakta;\n6. NewsWeb reconciliation;\n7. NewsWeb PDF og tilbakekjøpsdetaljer;\n8. Otello-rapportinnlesing;\n9. OTEC recovery/EOD;\n10. NAV-oppdatering;\n11. D1 production-data preflight;\n12. R2 logical snapshot når retention-policy krever det;\n13. jobb-/source-health-finalisering.",
          )
          replace_once(
              "cloudflare/README.md",
              "Full Workflow bruker garantert cleanup for å forsøke å frigjøre låsen også ved feil, og låsen har expiry som siste sikkerhetsnett.",
              "Full Workflow bruker garantert cleanup for å forsøke å frigjøre låsen også ved feil, og låsen har expiry som siste sikkerhetsnett. En startet D1-jobb som fortsatt står `RUNNING` terminaliseres til `FAILED` ved hard Workflow-feil.",
          )
          replace_once("cloudflare/README.md", "Subrequests per invocation:        500", "Subrequests per invocation:        50 000")

          replace_once(
              "docs/cloudflare-paid-cost-guard.md",
              "Produksjonsgrensen er 60 000 ms CPU og 500 subrequests per invocation.",
              "Produksjonsgrensen er 60 000 ms CPU og 50 000 subrequests per invocation. Subrequest-tallet er et sikkerhetstak for Full Workflow, ikke et mål for normal bruk.",
          )
          replace_once(
              "docs/cloudflare-paid-cost-guard.md",
              "Subrequests per invocation:        500",
              "Subrequests per invocation:        50 000",
          )
          replace_once(
              "docs/cloudflare-paid-cost-guard.md",
              "Øk ikke `cpu_ms` eller `subrequests` bare for å skjule en ytelsesregresjon.",
              "Subrequest-budsjettet deles av hele Full Workflow-instansen og nullstilles ikke per `step.do`. Grensen på 50 000 gir margin til historiske rebuilds og cleanup/finalisering; ordinære kjøringer skal bruke langt mindre. Øk ikke `cpu_ms` eller `subrequests` bare for å skjule en ytelsesregresjon.",
          )
          PY

          rm .github/workflows/temp-hygiene-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix workflow failure finalization and sync docs"
          git push origin HEAD:fix/workflow-failure-finalization-docs
