name: Temporary Python lock generator (remove before merge)

on:
  pull_request:
    paths:
      - ".github/workflows/generate-python-locks.yml"

permissions:
  contents: read

jobs:
  generate-locks:
    name: Generate Python 3.12 hash locks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile hashes for Linux Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.3
          uv pip compile backend/requirements.txt --python-version 3.12 --python-platform x86_64-manylinux_2_17 --generate-hashes --output-file backend/requirements.lock.txt
          uv pip compile backend/requirements-dev.txt --python-version 3.12 --python-platform x86_64-manylinux_2_17 --generate-hashes --output-file backend/requirements-dev.lock.txt
          printf 'workers-py==1.16.2\nuv==0.12.3\n' > cloudflare/worker-tooling.in
          uv pip compile cloudflare/worker-tooling.in --python-version 3.12 --python-platform x86_64-manylinux_2_17 --generate-hashes --output-file cloudflare/worker-tooling.lock.txt
          python - <<'PY'
          import json
          from pathlib import Path

          for file in [
              "backend/requirements.lock.txt",
              "backend/requirements-dev.lock.txt",
              "cloudflare/worker-tooling.lock.txt",
          ]:
              print("OTELLO_FILE_BEGIN " + file)
              for line in Path(file).read_text().splitlines(keepends=True):
                  print("OTELLO_LINE " + json.dumps(line, ensure_ascii=True))
              print("OTELLO_FILE_END " + file)
          PY
