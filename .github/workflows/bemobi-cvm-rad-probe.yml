name: Bemobi CVM RAD public discovery probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/probe_bemobi_cvm_rad.py
      - .github/workflows/bemobi-cvm-rad-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install locked parser dependencies
        run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Discover CVM filings and verify official PDF
        run: PYTHONPATH=cloudflare/src python3 tools/probe_bemobi_cvm_rad.py
