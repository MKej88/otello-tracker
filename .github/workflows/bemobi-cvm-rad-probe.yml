name: Bemobi CVM RAD public discovery probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/probe_bemobi_cvm_rad.py
      - .github/workflows/bemobi-cvm-rad-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Discover CVM filings and verify official PDF
        run: python3 tools/probe_bemobi_cvm_rad.py
