name: Temporary source health patch runner

on:
  push:
    branches:
      - fix/source-health-degraded

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-health-degraded
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r backend/requirements.txt pytest
      - name: Recover and run corrected patch script
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-source-health-diagnostic.yml').read_text(encoding='utf-8')
          line = next(line for line in workflow.splitlines() if line.lstrip().startswith('PATCH_B64:'))
          payload = line.split('PATCH_B64:', 1)[1].strip()
          script = base64.b64decode(payload).decode('utf-8')
          old = 'pattern.subn(replacement + "def extract_pdf_text", text, count=1)'
          new = 'pattern.subn(lambda _match: replacement + "def extract_pdf_text", text, count=1)'
          Path('/tmp/apply.py').write_text(script.replace(old, new, 1), encoding='utf-8')
          PY
          python /tmp/apply.py
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('backend/app/newsweb/enrichment.py')
          text = path.read_text(encoding='utf-8')
          replacement = '''def parse_buyback_transaction_text(
              text: str,
              *,
              period_start: str | None = None,
              period_end: str | None = None,
          ) -> list[DailyBuybackTransaction]:
              trades = parse_buyback_trade_lines(text)
              daily = aggregate_daily_buybacks(trades)
              exec_buys = [
                  _integer(match.group(1))
                  for raw in text.splitlines()
                  if (match := _EXEC_BUY_RE.match(" ".join(raw.replace("\\u00a0", " ").split())))
              ]
              parsed_totals = [item.shares for item in daily]
              if exec_buys and sorted(exec_buys) != sorted(parsed_totals):
                  if period_start is not None and period_end is not None:
                      trades = _recover_single_missing_trade_date(
                          text, trades, exec_buys,
                          period_start=period_start, period_end=period_end,
                      )
                      daily = aggregate_daily_buybacks(trades)
                      parsed_totals = [item.shares for item in daily]
              if exec_buys and sorted(exec_buys) != sorted(parsed_totals):
                  raise ValueError(
                      f"NewsWeb ExecBuy-avstemming feilet: vedlegg={exec_buys}, parser={parsed_totals}"
                  )
              return daily
          '''
          pattern = re.compile(r'def parse_buyback_transaction_text\(.*?\n\ndef extract_pdf_text', re.S)
          text, count = pattern.subn(lambda _m: replacement + '\n\ndef extract_pdf_text', text, count=1)
          if count != 1:
              raise SystemExit(f'Backend parser replacement count={count}')
          old_call = 'daily = parse_buyback_transaction_text(extract_pdf_text(pdf_bytes))'
          new_call = '''daily = parse_buyback_transaction_text(
              extract_pdf_text(pdf_bytes),
              period_start=weekly_for_validation.period_start,
              period_end=weekly_for_validation.period_end,
          )'''
          text = text.replace(old_call, new_call, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify backend import target
        run: |
          PYTHONPATH=backend python - <<'PY'
          import inspect
          import app.newsweb.enrichment as enrichment
          print('MODULE_FILE=', enrichment.__file__)
          print('SIGNATURE=', inspect.signature(enrichment.parse_buyback_transaction_text))
          assert 'period_start' in inspect.signature(enrichment.parse_buyback_transaction_text).parameters
          PY
      - name: Run targeted tests
        run: |
          PYTHONPATH=backend python -m pytest -q \
            backend/tests/test_newsweb_enrichment.py \
            backend/tests/test_cloudflare_newsweb_ingestion.py \
            backend/tests/test_bemobi_web_refresh.py
      - name: Commit fixes and remove temporary workflows
        run: |
          set -Eeuo pipefail
          git config user.name 'MKej88'
          git config user.email 'mads.kristensen2@gmail.com'
          git rm .github/workflows/tmp-source-health-diagnostic.yml .github/workflows/tmp-source-health-patch-runner.yml
          git add cloudflare/src/newsweb_daily_buybacks.py backend/app/newsweb/enrichment.py cloudflare/src/bemobi_web_refresh.py backend/tests/test_newsweb_enrichment.py backend/tests/test_cloudflare_newsweb_ingestion.py backend/tests/test_bemobi_web_refresh.py
          git diff --cached --check
          git commit -m 'Rett degraderte Bemobi- og NewsWeb-kilder'
          git push origin HEAD:fix/source-health-degraded
