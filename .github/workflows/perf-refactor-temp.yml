name: Temporary performance refactor

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.head_ref == 'perf-snappy-first-load' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf-snappy-first-load
      - name: Apply refactor
        run: python tools/perf_refactor_tmp.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[perf-refactor] Prioriter kritisk førsteinnlasting"
          git push origin HEAD:perf-snappy-first-load
