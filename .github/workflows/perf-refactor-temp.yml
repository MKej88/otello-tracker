name: Temporary performance refactor

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.head_ref == 'perf-snappy-first-load' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf-snappy-first-load
      - name: Refactor critical first load
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          app_path = Path("frontend/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")
          old_imports = '''import { useEffect, useMemo, useState } from "react";
          import BemobiPage from "./BemobiPage";
          import BuybackPage from "./BuybackPage";
          import ConsensusPage from "./ConsensusPage";
          import EconomicNavPanel from "./EconomicNavPanel";
          import HistoryPage from "./HistoryPage";
          import NavWaterfallPanel from "./NavWaterfallPanel";'''.replace("          ", "")
          new_imports = '''import { lazy, Suspense, useEffect, useMemo, useState } from "react";
          import EconomicNavPanel from "./EconomicNavPanel";

          const loadBemobiPage = () => import("./BemobiPage");
          const loadBuybackPage = () => import("./BuybackPage");
          const loadConsensusPage = () => import("./ConsensusPage");
          const loadHistoryPage = () => import("./HistoryPage");
          const loadNavWaterfallPanel = () => import("./NavWaterfallPanel");

          const BemobiPage = lazy(loadBemobiPage);
          const BuybackPage = lazy(loadBuybackPage);
          const ConsensusPage = lazy(loadConsensusPage);
          const HistoryPage = lazy(loadHistoryPage);
          const NavWaterfallPanel = lazy(loadNavWaterfallPanel);'''.replace("          ", "")
          if old_imports not in app:
              raise SystemExit("App imports changed unexpectedly")
          app = app.replace(old_imports, new_imports, 1)

          start_marker = '''  useEffect(() => {
            let active = true;

            const loadDashboard = () => {'''.replace("          ", "")
          start = app.index(start_marker)
          end = app.index("\n\n  const changes =", start)
          effects = '''  useEffect(() => {
            let active = true;
            let inFlight = false;

            const loadSummary = async () => {
              if (inFlight) return;
              inFlight = true;
              try {
                const response = await fetch("/api/dashboard/summary");
                if (!response.ok) throw new Error("Summary API-feil");
                const summaryData = await response.json() as Summary;
                if (!active) return;
                setSummary(summaryData);
                setApiOk(true);
                setRefreshFailed(false);
                setLastSuccessfulFetchAt(new Date().toLocaleTimeString("nb-NO", {
                  hour: "2-digit",
                  minute: "2-digit"
                }));
              } catch {
                if (!active) return;
                setApiOk(false);
                setRefreshFailed(true);
                setSummary((current) => current.ready
                  ? current
                  : { ready: false, data_status: "error", message: "Kunne ikke hente investordata." });
              } finally {
                inFlight = false;
              }
            };

            void loadSummary();
            const timer = window.setInterval(() => { void loadSummary(); }, AUTO_REFRESH_MS);
            return () => {
              active = false;
              window.clearInterval(timer);
            };
          }, []);

          useEffect(() => {
            if (!summary.ready) return undefined;
            let active = true;
            let inFlight = false;

            const loadForecast = async () => {
              if (inFlight) return;
              inFlight = true;
              try {
                const response = await fetch("/api/buybacks/forecast");
                if (!response.ok) throw new Error("Forecast API-feil");
                const forecastData = await response.json() as BuybackForecast;
                if (!active) return;
                setForecast(forecastData);
              } catch {
                if (!active) return;
                setForecast((current) => current.ready
                  ? { ...current, status: "FETCH_STALE" }
                  : { ready: false, status: "API_ERROR" });
              } finally {
                inFlight = false;
              }
            };

            const initialTimer = window.setTimeout(() => { void loadForecast(); }, 400);
            const timer = window.setInterval(() => { void loadForecast(); }, AUTO_REFRESH_MS);
            return () => {
              active = false;
              window.clearTimeout(initialTimer);
              window.clearInterval(timer);
            };
          }, [summary.ready]);

          useEffect(() => {
            if (activeView !== "NAV") return undefined;
            let active = true;
            let inFlight = false;

            const loadHistory = async () => {
              if (inFlight) return;
              inFlight = true;
              try {
                const response = await fetch("/api/dashboard/history?days=365&max_points=300");
                if (!response.ok) throw new Error("History API-feil");
                const historyData = await response.json() as History;
                if (!active) return;
                setHistory(historyData);
              } catch {
                if (!active) return;
                setHistory((current) => current.ready
                  ? current
                  : { ready: false, data_status: "error", points: [] });
              } finally {
                inFlight = false;
              }
            };

            void loadHistory();
            const timer = window.setInterval(() => { void loadHistory(); }, AUTO_REFRESH_MS);
            return () => {
              active = false;
              window.clearInterval(timer);
            };
          }, [activeView]);

          useEffect(() => {
            if (!summary.ready) return undefined;
            const timer = window.setTimeout(() => {
              void Promise.allSettled([
                loadHistoryPage(),
                loadBuybackPage(),
                loadBemobiPage(),
                loadConsensusPage(),
                loadNavWaterfallPanel(),
              ]);
            }, 2500);
            return () => window.clearTimeout(timer);
          }, [summary.ready]);'''.replace("          ", "")
          app = app[:start] + effects + app[end:]

          helper = '''
          function preloadView(view: View) {
            if (view === "Historikk") void loadHistoryPage();
            else if (view === "Tilbakekjøp") void loadBuybackPage();
            else if (view === "Bemobi") void loadBemobiPage();
            else if (view === "Konsensus") void loadConsensusPage();
            else if (view === "NAV") void loadNavWaterfallPanel();
          }

          function ViewFallback() {
            return (
              <section className="card" aria-busy="true">
                <span className="label">Visning</span>
                <strong>Laster modul …</strong>
              </section>
            );
          }
          '''.replace("          ", "")
          export_marker = "\nexport default function App()"
          app = app.replace(export_marker, "\n" + helper + export_marker, 1)

          nav_click = '''                onClick={() => item.enabled && setActiveView(item.label as View)}
                title={item.enabled ? undefined : "Denne visningen er ikke aktiv ennå"}'''
          nav_prefetch = '''                onClick={() => item.enabled && setActiveView(item.label as View)}
                onMouseEnter={() => item.enabled && preloadView(item.label as View)}
                onFocus={() => item.enabled && preloadView(item.label as View)}
                title={item.enabled ? undefined : "Denne visningen er ikke aktiv ennå"}'''
          if nav_click not in app:
              raise SystemExit("Navigation button changed unexpectedly")
          app = app.replace(nav_click, nav_prefetch, 1)

          lazy_replacements = {
              "          <HistoryPage />": "          <Suspense fallback={<ViewFallback />}><HistoryPage /></Suspense>",
              "          <BuybackPage />": "          <Suspense fallback={<ViewFallback />}><BuybackPage /></Suspense>",
              "          <BemobiPage />": "          <Suspense fallback={<ViewFallback />}><BemobiPage /></Suspense>",
              "          <ConsensusPage />": "          <Suspense fallback={<ViewFallback />}><ConsensusPage /></Suspense>",
              "            <NavWaterfallPanel />": "            <Suspense fallback={<ViewFallback />}><NavWaterfallPanel /></Suspense>",
          }
          for old, new in lazy_replacements.items():
              if old not in app:
                  raise SystemExit(f"Lazy target not found: {old}")
              app = app.replace(old, new, 1)
          app_path.write_text(app, encoding="utf-8")

          economic_path = Path("frontend/src/EconomicNavPanel.tsx")
          economic = economic_path.read_text(encoding="utf-8")
          old_loading = '''  if (data == null) {
            if (!refreshFailed) return variant === "summary" ? <MarketQuotePanel /> : null;
            return (
              <section className="economicNavHost">
                <div className="economicNavPanel economicNavUnavailable">
                  <div>
                    <span className="economicEyebrow">Investorjustert NAV</span>
                    <strong>Økonomisk NAV kunne ikke hentes</strong>
                  </div>
                  <span>{reasonLabel("api_error")}</span>
                </div>
                {variant === "summary" && <MarketQuotePanel />}
              </section>
            );
          }'''.replace("          ", "")
          new_loading = '''  if (data == null) {
            return (
              <section className="economicNavHost">
                <div className="economicNavPanel economicNavUnavailable" aria-busy={!refreshFailed}>
                  <div>
                    <span className="economicEyebrow">Investorjustert NAV</span>
                    <strong>{refreshFailed ? "Økonomisk NAV kunne ikke hentes" : "Henter økonomisk NAV …"}</strong>
                  </div>
                  <span>{refreshFailed ? reasonLabel("api_error") : "LASTER"}</span>
                </div>
                {variant === "summary" && <MarketQuotePanel />}
              </section>
            );
          }'''.replace("          ", "")
          if old_loading not in economic:
              raise SystemExit("Economic NAV loading block changed unexpectedly")
          economic_path.write_text(economic.replace(old_loading, new_loading, 1), encoding="utf-8")

          Path("frontend/src/DeferredDiagnostics.tsx").write_text('''import { lazy, Suspense, useEffect, useState } from "react";

          const ReportStatusMount = lazy(() => import("./ReportStatusPanel"));
          const RuntimeStatusMount = lazy(() => import("./RuntimeStatusPanel"));

          export default function DeferredDiagnostics() {
            const [ready, setReady] = useState(false);

            useEffect(() => {
              let timer: number | null = null;
              const schedule = () => {
                timer = window.setTimeout(() => setReady(true), 2000);
              };

              if (document.readyState === "complete") schedule();
              else window.addEventListener("load", schedule, { once: true });

              return () => {
                window.removeEventListener("load", schedule);
                if (timer != null) window.clearTimeout(timer);
              };
            }, []);

            if (!ready) return null;
            return (
              <Suspense fallback={null}>
                <ReportStatusMount />
                <RuntimeStatusMount />
              </Suspense>
            );
          }
          '''.replace("          ", ""), encoding="utf-8")

          Path("frontend/src/main.tsx").write_text('''import React from "react";
          import ReactDOM from "react-dom/client";
          import App from "./App";
          import DeferredDiagnostics from "./DeferredDiagnostics";
          import "./styles.css";
          import "./prelive.css";

          ReactDOM.createRoot(document.getElementById("root")!).render(
            <React.StrictMode>
              <App />
              <DeferredDiagnostics />
            </React.StrictMode>
          );
          '''.replace("          ", ""), encoding="utf-8")

          Path(".github/workflows/perf-refactor-temp.yml").unlink()

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[perf-refactor] Prioriter kritisk førsteinnlasting"
          git push origin HEAD:perf-snappy-first-load
