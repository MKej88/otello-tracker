name: Bemobi IR og JCP - lesediagnose

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-bemobi-526-jcp
      - main
    paths:
      - .github/workflows/bemobi-ir-jcp-readonly.yml
      - cloudflare/src/bemobi_distribution_ingestion.py
      - backend/tests/test_bemobi_distribution_auto_ingestion.py

permissions:
  contents: read

concurrency:
  group: bemobi-ir-jcp-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME || 'otello-nav' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read-only D1 and official transport diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.getenv("CF_API_TOKEN")
          account = os.getenv("CF_ACCOUNT")
          database_name = os.getenv("CF_DATABASE_NAME", "otello-nav")
          if not token or not account:
              raise SystemExit("Cloudflare read-only secrets are unavailable")
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}"
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def cf(path, body=None):
              req = urllib.request.Request(
                  base + path,
                  headers=headers,
                  method="POST" if body is not None else "GET",
                  data=None if body is None else json.dumps(body).encode(),
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise ValueError("Cloudflare API returned unsuccessful result")
              return payload.get("result")

          lookup = urllib.parse.urlencode({"name": database_name, "per_page": "10"})
          databases = cf("/d1/database?" + lookup)
          selected = [d for d in databases if d.get("name") == database_name]
          if len(selected) != 1:
              raise SystemExit("Expected exactly one named production D1 database")
          db_id = selected[0]["uuid"]

          queries = {
              "latest_full_refresh": """
                  SELECT id, started_at, finished_at, status, metadata_json
                  FROM job_runs WHERE job_name='cloudflare_full_refresh'
                  ORDER BY id DESC LIMIT 1
              """,
              "q3_jcp_actions": """
                  SELECT ca.id, ca.action_type, ca.announcement_date,
                         ca.record_date, ca.ex_date, ca.payment_date,
                         ca.amount_per_share, ca.gross_total_amount,
                         ca.net_amount_per_share, ca.net_total_amount,
                         ca.withholding_rate, ca.external_action_id,
                         sd.url AS source_url, sd.content_sha256
                  FROM corporate_actions ca
                  JOIN instruments i ON i.id=ca.issuer_instrument_id
                  LEFT JOIN source_documents sd ON sd.id=ca.source_document_id
                  WHERE i.symbol='BMOB3' AND ca.action_type='JCP'
                    AND ca.ex_date BETWEEN '2026-11-17' AND '2026-11-20'
                  ORDER BY ca.id DESC LIMIT 8
              """,
              "jcp_receivable_daily": """
                  SELECT estimate_date, associated_receivable_nok,
                         receivable_components_json
                  FROM other_net_assets_daily_estimates
                  WHERE estimate_date BETWEEN '2026-11-17' AND '2026-11-20'
                  ORDER BY estimate_date DESC LIMIT 8
              """,
              "relevant_documents": """
                  SELECT sd.id, sd.title, sd.url, sd.published_at,
                         sd.content_sha256, s.code AS source_code
                  FROM source_documents sd
                  JOIN sources s ON s.id=sd.source_id
                  WHERE sd.published_at >= '2026-11-12'
                    AND (lower(sd.title) LIKE '%3t26%'
                         OR lower(sd.title) LIKE '%3q26%'
                         OR lower(sd.title) LIKE '%dividend%'
                         OR lower(sd.title) LIKE '%juros%'
                         OR lower(sd.title) LIKE '%acionistas%')
                  ORDER BY sd.id DESC LIMIT 25
              """,
              "ir_feed": """
                  SELECT value FROM runtime_state
                  WHERE key='bemobi_official_news_v1' LIMIT 1
              """,
              "q3_results": """
                  SELECT fact_key, source_document_id, payload_json
                  FROM bemobi_investor_facts
                  WHERE fact_type='RESULT'
                  ORDER BY id DESC LIMIT 3
              """,
          }
          names = list(queries)
          # Query independently: a schema mismatch in one optional check must
          # not prevent other diagnostics or the official HTTPS transport probe.
          rows = {}
          for name in names:
              try:
                  output = cf("/d1/database/" + db_id + "/query",
                              {"batch": [{"sql": queries[name]}]})
                  item = output[0]
                  if item.get("success") is False:
                      raise ValueError("Cloudflare SQL query failed")
                  rows[name] = item.get("results") or []
                  print(f"QUERY {name}: {len(rows[name])} rows")
              except urllib.error.HTTPError as exc:
                  rows[name] = []
                  print(f"QUERY {name}: HTTP {exc.code}")
              except (ValueError, KeyError, IndexError, TypeError) as exc:
                  rows[name] = []
                  print(f"QUERY {name}: {type(exc).__name__}")

          for full in rows["latest_full_refresh"]:
              print("FULL status=", full.get("status"),
                    "started=", full.get("started_at"),
                    "finished=", full.get("finished_at"))
              try:
                  metadata = json.loads(full.get("metadata_json") or "{}")
              except (TypeError, ValueError):
                  metadata = {}
              if isinstance(metadata, dict):
                  print("FULL metadata keys=", sorted(metadata.keys()))
                  for key, val in metadata.items():
                      if key == "sources" and isinstance(val, dict):
                          print("FULL sources keys=", sorted(val.keys()))
                          for subkey, part in val.items():
                              if isinstance(part, dict) and ("bemobi" in subkey.lower() or "web" in subkey.lower()):
                                  print("FULL sources", subkey, "=", json.dumps(part, ensure_ascii=False)[:2200])
                      if isinstance(val, dict):
                          for sub in ("distribution_ingestion", "result_release"):
                              if sub in val:
                                  print("FULL", key, sub, "=", json.dumps(val[sub], ensure_ascii=False)[:2000])

          for action in rows["q3_jcp_actions"]:
              safe = {key: action.get(key) for key in (
                  "id", "action_type", "announcement_date", "record_date",
                  "ex_date", "payment_date", "amount_per_share",
                  "gross_total_amount", "net_amount_per_share",
                  "net_total_amount", "withholding_rate",
                  "external_action_id", "content_sha256"
              )}
              print("JCP_ACTION", json.dumps(safe, ensure_ascii=False))

          for daily in rows["jcp_receivable_daily"]:
              raw = daily.get("receivable_components_json") or "[]"
              try:
                  comps = json.loads(raw)
              except (TypeError, ValueError):
                  comps = []
              q3 = [
                  x for x in comps if isinstance(x, dict)
                  and (x.get("ex_date") == "2026-11-18"
                       or x.get("action_type") == "JCP")
              ] if isinstance(comps, list) else []
              print("RECEIVABLE", daily.get("estimate_date"),
                    daily.get("associated_receivable_nok"),
                    "jcp_components=", json.dumps(q3, ensure_ascii=False)[:1400])

          for saved in rows["ir_feed"]:
              try:
                  ir = json.loads(saved.get("value") or "{}")
              except (ValueError, TypeError):
                  ir = {}
              if isinstance(ir, dict):
                  print("IR_FEED checked_date=", ir.get("checked_date"),
                        "total=", len(ir.get("rows") or []))
                  for doc in ir.get("rows") or []:
                      if isinstance(doc, dict) and str(doc.get("date") or "") >= "2026-11-12":
                          print("IR_FEED_DOC", doc.get("date"),
                                doc.get("document_kind"), str(doc.get("title") or "")[:90],
                                urllib.parse.urlsplit(str(doc.get("url") or "")).hostname)

          for document in rows["relevant_documents"]:
              print("DOCUMENT", document.get("id"), document.get("source_code"),
                    str(document.get("title") or "")[:110],
                    urllib.parse.urlsplit(str(document.get("url") or "")).hostname,
                    document.get("published_at"))

          for fact in rows["q3_results"]:
              try:
                  payload = json.loads(fact.get("payload_json") or "{}")
              except (ValueError, TypeError):
                  payload = {}
              values = {
                  key: payload.get(key) for key in (
                      "period", "cash_mbrl", "adjusted_net_revenue_mbrl",
                      "adjusted_ebitda_mbrl", "adjusted_ebitda_margin_pct"
                  )
              }
              print("RESULT", fact.get("fact_key"), values)

          # The official PDF endpoints have had HTTP 526 from Cloudflare Workers.
          # A separate GitHub runner differentiates source outage from Worker TLS.
          urls = [
              ("CVM_3Q26_RELEASE",
               "https://www.rad.cvm.gov.br/ENETCONSULTA/frmDownloadDocumento.aspx?CodigoInstituicao=1&Tela=99&descTipo=IPE&numProtocolo=1588745&numSequencia=1113451&numVersao=1"),
              ("CVM_3Q26_JCP",
               "https://www.rad.cvm.gov.br/ENET/frmDownloadDocumento.aspx?CodigoInstituicao=1&Tela=ext&descTipo=IPE&numProtocolo=1588756&numSequencia=1113462&numVersao=1"),
          ]
          for document in rows["relevant_documents"]:
              url = str(document.get("url") or "")
              host = urllib.parse.urlsplit(url).hostname
              if (url.startswith("https://") and
                  host in {"api.mziq.com", "filemanager-cdn.mziq.com"}
                  and "deed72f2-beae-4c6f-b423-db57178bae31" in url):
                  urls.append((f"MZIQ_DOC_{document['id']}", url))

          for saved in rows["ir_feed"]:
              try:
                  ir = json.loads(saved.get("value") or "{}")
              except (ValueError, TypeError):
                  ir = {}
              for doc in ir.get("rows") or []:
                  if (isinstance(doc, dict) and doc.get("date") == "2026-11-12"
                      and doc.get("document_kind") == "NOTICE"):
                      urls.append(("MZIQ_Q3_JCP", str(doc.get("url") or "")))

          seen = set()
          for name, url in urls:
              if url in seen:
                  continue
              seen.add(url)
              if len(seen) > 9:
                  break
              req = urllib.request.Request(
                  url, headers={"User-Agent": "OtelloTracker/1.0", "Accept": "application/pdf,*/*"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      # A bounded stream, never output PDF content or secrets.
                      max_bytes = 28 * 1024 * 1024 if name == "CVM_3Q26_RELEASE" else 12 * 1024 * 1024
                      body = response.read(max_bytes + 1)
                      if (name == "CVM_3Q26_JCP" and body.startswith(b"%PDF")
                              and len(body) <= 2 * 1024 * 1024):
                          with open("q3-jcp-official.pdf", "wb") as handle:
                              handle.write(body)
                      if (name == "MZIQ_Q3_JCP" and body.startswith(b"%PDF")
                              and len(body) <= 2 * 1024 * 1024):
                          with open("q3-jcp-ir.pdf", "wb") as handle:
                              handle.write(body)
                      print("PDF", name, "status=", response.status,
                            "valid_pdf=", body.startswith(b"%PDF"),
                            "size=", len(body),
                            "reported_length=", response.headers.get("Content-Length"),
                            "sha256=", hashlib.sha256(body).hexdigest()
                            if body.startswith(b"%PDF") and len(body) <= max_bytes
                            else "-")
              except urllib.error.HTTPError as exc:
                  print("PDF", name, "http_status=", exc.code)
              except urllib.error.URLError as exc:
                  print("PDF", name, "transport_error=", type(exc.reason).__name__)
              except (TimeoutError, OSError, ssl.SSLError) as exc:
                  print("PDF", name, "transport_error=", type(exc).__name__)

          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Bemobi IR / JCP – lesediagnose\n\n")
                  handle.write(f"- Nattkjøring: {rows['latest_full_refresh'][0].get('status') if rows['latest_full_refresh'] else 'ikke funnet'}\n")
                  handle.write(f"- Q3 JCP-rader i D1: {len(rows['q3_jcp_actions'])}\n")
                  handle.write(f"- D1 fordringsdager: {len(rows['jcp_receivable_daily'])}\n")
                  handle.write("- Se steglogg for transportstatus (kun offisielle domener) og kontrollerte beløp.\n")
          PY
      - name: Validate Q3 JCP from official CVM PDF with production parser
        shell: bash
        run: |
          python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
          PYTHONPATH=cloudflare/src python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from bemobi_web_refresh import _pdf_text
          from bemobi_distribution_ingestion import parse_official_distribution

          samples = [
              ("CVM", "q3-jcp-official.pdf", "11e9b67b4711459c1f0f32636170ca24bc4b2478a748c3a83b7e4b6a654b5bbf"),
              ("MZIQ", "q3-jcp-ir.pdf", "ae8144a7eaf40ded49dff88f78379afbcc4456d4a18b0a099f23f0ec54523870"),
          ]
          matches = 0
          for source, filename, expected_sha in samples:
              if not Path(filename).exists():
                  print("OFFICIAL_JCP", source, "download_missing")
                  continue
              payload = Path(filename).read_bytes()
              sha = hashlib.sha256(payload).hexdigest()
              assert len(payload) <= 2 * 1024 * 1024 and payload.startswith(b"%PDF")
              assert sha == expected_sha, "Official CVM/MZiQ file changed; stop for review"
              text = _pdf_text(payload)
              print("OFFICIAL_JCP", source, "sha256=", sha, "text_length=", len(text))
              try:
                  parsed = parse_official_distribution(text, published_date="2026-11-12")
              except ValueError as exc:
                  print("OFFICIAL_JCP", source, "parser_error=", str(exc))
                  print("OFFICIAL_JCP", source, "extract_start=", " ".join(text.split())[:3400])
                  continue
              print("OFFICIAL_JCP", source, "parsed=", parsed)
              assert parsed["action_type"] == "JCP"
              assert parsed["ex_date"] == "2026-11-18"
              assert parsed["payment_date"] == "2026-11-30"
              assert parsed["gross_amount_per_share"] == "0.19178292"
              assert parsed["net_amount_per_share"] == "0.15822091"
              matches += 1
          assert matches, "The strict production parser cannot yet parse original official Q3 JCP PDFs"
          PY
      - name: Regression tests for automatic Bemobi distribution ingestion
        shell: bash
        run: |
          PYTHONPATH=cloudflare/src python3 -m pytest -q backend/tests/test_bemobi_distribution_auto_ingestion.py
