name: Bemobi translation queue private R2 mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '12 */2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/bemobi-translation-r2-mirror.yml
      - tools/mirror_bemobi_translation_queue.py
      - cloudflare/src/bemobi_translation_mirror.py
  pull_request:
    paths:
      - .github/workflows/bemobi-translation-r2-mirror.yml
      - tools/mirror_bemobi_translation_queue.py
      - cloudflare/src/bemobi_translation_mirror.py
      - backend/tests/test_bemobi_translation_mirror.py

permissions:
  contents: read
concurrency:
  group: bemobi-translation-r2-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - run: python3 -m pytest -q backend/tests/test_bemobi_translation_mirror.py

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Read unresolved CVM document IDs (read-only)
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/mirror_bemobi_translation_queue.py collect "$RUNNER_TEMP/translation-mirror"
      - name: Independently verify CVM listing and PDF without credentials
        run: python3 tools/mirror_bemobi_translation_queue.py build "$RUNNER_TEMP/translation-mirror"
      - run: npm ci --prefix cloudflare --no-audit --no-fund
      - name: Upload and read back verified original PDFs and manifests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
        run: python3 tools/mirror_bemobi_translation_queue.py publish "$RUNNER_TEMP/translation-mirror"
