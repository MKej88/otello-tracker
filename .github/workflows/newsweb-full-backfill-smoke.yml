name: NewsWeb full backfill smoke

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Full NewsWeb OTEC buyback backfill
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from app.buybacks.official_backfill import seed_known_official_buybacks
          from app.db.connection import get_connection
          from app.db.migration_runner import init_database
          from app.history import seed_curated_history
          from app.newsweb import collect_newsweb_buybacks, newsweb_buyback_status, sync_newsweb_daily_buyback_cash

          with tempfile.TemporaryDirectory() as tmp:
              db = str(Path(tmp) / "full-newsweb.db")
              init_database(db)
              seed_curated_history(db)
              seed_known_official_buybacks(db)

              result = collect_newsweb_buybacks(
                  db,
                  from_date="2024-07-01",
                  to_date="2026-08-17",
                  timeout=45,
              )
              print("RESULT", json.dumps(result, indent=2, ensure_ascii=False, default=str))
              print("STATUS", json.dumps(newsweb_buyback_status(db), indent=2, ensure_ascii=False, default=str))

              if result["errors"]:
                  raise SystemExit(f"Full NewsWeb backfill has hard errors: {result['errors']}")
              if result["discovered"] < 80:
                  raise SystemExit(f"Unexpectedly low NewsWeb history: {result['discovered']} messages")
              if result["daily_rows"] < 150:
                  raise SystemExit(f"Unexpectedly low transaction detail: {result['daily_rows']} daily rows")
              if result["attachment_review_count"] > 10:
                  raise SystemExit(f"Too many attachment-review fallbacks: {result['attachment_review_count']}")

              sync = sync_newsweb_daily_buyback_cash(db)
              print("SYNC", json.dumps(sync, indent=2, ensure_ascii=False, default=str))
              if sync["weeks_synced"] < 30:
                  raise SystemExit(f"Unexpectedly low daily cash coverage: {sync['weeks_synced']} weeks")

              with get_connection(db) as connection:
                  duplicate = connection.execute(
                      """
                      SELECT buyback_id, movement_date, COUNT(*) n
                      FROM cash_movements
                      WHERE movement_type='OTELLO_BUYBACK_DAILY'
                      GROUP BY buyback_id, movement_date HAVING COUNT(*) > 1 LIMIT 1
                      """
                  ).fetchone()
                  if duplicate is not None:
                      raise SystemExit(f"Duplicate daily cash row: {dict(duplicate)}")
                  both = connection.execute(
                      """
                      SELECT b.id, b.trade_date
                      FROM buybacks b
                      WHERE EXISTS (SELECT 1 FROM buyback_daily_transactions d WHERE d.weekly_buyback_id=b.id)
                        AND EXISTS (SELECT 1 FROM cash_movements c WHERE c.buyback_id=b.id AND c.movement_type='OTELLO_BUYBACK')
                      LIMIT 1
                      """
                  ).fetchone()
                  if both is not None:
                      raise SystemExit(f"Weekly and daily cash coexist: {dict(both)}")
          PY
