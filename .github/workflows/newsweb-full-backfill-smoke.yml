name: NewsWeb targeted diagnostics

on:
  push:
    branches: [phase-9-3-newsweb-attachments]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Inspect representative NewsWeb messages
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from app.newsweb.client import fetch_message, fetch_attachment
          from app.newsweb.buyback_transactions import extract_pdf_text

          ids = [624164, 636740, 645960, 651534, 659136, 659798, 660352, 669033, 672926, 674961, 678911]
          for mid in ids:
              print("\n" + "=" * 100)
              print("MESSAGE", mid)
              try:
                  m = fetch_message(mid, timeout=45)
              except Exception as exc:
                  print("MESSAGE_ERROR", type(exc).__name__, str(exc))
                  continue
              print("PUBLISHED", m.published_at)
              print("TITLE", m.title)
              print("BODY_BEGIN")
              print(m.body[:12000])
              print("BODY_END")
              print("ATTACHMENTS", [(a.attachment_id, a.name) for a in m.attachments])
              for a in m.attachments:
                  if not a.name.lower().endswith('.pdf'):
                      continue
                  if 'transaksjon' not in a.name.lower() and 'transaction' not in a.name.lower():
                      continue
                  print("PDF", a.attachment_id, a.name)
                  try:
                      pdf = fetch_attachment(mid, a.attachment_id, timeout=45)
                      text = extract_pdf_text(pdf)
                      print("PDF_TEXT_BEGIN")
                      print(text[:16000])
                      print("PDF_TEXT_END")
                  except Exception as exc:
                      print("PDF_ERROR", type(exc).__name__, str(exc))
          PY
