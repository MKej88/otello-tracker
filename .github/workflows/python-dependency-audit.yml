name: Python dependency audit

on:
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "cloudflare/pyproject.toml"
      - ".github/workflows/python-dependency-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/requirements.txt"
      - "cloudflare/pyproject.toml"
      - ".github/workflows/python-dependency-audit.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit backend dependencies
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off
      - name: Audit Cloudflare runtime dependencies
        run: python -m pip_audit cloudflare --progress-spinner off
