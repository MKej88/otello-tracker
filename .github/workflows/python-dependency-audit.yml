name: Python dependency audit

on:
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "backend/requirements.lock.txt"
      - "backend/requirements-dev.txt"
      - "backend/requirements-dev.lock.txt"
      - "cloudflare/pyproject.toml"
      - "cloudflare/worker-tooling.in"
      - "cloudflare/worker-tooling.lock.txt"
      - "tools/pip-audit.in"
      - "tools/pip-audit.lock.txt"
      - ".github/workflows/python-dependency-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/requirements.txt"
      - "backend/requirements.lock.txt"
      - "backend/requirements-dev.txt"
      - "backend/requirements-dev.lock.txt"
      - "cloudflare/pyproject.toml"
      - "cloudflare/worker-tooling.in"
      - "cloudflare/worker-tooling.lock.txt"
      - "tools/pip-audit.in"
      - "tools/pip-audit.lock.txt"
      - ".github/workflows/python-dependency-audit.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned pip-audit
        run: python -m pip install --require-hashes -r tools/pip-audit.lock.txt
      - name: Audit backend dependencies
        run: python -m pip_audit -r backend/requirements.lock.txt --progress-spinner off
      - name: Audit Cloudflare runtime dependencies
        run: python -m pip_audit cloudflare --progress-spinner off
