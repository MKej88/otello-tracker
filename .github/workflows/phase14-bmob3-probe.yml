name: Phase 14 BMOB3 probe

on:
  push:
    branches: ["phase-14-2-bmob3-light-feed"]

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[bmob3 probe result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Probe B3 BMOB3 sources
        shell: bash
        run: |
          set +e
          python - <<'PY' > phase14-bmob3-probe.txt 2>&1
          import urllib.request
          from datetime import datetime, timezone

          urls = [
              "https://cotacao.b3.com.br/mds/api/v1/instrumentQuotation/BMOB3",
              "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D14082026.ZIP",
              "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D17082026.ZIP",
          ]
          print("probed_at_utc=", datetime.now(timezone.utc).isoformat())
          for url in urls:
              print("\nURL", url)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 otello-tracker/0.4", "Connection": "close"})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      body = r.read()
                      print("status=", r.status)
                      print("content_type=", r.headers.get("content-type"))
                      print("content_length=", len(body))
                      if body.startswith(b"PK"):
                          print("zip_signature= true")
                      else:
                          print(body[:12000].decode("utf-8", errors="replace"))
              except Exception as exc:
                  print("ERROR", repr(exc))
          PY
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase14-bmob3-probe.txt
          git commit -m "[bmob3 probe result] B3 daily source availability" || exit 0
          git push
