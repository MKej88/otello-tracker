name: Buyback forecast diagnostic

on:
  push:
    branches: ["phase-13-buyback-forecast"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run forecast unit tests
        run: PYTHONPATH=. pytest -q tests/test_buyback_forecast.py
      - name: Validate previous-day Euronext trade volume
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import defaultdict
          from decimal import Decimal
          from app.marketdata.euronext_delayed import download_euronext_delayed_equities, parse_euronext_delayed_trades

          url, payload = download_euronext_delayed_equities("PREVIOUS_TRADING_DAY")
          totals = defaultdict(lambda: Decimal("0"))
          for trade in parse_euronext_delayed_trades(payload):
              totals[trade.trading_date] += trade.quantity
          print({key: str(value) for key, value in sorted(totals.items())})
          assert totals["2026-08-14"] == Decimal("24952"), (
              f"Euronext delayed trade sum {totals['2026-08-14']} does not reconcile "
              "to official historical Number of Shares 24952 for 2026-08-14"
          )
          PY
      - name: Smoke production forecast with live NewsWeb and daily cash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from app.buybacks import buyback_forecast, seed_otec_activity_history, sync_current_program_terms
          from app.buybacks.official_backfill import seed_known_official_buybacks
          from app.db.migration_runner import init_database
          from app.history import seed_curated_history
          from app.newsweb import collect_newsweb_buybacks, sync_newsweb_daily_buyback_cash

          with tempfile.TemporaryDirectory() as directory:
              db = str(Path(directory) / "forecast-smoke.db")
              init_database(db)
              seed_curated_history(db)
              seed_otec_activity_history(db)
              seed_known_official_buybacks(db)
              live = collect_newsweb_buybacks(db, from_date="2026-06-08", to_date="2026-08-17")
              assert live["status"] == "ok", live
              assert not live["errors"], live["errors"]
              sync_newsweb_daily_buyback_cash(db)
              terms = sync_current_program_terms(db, to_date="2026-08-17")
              assert terms["status"] == "ok", terms
              assert terms["max_price_nok"] == "20", terms
              assert terms["period_starts_missing"] == 0, terms
              assert terms["period_starts_written"] >= 10, terms
              forecast = buyback_forecast(db, as_of_date="2026-08-17")
              print(json.dumps(forecast, indent=2, ensure_ascii=False))
              assert forecast["ready"] is True
              assert forecast["forecast_week"]["from"] == "2026-08-17"
              assert forecast["forecast_week"]["to"] == "2026-08-21"
              assert forecast["price_model"]["state"] == "OPEN"
              assert forecast["active_program_backtest"]["weeks"] == 10
              assert 61000 <= forecast["estimate"]["base_case_shares"] <= 63000, forecast["estimate"]
              assert forecast["estimate"]["confidence"] == "HIGH"
          PY
      - name: Run regime-sensitive buyback forecast backtest
        run: PYTHONPATH=. python -m app.jobs.backtest_buyback_forecast_v2 --to 2026-08-14
