name: Bootstrap Cloudflare production D1
run-name: One-time Cloudflare D1 bootstrap

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap-cloudflare-production.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
      BOOTSTRAP_DATE: "2026-08-18"
      OTEC_ENCODED_LENGTH: "25748"
      OTEC_GZIP_SHA256: "6ee71a31d1790be63e4c58a04d970b86a791348d3c6510c30caa622fb159db20"
      OTEC_RAW_SHA256: "199a787558ac67055171bd4b0ea362b2c75a69bbc85a523825875faf367b109f"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate bootstrap safety settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"
          test -n "$CLOUDFLARE_R2_BUCKET_NAME"
          if [ "$CLOUDFLARE_DEPLOY_ENABLED" = "true" ]; then
            echo '::error::Disable automatic production deploy before running the one-time D1 bootstrap.'
            exit 1
          fi

      - name: Install bootstrap dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          npm install --no-save wrangler@4.123.0

      - name: Decode and verify historical OTEC input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          parts = [
              Path(f'bootstrap_inputs/otec_investing_20260814.part{i}.b64')
              for i in range(4)
          ]
          missing = [str(path) for path in parts if not path.exists()]
          if missing:
              raise SystemExit(f'Missing OTEC bootstrap part(s): {missing}')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          expected_length = int(os.environ['OTEC_ENCODED_LENGTH'])
          if len(encoded) != expected_length:
              raise SystemExit(
                  f'OTEC encoded length mismatch: {len(encoded)} != {expected_length}'
              )

          compressed = base64.b64decode(encoded, validate=True)
          compressed_digest = hashlib.sha256(compressed).hexdigest()
          expected_compressed = os.environ['OTEC_GZIP_SHA256']
          if compressed_digest != expected_compressed:
              raise SystemExit(
                  'OTEC gzip checksum mismatch: '
                  f'{compressed_digest} != {expected_compressed}'
              )

          raw = gzip.decompress(compressed)
          digest = hashlib.sha256(raw).hexdigest()
          expected = os.environ['OTEC_RAW_SHA256']
          if digest != expected:
              raise SystemExit(f'OTEC bootstrap checksum mismatch: {digest} != {expected}')

          output = Path('/tmp/otec-investing-history.csv')
          output.write_bytes(raw)
          print(
              'Validated OTEC bootstrap input: '
              f'{len(raw)} bytes, gzip_sha256={compressed_digest}, raw_sha256={digest}'
          )
          PY

      - name: Build clean production SQLite and run strict preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/otello-production.db data/otello-production.db-shm data/otello-production.db-wal
          cd backend
          PYTHONPATH=. python -m app.jobs.bootstrap_production \
            --database ../data/otello-production.db \
            --date "$BOOTSTRAP_DATE" \
            --otec-investing-csv /tmp/otec-investing-history.csv \
            --strict | tee /tmp/otello-bootstrap-result.json

      - name: Re-run strict production preflight explicitly
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          PYTHONPATH=. python -m app.jobs.preflight \
            --database ../data/otello-production.db \
            --date "$BOOTSTRAP_DATE" \
            --strict | tee /tmp/otello-preflight-result.json

      - name: Create deterministic D1 bootstrap package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/d1-bootstrap
          python cloudflare/tools/d1_bootstrap.py export \
            --database data/otello-production.db \
            --sql data/d1-bootstrap/otello-production.sql \
            --manifest data/d1-bootstrap/otello-production.manifest.json \
            --production \
            --date "$BOOTSTRAP_DATE" | tee /tmp/otello-d1-export-result.json

      - name: Render production Wrangler config
        run: python cloudflare/tools/render_production_config.py

      - name: Apply remote D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc

      - name: Import deterministic production bootstrap into remote D1
        working-directory: cloudflare
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc \
            --file ../data/d1-bootstrap/otello-production.sql

      - name: Check remote D1 foreign keys
        working-directory: cloudflare
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc \
            --command "PRAGMA foreign_key_check;"

      - name: Verify exact remote D1 parity
        shell: bash
        run: |
          set -euo pipefail
          python cloudflare/tools/d1_bootstrap.py verify-remote \
            --database DB \
            --manifest data/d1-bootstrap/otello-production.manifest.json \
            --config cloudflare/wrangler.production.jsonc \
            --wrangler-version 4.123.0 | tee /tmp/otello-remote-verify-result.json

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otello-production-bootstrap-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/otello-bootstrap-result.json
            /tmp/otello-preflight-result.json
            /tmp/otello-d1-export-result.json
            /tmp/otello-remote-verify-result.json
            data/d1-bootstrap/otello-production.manifest.json
