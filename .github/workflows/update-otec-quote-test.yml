name: Update OTEC quote test

on:
  push:
    branches:
      - fix/otec-live-last-everywhere

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-live-last-everywhere
      - name: Update changed semantics test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_market_quote_details.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "def test_otec_card_uses_completed_close_and_previous_day_close(tmp_path) -> None:",
              "def test_otec_card_prefers_latest_trade_and_keeps_previous_day_close(tmp_path) -> None:",
              1,
          )
          old = '''    assert otec["last"] == 17.48
    assert otec["last_price_type"] == "CLOSE"
    assert otec["last_updated_at"] == "2026-08-28T16:20:00+02:00"'''
          new = '''    assert otec["last"] == 17.28
    assert otec["last_price_type"] == "LAST"
    assert otec["last_updated_at"] == "2026-08-28T14:03:00Z"'''
          if old not in text:
              raise SystemExit("Fant ikke gamle OTEC-forventninger")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/update-otec-quote-test.yml").unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Oppdater test for siste OTEC-handel"
          git push origin HEAD:fix/otec-live-last-everywhere
