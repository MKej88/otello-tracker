name: Email config probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/email-config-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: otello-tracker
      WORKFLOW_NAME: otello-full-refresh
    steps:
      - name: Check production status, email binding and current Workflow step
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent --retry 3 --retry-delay 2 \
            https://otellotracker.com/api/dashboard/runtime-status -o runtime.json
          python - <<'PY'
          import json
          with open('runtime.json', encoding='utf-8') as f:
              r=json.load(f)
          fr=r.get('full_refresh') or {}
          print('RUNTIME_STATUS', r.get('status'))
          print('FULL_STATUS', fr.get('status'))
          print('FULL_STARTED_AT', fr.get('started_at'))
          print('FULL_FINISHED_AT', fr.get('finished_at'))
          print('FULL_RECORDS_WRITTEN', fr.get('records_written'))
          print('FULL_HAS_ERROR', fr.get('has_error'))
          print('FULL_ERROR', fr.get('error_message'))
          PY

          code=$(curl --silent --show-error --output worker-settings.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          echo "WORKER_SETTINGS_HTTP $code"
          if [ "$code" = "200" ]; then
            python - <<'PY'
          import json
          with open('worker-settings.json', encoding='utf-8') as f:
              payload=json.load(f)
          bindings=(payload.get('result') or {}).get('bindings') or []
          email=[b for b in bindings if b.get('type')=='send_email']
          status=[b for b in email if b.get('name')=='STATUS_EMAIL']
          print('BINDING_NAMES', sorted(str(b.get('name')) for b in bindings if b.get('name')))
          print('SEND_EMAIL_BINDING_COUNT', len(email))
          print('STATUS_EMAIL_BINDING', bool(status))
          PY
          fi

          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Accept: application/json' \
            "${base}?per_page=3&direction=desc" -o recent.json
          instance_id=$(python - <<'PY'
          import json
          with open('recent.json', encoding='utf-8') as f:
              p=json.load(f)
          rows=p.get('result') or []
          print(rows[0]['id'] if rows else '')
          PY
          )
          encoded=$(python - "$instance_id" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=''))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Accept: application/json' \
            "${base}/${encoded}?order=asc" -o detail.json
          python - <<'PY'
          import json
          with open('detail.json', encoding='utf-8') as f:
              p=json.load(f)
          r=p.get('result') or {}
          print('WORKFLOW_INSTANCE', r.get('id'))
          print('WORKFLOW_STATUS', r.get('status'))
          print('WORKFLOW_START', r.get('start') or r.get('started_on'))
          print('WORKFLOW_END', r.get('end') or r.get('ended_on'))
          steps=r.get('steps') or []
          print('WORKFLOW_STEP_COUNT', len(steps))
          for s in steps[-12:]:
              attempts=s.get('attempts') or []
              print('STEP', s.get('name'), 'SUCCESS', s.get('success'), 'ATTEMPTS', len(attempts), 'START', s.get('start'), 'END', s.get('end'))
              if s.get('error'):
                  print('STEP_ERROR', str(s.get('error'))[:500])
              for a in attempts:
                  if a.get('error'):
                      print('ATTEMPT_ERROR', str(a.get('error'))[:500])
          PY
