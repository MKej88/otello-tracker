name: Temporary Life360 CI bookkeeping fix

on:
  push:
    branches:
      - fix/life360-historical-mark-to-market
    paths:
      - .github/workflows/tmp-life360-ci-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life360-historical-mark-to-market
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update migration bookkeeping and parity tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def ensure_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise RuntimeError(f"marker not found: {label}")
              return text.replace(old, new, 1)

          p = Path('backend/app/db/d1_bootstrap.py')
          t = p.read_text()
          t = ensure_once(
              t,
              'LATEST_SQLITE_MIGRATION = "0027"',
              'LATEST_SQLITE_MIGRATION = "0028"',
              'latest sqlite migration',
          )
          p.write_text(t)

          p = Path('backend/tests/test_database.py')
          t = p.read_text()
          t = ensure_once(t, '"0025", "0026", "0027",', '"0025", "0026", "0027", "0028",', 'migration list')
          t = ensure_once(t, 'status["latest_migration"] == "0027"', 'status["latest_migration"] == "0028"', 'status latest migration')
          t = ensure_once(t, 'payload["latest_migration"] == "0027"', 'payload["latest_migration"] == "0028"', 'payload latest migration')
          t = ensure_once(t, 'status["table_counts"]["sources"] == 18', 'status["table_counts"]["sources"] == 19', 'status source count')
          t = ensure_once(t, 'payload["table_counts"]["sources"] == 18', 'payload["table_counts"]["sources"] == 19', 'payload source count')
          p.write_text(t)

          for filename in ('backend/tests/test_d1_schema_parity.py', 'backend/tests/test_d1_bootstrap.py'):
              p = Path(filename)
              t = p.read_text()
              old_const = 'D1_OTEC_ACTIVITY_SOURCE = ROOT / "cloudflare" / "migrations" / "0018_otec_market_activity_source.sql"'
              new_const = old_const + '\nD1_LIFE360_PRICE_BACKFILL = ROOT / "cloudflare" / "migrations" / "0020_life360_price_backfill.sql"'
              t = ensure_once(t, old_const, new_const, f'{filename} migration constant')
              old_exec = 'connection.executescript(D1_OTEC_ACTIVITY_SOURCE.read_text(encoding="utf-8"))' if filename.endswith('test_d1_bootstrap.py') else 'd1.executescript(D1_OTEC_ACTIVITY_SOURCE.read_text(encoding="utf-8"))'
              new_exec = old_exec + '\n        ' + ('connection' if filename.endswith('test_d1_bootstrap.py') else 'd1') + '.executescript(D1_LIFE360_PRICE_BACKFILL.read_text(encoding="utf-8"))'
              t = ensure_once(t, old_exec, new_exec, f'{filename} migration execution')
              p.write_text(t)
          PY

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r backend/requirements-dev.txt

      - name: Run bookkeeping regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd backend
          PYTHONPATH=. python -m pytest -q \
            tests/test_d1_bootstrap.py \
            tests/test_d1_schema_parity.py \
            tests/test_database.py \
            tests/test_life360_price_backfill_migration.py
          cd ..
          python cloudflare/tools/generate_d1_schema.py --check
          python cloudflare/tools/build_d1_bootstrap_fixture.py --database /tmp/lif-ci-reference.db
          python cloudflare/tools/d1_bootstrap.py export \
            --database /tmp/lif-ci-reference.db \
            --sql /tmp/lif-ci-bootstrap.sql \
            --manifest /tmp/lif-ci-bootstrap.json

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-life360-ci-fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'Oppdater migrasjonsparitet for Life360-backfill'
          git push origin HEAD:fix/life360-historical-mark-to-market
