name: Deploy Cloudflare production

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tested_sha:
        description: "Eksakt main-SHA som har bestått hele CI-kjeden"
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_D1_DATABASE_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (inputs.tested_sha != '' &&
       github.ref == 'refs/heads/main' &&
       inputs.tested_sha == github.sha)
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
    steps:
      - name: Resolve production deploy gate
        id: resolve
        shell: bash
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual production deploy approved for main."
          elif [ "$AUTO_DEPLOY_ENABLED" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Automatic production deploy is enabled after the complete CI gate."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Automatic production deploy is disabled by the production environment variable."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
      CLOUDFLARE_STATUS_EMAIL_TO: ${{ vars.CLOUDFLARE_STATUS_EMAIL_TO }}
      CLOUDFLARE_STATUS_EMAIL_FROM: ${{ vars.CLOUDFLARE_STATUS_EMAIL_FROM }}
      CLOUDFLARE_WAF_COST_GUARD_READY: ${{ vars.CLOUDFLARE_WAF_COST_GUARD_READY }}
    steps:
      - name: Check out tested production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tested_sha || github.sha }}
          persist-credentials: false

      - name: Verify deployment revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.tested_sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual_sha, but the tested deployment SHA is $EXPECTED_SHA."
            exit 1
          fi
          echo "Deploying tested revision: $actual_sha"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Validate required Cloudflare deployment settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_WORKER_NAME"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"
          test -n "$CLOUDFLARE_R2_BUCKET_NAME"
          if [ -z "$CLOUDFLARE_CUSTOM_DOMAIN" ]; then
            echo '::error::CLOUDFLARE_CUSTOM_DOMAIN is required for production so WAF can protect /api/* before Worker invocation.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PUBLIC_URL" ]; then
            echo '::error::CLOUDFLARE_PUBLIC_URL is required so every production deploy runs HTTP acceptance.'
            exit 1
          fi
          if [ "$CLOUDFLARE_WAF_COST_GUARD_READY" != "true" ]; then
            echo '::error::Set CLOUDFLARE_WAF_COST_GUARD_READY=true only after the zone WAF rate-limit rule for /api/* is active.'
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          public_url = os.environ['CLOUDFLARE_PUBLIC_URL'].strip()
          expected_host = os.environ['CLOUDFLARE_CUSTOM_DOMAIN'].strip().lower()
          parsed = urlparse(public_url)
          if parsed.scheme != 'https' or not parsed.hostname:
              raise SystemExit('CLOUDFLARE_PUBLIC_URL must be a valid https:// URL')
          if parsed.hostname.lower() != expected_host:
              raise SystemExit(
                  f'CLOUDFLARE_PUBLIC_URL hostname {parsed.hostname!r} does not match '
                  f'CLOUDFLARE_CUSTOM_DOMAIN {expected_host!r}'
              )
          email_to = os.environ.get('CLOUDFLARE_STATUS_EMAIL_TO', '').strip()
          email_from = os.environ.get('CLOUDFLARE_STATUS_EMAIL_FROM', '').strip()
          if bool(email_to) != bool(email_from):
              raise SystemExit(
                  'CLOUDFLARE_STATUS_EMAIL_TO and CLOUDFLARE_STATUS_EMAIL_FROM must be set together'
              )
          PY

      - name: Build dashboard assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Python Worker tooling
        working-directory: cloudflare
        run: |
          python -m pip install workers-py==1.16.2 uv==0.12.3
          npm install --no-save wrangler@4.123.0

      - name: Render production Wrangler config
        run: python cloudflare/tools/render_production_config.py

      - name: Validate rendered production config before remote changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path('cloudflare/wrangler.production.jsonc').read_text())
          assert config['name'] == os.environ['CLOUDFLARE_WORKER_NAME']
          assert config['main'] == 'src/worker.py'
          assert config['workers_dev'] is False
          assert config['routes'] == [
              {'pattern': os.environ['CLOUDFLARE_CUSTOM_DOMAIN'], 'custom_domain': True}
          ]
          d1 = config['d1_databases'][0]
          assert d1['database_id'] == os.environ['CLOUDFLARE_D1_DATABASE_ID']
          assert d1['database_name'] == os.environ['CLOUDFLARE_D1_DATABASE_NAME']
          assert config['r2_buckets'][0]['bucket_name'] == os.environ['CLOUDFLARE_R2_BUCKET_NAME']
          assert config['limits']['cpu_ms'] == 60000
          assert config['limits']['subrequests'] == 50000
          assert config['triggers']['crons'] == ['*/30 * * * *']
          workflows = {item['binding']: item for item in config['workflows']}
          assert workflows['FULL_REFRESH']['schedules'] == ['35 3 * * *']

          email_to = os.environ.get('CLOUDFLARE_STATUS_EMAIL_TO', '').strip()
          email_from = os.environ.get('CLOUDFLARE_STATUS_EMAIL_FROM', '').strip()
          if email_to:
              assert config['send_email'] == [
                  {
                      'name': 'STATUS_EMAIL',
                      'destination_address': email_to,
                      'allowed_sender_addresses': [email_from],
                  }
              ]
              variables = config['vars']
              assert variables['STATUS_EMAIL_TO'] == email_to
              assert variables['STATUS_EMAIL_FROM'] == email_from
              assert variables['PUBLIC_URL'] == os.environ['CLOUDFLARE_PUBLIC_URL'].rstrip('/')
          else:
              assert 'send_email' not in config
          PY

      - name: Dry-run exact production Worker before D1 migration
        working-directory: cloudflare
        run: >-
          pywrangler deploy --dry-run
          --config wrangler.production.jsonc
          --outdir /tmp/otello-production-predeploy

      - name: Verify vendored Worker runtime prerequisites
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -f python_modules/tzdata/__init__.py
          PYTHONPATH=python_modules python - <<'PY'
          from importlib import resources

          oslo = resources.files('tzdata.zoneinfo.Europe').joinpath('Oslo')
          assert oslo.is_file(), f'Missing vendored IANA Europe/Oslo data: {oslo}'
          print(f'Worker timezone data present: {oslo}')
          PY

      - name: Apply remote D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc

      - name: Deploy Python Worker and Workflows
        id: deploy
        working-directory: cloudflare
        run: pywrangler deploy --config wrangler.production.jsonc

      - name: Production HTTP acceptance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.tested_sha || github.sha }}
        run: |
          base="${CLOUDFLARE_PUBLIC_URL%/}"
          acceptance_token="${EXPECTED_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          q="acceptance=${acceptance_token}"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            -D /tmp/otello-index.headers "$base/?${q}" -o /tmp/otello-index.html
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/health?${q}" -o /tmp/otello-health.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/bootstrap?${q}" -o /tmp/otello-bootstrap.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/summary?${q}" -o /tmp/otello-summary.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/history?days=365&max_points=300&${q}" -o /tmp/otello-history.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/discount-history?days=365&max_points=600&${q}" -o /tmp/otello-discount-history.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/economic?${q}" -o /tmp/otello-economic.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/waterfall?${q}" -o /tmp/otello-waterfall.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/report-status?${q}" -o /tmp/otello-report-status.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/runtime-status?${q}" -o /tmp/otello-runtime-status.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/fx-backtest?${q}" -o /tmp/otello-fx-backtest.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/buybacks/forecast?${q}" -o /tmp/otello-forecast.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/buybacks/dashboard?${q}" -o /tmp/otello-buyback-dashboard.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/bemobi/dashboard?${q}" -o /tmp/otello-bemobi-dashboard.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/bemobi/consensus?${q}" -o /tmp/otello-bemobi-consensus.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/bemobi/source-status?${q}" -o /tmp/otello-bemobi-source-status.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/market/quotes?${q}" -o /tmp/otello-quotes.json
          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          index = Path('/tmp/otello-index.html').read_text()
          index_headers = Path('/tmp/otello-index.headers').read_text().lower()
          health = json.loads(Path('/tmp/otello-health.json').read_text())
          bootstrap = json.loads(Path('/tmp/otello-bootstrap.json').read_text())
          summary = json.loads(Path('/tmp/otello-summary.json').read_text())
          history = json.loads(Path('/tmp/otello-history.json').read_text())
          discount_history = json.loads(Path('/tmp/otello-discount-history.json').read_text())
          economic = json.loads(Path('/tmp/otello-economic.json').read_text())
          waterfall = json.loads(Path('/tmp/otello-waterfall.json').read_text())
          report_status = json.loads(Path('/tmp/otello-report-status.json').read_text())
          runtime_status = json.loads(Path('/tmp/otello-runtime-status.json').read_text())
          fx_backtest = json.loads(Path('/tmp/otello-fx-backtest.json').read_text())
          forecast = json.loads(Path('/tmp/otello-forecast.json').read_text())
          buyback_dashboard = json.loads(Path('/tmp/otello-buyback-dashboard.json').read_text())
          bemobi_dashboard = json.loads(Path('/tmp/otello-bemobi-dashboard.json').read_text())
          bemobi_consensus = json.loads(Path('/tmp/otello-bemobi-consensus.json').read_text())
          bemobi_source_status = json.loads(Path('/tmp/otello-bemobi-source-status.json').read_text())
          quotes = json.loads(Path('/tmp/otello-quotes.json').read_text())

          bootstrap_summary = bootstrap.get('summary') or {}
          bootstrap_economic = bootstrap.get('economic') or {}
          bootstrap_quotes = bootstrap.get('quotes') or {}
          bootstrap_meta = bootstrap.get('meta') or {}

          assert '<title>Otello NAV-oversikt</title>' in index, index[:500]
          assert 'content-security-policy:' in index_headers, index_headers
          assert 'x-content-type-options: nosniff' in index_headers, index_headers
          assert health.get('status') == 'ok', health
          assert health.get('environment') == 'cloudflare', health

          assert bootstrap_summary.get('ready') is True, bootstrap
          assert bootstrap_economic.get('ready') is True, bootstrap
          assert bootstrap_economic.get('as_of_date') == bootstrap_summary.get('as_of_date'), bootstrap
          assert bootstrap_economic['conservative_nav_per_share'] <= bootstrap_economic['nav_per_share'], bootstrap
          assert bootstrap_quotes.get('ready') is True, bootstrap
          assert bootstrap_meta.get('snapshot_version') == 2, bootstrap

          assert summary.get('ready') is True, summary
          assert bootstrap_summary.get('as_of_date') == summary.get('as_of_date'), {
              'bootstrap': bootstrap_summary.get('as_of_date'),
              'summary': summary.get('as_of_date'),
          }
          assert history.get('ready') is True and history.get('points'), history
          assert discount_history.get('ready') is True, discount_history
          estimated = discount_history.get('estimated') or {}
          assert estimated.get('composition_display_policy') == (
              'REPORT_CASH_ALLIANCE_AND_RESIDUAL_WITH_EXPLICIT_MOVEMENTS_AND_FX'
          ), estimated
          estimated_current = estimated.get('current') or {}
          split_status = estimated_current.get('composition_split_status') or {}
          assert split_status.get('ready') is True, estimated_current
          composition = estimated_current.get('composition') or []
          composition_keys = {str(item.get('key')) for item in composition}
          required_composition = {
              'reported_cash',
              'operating_cost_since_report',
              'buybacks_since_report',
              'alliance_venture_spring',
              'life360',
          }
          assert required_composition <= composition_keys, {
              'missing': sorted(required_composition - composition_keys),
              'keys': sorted(composition_keys),
              'split_status': split_status,
          }
          assert 'cash' not in composition_keys, composition_keys
          assert 'ona' not in composition_keys, composition_keys
          alliance = next(item for item in composition if item.get('key') == 'alliance_venture_spring')
          assert int((alliance.get('details') or {}).get('shares') or 0) == 7_411_532, alliance
          life360 = next(item for item in composition if item.get('key') == 'life360')
          life360_details = life360.get('details') or {}
          life360_shares = life360_details.get('shares')
          assert isinstance(life360_shares, int) and life360_shares >= 0, life360
          assert life360_details.get('holding_effective_from'), life360
          assert life360_details.get('holding_quality'), life360
          assert life360_details.get('holding_basis'), life360
          assert life360_details.get('holding_source_document_id'), life360
          assert life360_details.get('report_holding_source_document_id'), life360

          assert economic.get('ready') is True, economic
          assert economic.get('as_of_date') == summary.get('as_of_date'), {
              'summary': summary.get('as_of_date'),
              'economic': economic.get('as_of_date'),
          }
          assert bootstrap_economic.get('as_of_date') == economic.get('as_of_date'), {
              'bootstrap': bootstrap_economic.get('as_of_date'),
              'economic': economic.get('as_of_date'),
          }
          assert economic.get('nav_per_share') is not None, economic
          assert economic.get('accounting_nav_per_share') is not None, economic
          assert economic.get('conservative_nav_per_share') is not None, economic
          assert economic['conservative_nav_per_share'] <= economic['nav_per_share'], economic
          assert isinstance(economic.get('cash_fx'), dict), economic
          assert waterfall.get('ready') is True, waterfall
          assert isinstance(waterfall.get('components'), list), waterfall
          assert isinstance(report_status.get('ready'), bool), report_status
          assert report_status.get('status'), report_status
          assert isinstance(runtime_status.get('ready'), bool), runtime_status
          assert runtime_status.get('status') in {'OK', 'DEGRADED', 'DOWN'}, runtime_status
          assert isinstance(runtime_status.get('full_refresh'), dict), runtime_status
          assert isinstance(runtime_status.get('fast_refresh'), dict), runtime_status
          assert isinstance(runtime_status.get('fx'), dict), runtime_status
          assert fx_backtest.get('ready') is True, fx_backtest
          fx_summary = fx_backtest.get('summary') or {}
          assert int(fx_summary.get('periods_ready') or 0) >= 2, fx_backtest
          assert forecast.get('status') != 'INSUFFICIENT_VOLUME_HISTORY', forecast
          assert buyback_dashboard.get('ready') is True, buyback_dashboard
          buyback_program = buyback_dashboard.get('program') or {}
          buyback_latest = buyback_dashboard.get('latest_week') or {}
          buyback_shares = buyback_dashboard.get('shares') or {}
          buyback_backtest = buyback_dashboard.get('backtest') or {}
          assert int(buyback_program.get('max_shares') or 0) > 0, buyback_dashboard
          assert int(buyback_latest.get('shares') or 0) > 0, buyback_dashboard
          assert int(buyback_shares.get('treasury_shares') or 0) > 0, buyback_dashboard
          assert int(buyback_shares.get('outstanding_shares') or 0) > 0, buyback_dashboard
          assert isinstance(buyback_backtest.get('weeks'), list), buyback_dashboard
          assert bemobi_dashboard.get('ready') is True, bemobi_dashboard
          assert bemobi_consensus.get('ready') is True, bemobi_consensus
          assert bemobi_source_status.get('overall_status') in {'OK', 'PARTIAL', 'ERROR', 'UNKNOWN'}, bemobi_source_status
          assert len(bemobi_source_status.get('items') or []) == 4, bemobi_source_status
          assert quotes.get('ready') is True, quotes

          as_of = date.fromisoformat(str(summary['as_of_date'])[:10])
          today = datetime.now(ZoneInfo('Europe/Oslo')).date()
          age = (today - as_of).days
          assert 0 <= age <= 7, {'age_days': age, 'summary': summary}
          print(
              'Production HTTP acceptance passed:',
              summary.get('as_of_date'),
              summary.get('data_status'),
              f"bootstrap_source={bootstrap_meta.get('source')}",
              f"bootstrap_server_ms={bootstrap_meta.get('server_ms')}",
              f"history_points={len(history.get('points') or [])}",
              f"composition_keys={sorted(composition_keys)}",
              f"life360_mnok={life360.get('amount_mnok')}",
              f"life360_shares={life360_shares}",
              f"life360_holding_from={life360_details.get('holding_effective_from')}",
              f"economic_nav={economic.get('nav_per_share')}",
              f"waterfall_components={len(waterfall.get('components') or [])}",
              f"report_status={report_status.get('status')}",
              f"runtime_status={runtime_status.get('status')}",
              f"fx_backtest_periods={fx_summary.get('periods_ready')}",
              f"buyback_status={forecast.get('status')}",
              f"buyback_latest={buyback_latest.get('shares')}",
              f"bemobi_ready={bemobi_dashboard.get('ready')}",
              f"consensus_ready={bemobi_consensus.get('ready')}",
              f"source_status={bemobi_source_status.get('overall_status')}",
              f'age_days={age}',
          )
          PY

      - name: Roll back Worker after failed production acceptance
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: cloudflare
        shell: bash
        run: |
          echo '::warning::Deployment completed but a later production acceptance step failed.'
          echo 'Rolling the Worker back to the previous deployed version.'
          npx wrangler rollback --config wrangler.production.jsonc \
            --message "Automated rollback after failed GitHub production acceptance"
