name: Deploy Cloudflare production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
    steps:
      - name: Resolve production deploy gate
        id: resolve
        shell: bash
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual production deploy approved for main."
          elif [ "$AUTO_DEPLOY_ENABLED" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Automatic production deploy is enabled."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Automatic production deploy is disabled by the production environment variable."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      CLOUDFLARE_PUBLIC_URL: ${{ vars.CLOUDFLARE_PUBLIC_URL }}
      CLOUDFLARE_WAF_COST_GUARD_READY: ${{ vars.CLOUDFLARE_WAF_COST_GUARD_READY }}
    steps:
      - name: Check out tested production revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify deployment revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual_sha, but the tested deployment SHA is $EXPECTED_SHA."
            exit 1
          fi
          echo "Deploying tested revision: $actual_sha"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate required Cloudflare deployment settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_WORKER_NAME"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"
          test -n "$CLOUDFLARE_R2_BUCKET_NAME"
          if [ -z "$CLOUDFLARE_CUSTOM_DOMAIN" ]; then
            echo '::error::CLOUDFLARE_CUSTOM_DOMAIN is required for production so WAF can protect /api/* before Worker invocation.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PUBLIC_URL" ]; then
            echo '::error::CLOUDFLARE_PUBLIC_URL is required so every production deploy runs HTTP acceptance.'
            exit 1
          fi
          if [ "$CLOUDFLARE_WAF_COST_GUARD_READY" != "true" ]; then
            echo '::error::Set CLOUDFLARE_WAF_COST_GUARD_READY=true only after the zone WAF rate-limit rule for /api/* is active.'
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          public_url = os.environ['CLOUDFLARE_PUBLIC_URL'].strip()
          expected_host = os.environ['CLOUDFLARE_CUSTOM_DOMAIN'].strip().lower()
          parsed = urlparse(public_url)
          if parsed.scheme != 'https' or not parsed.hostname:
              raise SystemExit('CLOUDFLARE_PUBLIC_URL must be a valid https:// URL')
          if parsed.hostname.lower() != expected_host:
              raise SystemExit(
                  f'CLOUDFLARE_PUBLIC_URL hostname {parsed.hostname!r} does not match '
                  f'CLOUDFLARE_CUSTOM_DOMAIN {expected_host!r}'
              )
          PY

      - name: Build dashboard assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Python Worker tooling
        working-directory: cloudflare
        run: |
          python -m pip install workers-py==1.16.2 uv==0.12.3
          npm install --no-save wrangler@4.123.0

      - name: Render production Wrangler config
        run: python cloudflare/tools/render_production_config.py

      - name: Apply remote D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc

      - name: Deploy Python Worker and Workflow
        id: deploy
        working-directory: cloudflare
        run: pywrangler deploy --config wrangler.production.jsonc

      - name: Ensure today's Top 20 snapshot
        shell: bash
        run: |
          set -euo pipefail
          target_date="$(TZ=Europe/Oslo date +%F)"
          base="${CLOUDFLARE_PUBLIC_URL%/}"

          snapshot_ready() {
            local suffix="$1"
            if ! curl --fail --show-error --silent \
              "$base/api/shareholders/dashboard?deploy_prime=${suffix}-$(date +%s)" \
              -o /tmp/otello-shareholders-prime.json; then
              return 1
            fi
            TARGET_DATE="$target_date" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/otello-shareholders-prime.json').read_text())
          history = payload.get('history') or {}
          snapshots = history.get('snapshots') or []
          latest_rows = history.get('latest_rows') or []
          latest_date = str((snapshots[0] if snapshots else {}).get('snapshot_date') or '')[:10]
          raise SystemExit(0 if latest_date == os.environ['TARGET_DATE'] and len(latest_rows) == 20 else 1)
          PY
          }

          if snapshot_ready before; then
            echo "Top 20 snapshot already complete for ${target_date}."
            exit 0
          fi

          cd cloudflare
          npx wrangler workflows trigger otello-shareholder-snapshot \
            "{\"target_date\":\"${target_date}\"}" \
            --config wrangler.production.jsonc
          cd ..

          ready=0
          for attempt in $(seq 1 60); do
            sleep 5
            if snapshot_ready "$attempt"; then
              ready=1
              break
            fi
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::Top 20 snapshot was not ready after 300 seconds.'
            test -f /tmp/otello-shareholders-prime.json && cat /tmp/otello-shareholders-prime.json
            cd cloudflare
            npx wrangler workflows instances describe otello-shareholder-snapshot latest \
              --config wrangler.production.jsonc || true
            exit 1
          fi
          echo "Top 20 snapshot ready for ${target_date}."

      - name: Production HTTP acceptance
        shell: bash
        run: |
          base="${CLOUDFLARE_PUBLIC_URL%/}"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            -D /tmp/otello-index.headers "$base/" -o /tmp/otello-index.html
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/health" -o /tmp/otello-health.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/summary" -o /tmp/otello-summary.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/history?days=365&max_points=300" -o /tmp/otello-history.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/economic" -o /tmp/otello-economic.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/dashboard/fx-backtest" -o /tmp/otello-fx-backtest.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/buybacks/forecast" -o /tmp/otello-forecast.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/buybacks/dashboard" -o /tmp/otello-buyback-dashboard.json
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            "$base/api/shareholders/dashboard?acceptance=$(date +%s)" -o /tmp/otello-shareholders.json
          python - <<'PY'
          import json
          from datetime import UTC, date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          index = Path('/tmp/otello-index.html').read_text()
          index_headers = Path('/tmp/otello-index.headers').read_text().lower()
          health = json.loads(Path('/tmp/otello-health.json').read_text())
          summary = json.loads(Path('/tmp/otello-summary.json').read_text())
          history = json.loads(Path('/tmp/otello-history.json').read_text())
          economic = json.loads(Path('/tmp/otello-economic.json').read_text())
          fx_backtest = json.loads(Path('/tmp/otello-fx-backtest.json').read_text())
          forecast = json.loads(Path('/tmp/otello-forecast.json').read_text())
          buyback_dashboard = json.loads(Path('/tmp/otello-buyback-dashboard.json').read_text())
          shareholders = json.loads(Path('/tmp/otello-shareholders.json').read_text())

          assert '<title>Otello NAV-oversikt</title>' in index, index[:500]
          assert 'content-security-policy:' in index_headers, index_headers
          assert 'x-content-type-options: nosniff' in index_headers, index_headers
          assert health.get('status') == 'ok', health
          assert health.get('environment') == 'cloudflare', health
          assert summary.get('ready') is True, summary
          assert history.get('ready') is True and history.get('points'), history
          assert economic.get('ready') is True, economic
          assert economic.get('as_of_date') == summary.get('as_of_date'), {
              'summary': summary.get('as_of_date'),
              'economic': economic.get('as_of_date'),
          }
          assert economic.get('nav_per_share') is not None, economic
          assert economic.get('accounting_nav_per_share') is not None, economic
          assert economic.get('conservative_nav_per_share') is not None, economic
          assert economic['conservative_nav_per_share'] <= economic['nav_per_share'], economic
          assert isinstance(economic.get('cash_fx'), dict), economic
          assert fx_backtest.get('ready') is True, fx_backtest
          fx_summary = fx_backtest.get('summary') or {}
          assert int(fx_summary.get('periods_ready') or 0) >= 2, fx_backtest
          assert forecast.get('status') != 'INSUFFICIENT_VOLUME_HISTORY', forecast
          assert buyback_dashboard.get('ready') is True, buyback_dashboard
          buyback_program = buyback_dashboard.get('program') or {}
          buyback_latest = buyback_dashboard.get('latest_week') or {}
          buyback_shares = buyback_dashboard.get('shares') or {}
          buyback_backtest = buyback_dashboard.get('backtest') or {}
          assert int(buyback_program.get('max_shares') or 0) > 0, buyback_dashboard
          assert int(buyback_latest.get('shares') or 0) > 0, buyback_dashboard
          assert int(buyback_shares.get('treasury_shares') or 0) > 0, buyback_dashboard
          assert int(buyback_shares.get('outstanding_shares') or 0) > 0, buyback_dashboard
          assert isinstance(buyback_backtest.get('weeks'), list), buyback_dashboard

          shareholder_history = shareholders.get('history') or {}
          shareholder_snapshots = shareholder_history.get('snapshots') or []
          latest_rows = shareholder_history.get('latest_rows') or []
          expected_shareholder_date = datetime.now(ZoneInfo('Europe/Oslo')).date().isoformat()
          latest_shareholder_date = str(
              (shareholder_snapshots[0] if shareholder_snapshots else {}).get('snapshot_date') or ''
          )[:10]
          assert len(latest_rows) == 20, shareholders
          assert latest_shareholder_date == expected_shareholder_date, {
              'expected': expected_shareholder_date,
              'actual': latest_shareholder_date,
              'shareholders': shareholders,
          }

          as_of = date.fromisoformat(str(summary['as_of_date'])[:10])
          today = datetime.now(UTC).date()
          age = (today - as_of).days
          assert 0 <= age <= 7, {'age_days': age, 'summary': summary}
          print(
              'Production HTTP acceptance passed:',
              summary.get('as_of_date'),
              summary.get('data_status'),
              f"history_points={len(history.get('points') or [])}",
              f"economic_nav={economic.get('nav_per_share')}",
              f"fx_backtest_periods={fx_summary.get('periods_ready')}",
              f"buyback_status={forecast.get('status')}",
              f"buyback_latest={buyback_latest.get('shares')}",
              f"shareholders={len(latest_rows)}@{latest_shareholder_date}",
              f'age_days={age}',
          )
          PY

      - name: Roll back Worker after failed production acceptance
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: cloudflare
        shell: bash
        run: |
          echo '::warning::Deployment completed but a later production acceptance step failed.'
          echo 'Rolling the Worker back to the previous deployed version.'
          npx wrangler rollback --config wrangler.production.jsonc \
            --message "Automated rollback after failed GitHub production acceptance"
