name: Historical buyback live smoke

on:
  push:
    branches: ["phase-6-1-historical-buybacks"]
    paths:
      - ".github/workflows/historical-buyback-live-smoke.yml"
      - "backend/app/buybacks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verify full buyback chain
        env:
          PYTHONPATH: .
        run: |
          python -m app.jobs.collect_buybacks --database /tmp/buyback-history.db > /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          c=d['collection']
          s=d['buyback_status']
          print(json.dumps({
              'discovered': c['discovered'],
              'ingested': c['ingested'],
              'historical_coverage_complete': s['historical_coverage_complete'],
              'historical_coverage_gaps': s['historical_coverage_gaps'],
              'count': s['count'],
              'from': s['from'],
              'to': s['to'],
              'latest': s['latest'],
          }, indent=2))
          assert not c['errors'], c['errors']
          assert s['historical_coverage_complete'], s['historical_coverage_gaps']
          assert s['current_coverage_complete'], s['current_coverage_gaps']
          assert s['from'] == '2025-09-26', s
          assert s['to'] == '2026-08-14', s
          # No source duplicates: weekly row totals must equal the three program cumulative totals.
          assert s['count'] == 45, s
          PY
