name: Temporary OTEC activity patch

on:
  push:
    branches:
      - fix/otec-market-activity-backfill

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Kjør OTEC aktivitetspatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/otec-market-activity-backfill
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply scheduled integration
        run: python tools/tmp_patch_otec_activity.py
      - name: Run focused tests
        run: |
          python -m pip install --disable-pip-version-check --quiet -r backend/requirements.txt pytest
          PYTHONPATH=backend python -m pytest -q \
            backend/tests/test_cloudflare_otec_activity.py \
            backend/tests/test_buyback_investor_dashboard.py \
            backend/tests/test_cloudflare_otec_ingestion.py
          python -m py_compile cloudflare/src/otec_activity.py cloudflare/src/scheduled.py
      - name: Commit scheduled integration
        run: |
          git config user.name 'MKej88'
          git config user.email 'mads.kristensen2@gmail.com'
          git add cloudflare/src/scheduled.py
          git diff --cached --check
          git commit -m 'Koble OTEC-dagsvolum til fast refresh'
          git push origin HEAD:fix/otec-market-activity-backfill
