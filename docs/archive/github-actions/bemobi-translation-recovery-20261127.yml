name: Bemobi translation verified recovery 2026-11-27

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bemobi-translation-recovery-20261127.yml
      - tools/reactivate_bemobi_translation_documents.py
  pull_request:
    paths:
      - .github/workflows/bemobi-translation-recovery-20261127.yml
      - tools/reactivate_bemobi_translation_documents.py
      - tools/mirror_bemobi_translation_queue.py
      - backend/tests/test_bemobi_translation_recovery.py

permissions:
  contents: read

concurrency:
  group: bemobi-translation-recovery-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - run: python3 -m pytest -q backend/tests/test_bemobi_translation_recovery.py

  recover:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: python3 -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Read exactly ten incident document rows
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 tools/reactivate_bemobi_translation_documents.py collect "$RUNNER_TEMP/translation-recovery"
      - name: Investigate document 7540 without credentials or writes
        run: python3 tools/reactivate_bemobi_translation_documents.py investigate "$RUNNER_TEMP/translation-recovery"
      - run: npm ci --prefix cloudflare --no-audit --no-fund
      - name: Reverify R2 originals and reactivate only eligible verified documents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
        run: python3 tools/reactivate_bemobi_translation_documents.py recover "$RUNNER_TEMP/translation-recovery"
